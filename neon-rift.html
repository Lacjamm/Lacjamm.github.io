          desc: 'Predicts unstable rift weather, making beneficial events more common and more powerful.',
          perks: ['More rift events', 'Events hit harder / reward more', '+12 pickup range'],
          apply() { player.eventLuck += 1; player.magnet += 12; },
          weight: 4.6, minWave: 2,
        },
        {
          id: 'champion-hunter', rarity: 'epic', title: 'Champion Hunter',
          desc: 'Specialized targeting that shreds elites, bounty targets, and champion-modified enemies.',
          perks: ['+22% damage vs elites', 'Elite kills can drop bonus scrap', '+8% damage'],
          apply() { player.eliteSlayer += 0.22; player.damage *= 1.08; },
          weight: 4.2, minWave: 5,
        },
        {
          id: 'boss-cache-scanner', rarity: 'legendary', title: 'Boss Cache Scanner',
          desc: 'Cracked boss armor leaks extra resources and leaves a cleaner upgrade path after the fight.',
          perks: ['Boss kills grant rerolls', '+10% boss damage', 'Bonus boss scrap'],
          apply() { player.bossCache = (player.bossCache || 0) + 1; player.bossSlayer += 0.10; },
          weight: 1.6, minWave: 6,
        },
        {
          id: 'rift-pension', rarity: 'transcendent', title: 'Rift Pension',
          desc: 'Absurdly rare. The rift starts paying you permanent shards while also making luck builds even luckier.',
          perks: ['+16 Rift Shards instantly', '+3 Luck', '+1 reroll'],
          apply() { player.luck += 3; game.rerolls += 1; addShards(16, 'Rift pension'); },
          weight: 0.08, minWave: 8,
        },
        {
          id: 'bounty-crown', rarity: 'transcendent', title: 'Bounty Crown',
          desc: 'Elite enemies become walking treasure vaults. Risky waves turn into huge payoff windows.',
          perks: ['Elite kills can award shards', '+2 Luck', '+28% elite damage'],
          apply() { player.luck += 2; player.shardHarvest += 1; player.eliteSlayer += 0.28; },
          weight: 0.075, minWave: 10,
        }
      );

      const originalShowMenu = showMenu;
      showMenu = function showMenuDirector() {
        directorMeta = loadDirectorMeta();
        const hi = loadHighScore();
        const unlocked = achievementDefs.filter((a) => directorMeta.achievements[a.id]).length;
        setOverlay(`
          <div class="panel center">
            <div class="kicker">Director's Cut</div>
            <h1>Neon Rift</h1>
            <p class="lead">The rift now has persistent shards, armory upgrades, run contracts, achievements, random rift events, bounty elites, and more long-term goals on top of the boss chaos.</p>
            <div class="ctaRow">
              <button data-action="start">Start Run</button>
              <button class="ghost" data-action="armory">Rift Armory</button>
              <button class="ghost" data-action="codex">Records</button>
              <button class="ghost" data-action="how">Controls & Tips</button>
            </div>
            <div class="statsRow">
              <div class="bigStat"><b>High Score</b><span>${hi.toLocaleString()}</span></div>
              <div class="bigStat"><b>Rift Shards</b><span>${directorMeta.shards.toLocaleString()}</span></div>
              <div class="bigStat"><b>Achievements</b><span>${unlocked}/${achievementDefs.length}</span></div>
            </div>
            <div class="foot">Complete contracts mid-run, survive rift events, unlock achievements, then spend shards in the Armory. Press <b>M</b> for audio and <b>P</b> for pause/settings.</div>
          </div>
        `, true);
      };

      const originalShowHowTo = showHowTo;
      showHowTo = function showHowToDirector() {
        setOverlay(`
          <div class="panel">
            <div class="kicker">How to play</div>
            <h2>Survive, complete contracts, upgrade the armory.</h2>
            <p class="lead">Move constantly, dash before you get boxed in, and use Overdrive before boss phases spiral out of control. The Director's Cut adds longer-term goals without changing the core controls.</p>
            <div class="helpGrid">
              <div class="helpCard"><strong>Move / Aim</strong><span><b>WASD</b> or <b>Arrow Keys</b>. Mouse aims manually; otherwise your ship auto-targets nearby enemies.</span></div>
              <div class="helpCard"><strong>Dash</strong><span><b>Space</b> blinks through danger and can complete Blink Pilot contracts.</span></div>
              <div class="helpCard"><strong>Overdrive</strong><span><b>E</b> spends the cyan meter for a temporary damage and speed burst.</span></div>
              <div class="helpCard"><strong>Contracts</strong><span>Each run rolls three goals. Complete them for shards, rerolls, healing, shields, or overdrive.</span></div>
              <div class="helpCard"><strong>Rift Events</strong><span>Some waves gain special weather like static storms, supply comets, meteorfall, or bounty elites.</span></div>
              <div class="helpCard"><strong>Armory</strong><span>Spend Rift Shards between runs on small permanent starting bonuses.</span></div>
              <div class="helpCard"><strong>Level up</strong><span>Pick an upgrade with the mouse or number keys. Press <b>R</b> to reroll if you have rerolls.</span></div>
              <div class="helpCard"><strong>Pause/settings</strong><span>Press <b>P</b> for volume, UI scale, visuals, warnings, and screen shake settings.</span></div>
            </div>
            <div class="ctaRow"><button data-action="start">Launch Into Rift</button><button class="ghost" data-action="armory">Armory</button><button class="ghost" data-action="menu">Back</button></div>
          </div>
        `, true);
      };

      const originalStartGame = startGame;
      startGame = function startGameDirector() {
        originalStartGame();
        startDirectorRun();
      };

      const originalNextWave = nextWave;
      nextWave = function nextWaveDirector() {
        startDirectorRun();
        if (game && game.riftEvent && game.waveResolved) clearRiftEventIfNeeded();
        originalNextWave();
        if (game) {
          game.waveDamageTaken = 0;
          game.waveKills = 0;
          game.waveElites = 0;
          game.waveStartedAt = game.time;
          setupRiftEventForWave();
        }
      };

      const originalUseOverdrive = useOverdrive;
      useOverdrive = function useOverdriveDirector() {
        const before = game ? game.overdriveMeter : 0;
        originalUseOverdrive();
        if (game && before >= 100 && game.overdriveMeter === 0) {
          game.overdrivesUsed = (game.overdrivesUsed || 0) + 1;
          progressContract('overdrive', 1);
          if (game.overdrivesUsed >= 3) awardAchievement('overdrive-chain');
        }
      };

      const originalDash = dash;
      dash = function dashDirector() {
        const before = player ? player.dashCd : 999;
        originalDash();
        if (player && before <= 0.001 && player.dashCd > 0.05) progressContract('dash', 1);
      };

      const originalApplyUpgrade = applyUpgrade;
      applyUpgrade = function applyUpgradeDirector(id) {
        const up = upgradePool.find((u) => u.id === id);
        originalApplyUpgrade(id);
        if (up && up.rarity === 'transcendent') awardAchievement('transcendent');
      };

      const originalDamagePlayer = damagePlayer;
      damagePlayer = function damagePlayerDirector(amount) {
        const hpBefore = player ? player.hp : 0;
        originalDamagePlayer(amount);
        if (game && player && game.mode !== 'menu') {
          const hpLoss = Math.max(0, hpBefore - player.hp);
          if (hpLoss > 0) game.waveDamageTaken = (game.waveDamageTaken || 0) + hpLoss;
        }
      };

      const originalDamageEnemy = damageEnemy;
      damageEnemy = function damageEnemyDirector(enemy, amount, options = {}) {
        if (enemy && player) {
          if (enemy.elite || enemy.championTrait || enemy.directorBounty) amount *= 1 + (player.eliteSlayer || 0);
        }
        const staggerBefore = enemy ? (enemy.staggered || 0) : 0;
        originalDamageEnemy(enemy, amount, options);
        if (enemy && enemy.type === 'boss' && (enemy.staggered || 0) > staggerBefore) awardAchievement('stagger-boss');
      };

      const originalSpawnEnemy = spawnEnemy;
      spawnEnemy = function spawnEnemyDirector(type, elite = false, explicitX = null, explicitY = null) {
        const enemy = originalSpawnEnemy(type, elite, explicitX, explicitY);
        if (enemy && enemy.elite && game && game.wave >= 8 && chance(0.22)) {
          const traits = ['shielded', 'swift', 'rich'];
          const trait = traits[irand(0, traits.length - 1)];
          enemy.championTrait = trait;
          if (trait === 'shielded') enemy.shield = (enemy.shield || 0) + 34 + game.wave * 3;
          if (trait === 'swift') enemy.speed *= 1.18;
          if (trait === 'rich') enemy.drop += 3;
          enemy.score *= 1.12;
        }
        return enemy;
      };

      const originalSpawnConvertedAlly = spawnConvertedAlly;
      spawnConvertedAlly = function spawnConvertedAllyDirector(enemy) {
        const ok = originalSpawnConvertedAlly(enemy);
        if (ok) {
          progressContract('recruit', 1);
          if (allies.length >= 4) awardAchievement('ally-squad');
        }
        return ok;
      };

      const originalKillEnemy = killEnemy;
      killEnemy = function killEnemyDirector(enemy) {
        if (!enemy || enemy.dead) return;
        const snapshot = { type: enemy.type, elite: !!enemy.elite, x: enemy.x, y: enemy.y, r: enemy.r || 12, bounty: !!enemy.directorBounty, champion: enemy.championTrait };
        originalKillEnemy(enemy);
        if (!game) return;
        progressContract('kills', 1);
        game.waveKills = (game.waveKills || 0) + 1;
        if (snapshot.elite) {
          game.waveElites = (game.waveElites || 0) + 1;
          progressContract('elite', 1);
          if (player && player.shardHarvest > 0 && chance(clamp(0.08 * player.shardHarvest + luckValue() * 0.01, 0, 0.45))) addShards(1, 'Elite harvest');
          if (player && player.eliteSlayer > 0 && chance(0.18)) spawnPickup(snapshot.x, snapshot.y, 'scrap', 2);
        }
        if (snapshot.bounty) addShards(2 + Math.floor(luckValue() / 10), 'Bounty target');
        if (game.riftEvent && game.riftEvent.id === 'salvage' && snapshot.type !== 'boss') {
          spawnPickup(snapshot.x + rand(-9, 9), snapshot.y + rand(-9, 9), 'scrap', chance(0.22 + (player?.eventLuck || 0) * 0.06) ? 2 : 1);
        }
        if (snapshot.champion === 'rich') spawnPickup(snapshot.x, snapshot.y, 'scrap', 2);
        if (snapshot.type === 'boss') {
          game.bossKills = (game.bossKills || 0) + 1;
          progressContract('boss', 1);
          awardAchievement('warden-down');
          if (player && player.bossCache) {
            game.rerolls += player.bossCache;
            for (let i = 0; i < 6 + player.bossCache * 2; i++) spawnPickup(snapshot.x + rand(-30, 30), snapshot.y + rand(-30, 30), 'scrap', chance(0.3) ? 2 : 1);
            spawnFloater(snapshot.x, snapshot.y - snapshot.r - 24, `+${player.bossCache} reroll`, '255,215,107', 14, 1.0);
          }
        }
        if (game.kills >= 1) awardAchievement('first-blood');
        progressContract('combo', Math.floor(game.combo || 0), 'max');
        if ((game.bestCombo || 0) >= 30) awardAchievement('combo-30');
      };

      const originalUpdateWaves = updateWaves;
      updateWaves = function updateWavesDirector(dt) {
        const wasResolved = game ? game.waveResolved : false;
        const beforeMode = game ? game.mode : '';
        originalUpdateWaves(dt);
        if (game && !wasResolved && game.waveResolved) {
          progressContract('wave', 1);
          if ((game.waveDamageTaken || 0) <= 0 && game.wave > 1) progressContract('perfectWave', 1);
          if (game.wave >= 11) awardAchievement('hydra-check');
          clearRiftEventIfNeeded();
          if (beforeMode !== 'levelup' && game.mode === 'levelup') showLevelUp();
        }
      };

      const originalUpdate = update;
      update = function updateDirector(dt) {
        originalUpdate(dt);
        directorUpdate(dt);
      };

      const originalShowLevelUp = showLevelUp;
      showLevelUp = function showLevelUpDirector() {
        audio.setMusicMode('levelup');
        const cards = game.offers.map((offer, i) => `
          <button class="choice ${offer.rarity}" data-action="upgrade" data-upgrade="${offer.id}" data-index="${i}">
            <small>${offer.rarity}</small>
            <h3>${i + 1}. ${offer.title}</h3>
            <p>${offer.desc}</p>
            <ul>${offer.perks.map((perk) => `<li>${perk}</li>`).join('')}</ul>
          </button>
        `).join('');
        const keyText = keyRangeText(game.offers.length);
        const contracts = renderContractPreview();
        setOverlay(`
          <div class="panel">
            <div class="kicker">Wave cleared</div>
            <h2>Choose your next upgrade</h2>
            <p class="lead">You survived wave ${game.wave}. Pick one enhancement and push deeper. Keys ${keyText} also work here.</p>
            ${contracts ? `<div class="contractGrid compact">${contracts}</div>` : ''}
            <div class="choices">${cards}</div>
            <div class="rerollBar">
              <span><b>Rerolls:</b> ${game.rerolls} • <b>Run shards:</b> ${(game.runShards || 0).toLocaleString()} ${game.rerolls > 0 ? '• Press <b>R</b> or click to roll a fresh set.' : '• Complete contracts or buy Armory perks to get more.'}</span>
              <button class="ghost" data-action="reroll" ${game.rerolls <= 0 ? 'disabled' : ''}>Reroll Choices</button>
            </div>
            <div class="foot">Contracts are optional, but they pay Rift Shards for Armory progress. Luck still raises high-rarity odds and can add extra choices.</div>
          </div>
        `, true);
      };

      const originalShowPause = showPause;
      showPause = function showPauseDirector() {
        audio.pauseMusic();
        const contractHtml = renderContractPreview();
        setOverlay(`
          <div class="panel center pausePanel">
            <div class="kicker">Paused</div>
            <h2>Take a breath</h2>
            <p class="lead">The arena is frozen. Press <b>P</b> or click below to jump back in.</p>
            ${contractHtml ? `<div class="settingsBox"><div class="settingsTitle"><h3>Run Contracts</h3><span>Complete for Rift Shards</span></div><div class="contractGrid compact">${contractHtml}</div></div>` : ''}
            <div class="settingsBox">
              <div class="settingsTitle"><h3>Settings</h3><span>Autosaves instantly</span></div>
              <div class="settingRow"><label for="musicVolume">Music Volume<span class="settingHint">Boss music follows this too.</span></label><input id="musicVolume" type="range" min="0" max="2" step="0.05" value="${settings.musicVolume}" data-setting="musicVolume" /><span class="settingValue" data-setting-value="musicVolume">${formatSettingValue('musicVolume')}</span></div>
              <div class="settingRow"><label for="sfxVolume">SFX Volume<span class="settingHint">Shots, hits, pickups, boss stingers, and UI clicks.</span></label><input id="sfxVolume" type="range" min="0" max="1.5" step="0.05" value="${settings.sfxVolume}" data-setting="sfxVolume" /><span class="settingValue" data-setting-value="sfxVolume">${formatSettingValue('sfxVolume')}</span></div>
              <div class="settingRow"><label for="uiScale">UI Scale<span class="settingHint">Scales the HUD, pause menu, upgrade cards, and audio button.</span></label><input id="uiScale" type="range" min="0.75" max="1.3" step="0.05" value="${settings.uiScale}" data-setting="uiScale" /><span class="settingValue" data-setting-value="uiScale">${formatSettingValue('uiScale')}</span></div>
              <div class="settingRow"><label for="screenShake">Screen Shake<span class="settingHint">Lower this if combat gets too intense visually.</span></label><input id="screenShake" type="range" min="0" max="1.25" step="0.05" value="${settings.screenShake}" data-setting="screenShake" /><span class="settingValue" data-setting-value="screenShake">${formatSettingValue('screenShake')}</span></div>
              <div class="settingRow"><label for="visualFx">Visual FX<span class="settingHint">Adjusts star density, particles, glows, and flash intensity.</span></label><input id="visualFx" type="range" min="0.45" max="1.25" step="0.05" value="${settings.visualFx}" data-setting="visualFx" /><span class="settingValue" data-setting-value="visualFx">${formatSettingValue('visualFx')}</span></div>
              <div class="settingRow"><label for="damageNumbers">Damage Numbers<span class="settingHint">Floating feedback from hits, combos, contracts, and bosses.</span></label><input id="damageNumbers" class="settingToggle" type="checkbox" ${settings.damageNumbers ? 'checked' : ''} data-setting="damageNumbers" /><span class="settingValue" data-setting-value="damageNumbers">${formatSettingValue('damageNumbers')}</span></div>
              <div class="settingRow"><label for="showWarnings">Attack Warnings<span class="settingHint">Telegraphs for mines, artillery, beams, and major danger zones.</span></label><input id="showWarnings" class="settingToggle" type="checkbox" ${settings.showWarnings ? 'checked' : ''} data-setting="showWarnings" /><span class="settingValue" data-setting-value="showWarnings">${formatSettingValue('showWarnings')}</span></div>
            </div>
            <div class="ctaRow"><button data-action="resume">Resume</button><button class="ghost" data-action="armory">Armory</button><button class="ghost" data-action="menu">Quit to Menu</button></div>
            <div class="foot">Armory upgrades apply at the start of your next run.</div>
          </div>
        `, true);
      };

      const originalShowGameOver = showGameOver;
      showGameOver = function showGameOverDirector() {
        audio.gameOver();
        const best = Math.max(game.highScore, game.score);
        if (!game.directorFinalized) {
          game.directorFinalized = true;
          const bossBonus = (game.bossKills || 0) * 6;
          const contractBonus = (game.completedContracts || 0) * 3;
          const eventBonus = (game.eventsClearedThisRun || 0) * 2;
          const base = Math.floor(game.wave * 1.25 + game.kills / 32 + bossBonus + contractBonus + eventBonus);
          game.finalShardAward = Math.max(2, base);
          addShards(game.finalShardAward, 'Run payout', { run: true });
        }
        const contracts = renderContractPreview();
        setOverlay(`
          <div class="panel center">
            <div class="kicker">Run collapsed</div>
            <h2>Game Over</h2>
            <p class="lead">The rift finally caught you. Your build made it to wave <b>${game.wave}</b> with <b>${game.kills}</b> kills.</p>
            <div class="statsRow">
              <div class="bigStat"><b>Score</b><span>${Math.floor(game.score).toLocaleString()}</span></div>
              <div class="bigStat"><b>Wave</b><span>${game.wave}</span></div>
              <div class="bigStat"><b>Run Shards</b><span>${(game.runShards || 0).toLocaleString()}</span></div>
              <div class="bigStat"><b>Best</b><span>${Math.floor(best).toLocaleString()}</span></div>
            </div>
            ${contracts ? `<div class="contractGrid compact">${contracts}</div>` : ''}
            <div class="ctaRow"><button data-action="restart">Run Again</button><button class="ghost" data-action="armory">Spend Shards</button><button class="ghost" data-action="menu">Main Menu</button></div>
            <div class="foot">You earned <b>${(game.finalShardAward || 0).toLocaleString()}</b> shards from the run payout, plus any contract, event, bounty, or achievement rewards.</div>
          </div>
        `, true);
      };

      function drawDirectorHUD() {
        if (!game || !player || game.mode === 'menu') return;
        const scale = settings.uiScale || 1;
        const x = 22;
        let y = 112;
        const w = Math.min(360, view.w - 44);
        ctx.save();
        ctx.globalAlpha = 0.94;
        ctx.fillStyle = 'rgba(6,10,16,0.46)';
        roundRect(x, y, w, game.riftEvent ? 104 : 82, 16, true, false);
        ctx.fillStyle = 'rgba(238,246,255,0.92)';
        ctx.font = `${Math.round(12 * scale)}px Inter, system-ui, sans-serif`;
        ctx.fillText(`RIFT SHARDS +${game.runShards || 0}`, x + 12, y + 18);
        if (game.contracts && game.contracts.length) {
          ctx.font = `700 ${Math.round(11 * scale)}px Inter, system-ui, sans-serif`;
          for (let i = 0; i < game.contracts.length; i++) {
            const c = game.contracts[i];
            const cy = y + 38 + i * 17;
            ctx.fillStyle = c.completed ? 'rgba(140,255,189,0.94)' : 'rgba(156,179,209,0.92)';
            ctx.fillText(`${c.completed ? '✓' : '•'} ${c.title}: ${contractLabel(c)}`, x + 12, cy);
          }
        }
        if (game.riftEvent) {
          y += 82;
          ctx.fillStyle = 'rgba(255,215,107,0.94)';
          ctx.font = `800 ${Math.round(11 * scale)}px Inter, system-ui, sans-serif`;
          ctx.fillText(`EVENT: ${game.riftEvent.name}`, x + 12, y + 20);
        }
        ctx.restore();
      }

      const originalDrawHUD = drawHUD;
      drawHUD = function drawHUDDirector() {
        originalDrawHUD();
        drawDirectorHUD();
      };

      overlay.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const action = btn.dataset.action;
        if (action === 'armory') { showArmory(); return; }
        if (action === 'codex') { showCodex(); return; }
        if (action === 'spend-armory') { buyArmoryPerk(btn.dataset.perk); return; }
      });

      if (window.NeonRiftDebug) {
        window.NeonRiftDebug.directorMeta = () => JSON.parse(JSON.stringify(directorMeta));
        window.NeonRiftDebug.addShards = (amount = 50) => addShards(amount, 'Debug shards', { run: false });
        window.NeonRiftDebug.completeContracts = () => {
          if (!game || !game.contracts) return [];
          for (const c of game.contracts) { c.progress = c.target; rewardContract(c); }
          return game.contracts.map((c) => ({ title: c.title, completed: c.completed }));
        };
        window.NeonRiftDebug.forceEvent = (id = 'storm') => {
          if (!game || game.mode === 'menu' || game.mode === 'gameover') startGame();
          const def = riftEvents.find((e) => e.id === id) || riftEvents[0];
          game.riftEvent = { ...def, timer: 0.1, spawns: 0, cleared: false };
          return game.riftEvent;
        };
      }


      resize();
      resetWorld();
      showMenu();
      requestAnimationFrame(loop);
      window.addEventListener('resize', resize);
    })();
  </script>
</body>
</html>
