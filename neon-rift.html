            hp,
            maxHp: hp,
            speed: boss.speed * (1 + bossTier * 0.08) * lateSpeedMult * (introBoss ? 0.9 : secondBoss ? 0.82 : 1),
            damage: Math.round((boss.damage + bossTier * 4 + latePower * 2.2) * (introBoss ? 0.78 : secondBoss ? 0.72 : 1)),
            score: boss.score + bossCycle * 600 + latePower * 80,
            color: boss.color,
            drop: boss.drop + bossCycle * 8 + Math.floor(latePower * 1.5),
            shoot: boss.shoot * (introBoss ? 1.25 : secondBoss ? 1.55 : lateTimerMult),
            ring: boss.ring * (introBoss ? 1.28 : secondBoss ? 1.5 : lateTimerMult),
            summon: boss.summon * (introBoss ? 1.38 : secondBoss ? 1.7 : lateTimerMult),
            beam: (boss.beam ?? rand(2.4, 3.4)) * (introBoss ? 1.35 : secondBoss ? 1.75 : lateTimerMult),
            mine: (boss.mine ?? rand(2.8, 4.2)) * (introBoss ? 1.35 : secondBoss ? 1.55 : lateTimerMult),
            blink: boss.blink ?? 0,
            pull: boss.pull ?? 0,
            special: (boss.special ?? rand(2.2, 3.2)) * (introBoss ? 1.35 : secondBoss ? 1.6 : lateTimerMult),
            shield: boss.shield ? Math.round((boss.shield + game.wave * 14) * (1 + latePower * 0.06)) : 0,
            maxShield: boss.shield ? Math.round((boss.shield + game.wave * 14) * (1 + latePower * 0.06)) : 0,
            crossfire: introBoss ? rand(5.2, 7.0) : secondBoss ? rand(6.2, 8.0) : rand(2.0, 3.2) * lateTimerMult,
            rageBurst: introBoss ? rand(5.6, 7.4) : secondBoss ? rand(7.0, 9.0) : rand(3.5, 5.1) * lateTimerMult,
            enraged: false,
            bossTier,
            bossCycle,
            lateBossPower: latePower,
            entered: false,
            phase: 0,
            stagger: 0,
            staggerMax: Math.max(220, 320 + bossTier * 45 + game.wave * 8 + latePower * 45),
            staggered: 0,
            spin: rand(0, TAU),
          };
          game.bossMaxHp = enemy.maxHp;
          game.bossHp = enemy.hp;
          game.bossName = enemy.bossName;
          game.bossKind = enemy.bossKind;
        } else {
          return;
        }

        if (elite && !['boss', 'mite', 'mine'].includes(enemy.type)) {
          enemy.elite = true;
          enemy.hp *= 1.55;
          enemy.maxHp = enemy.hp;
          enemy.speed *= 1.15;
          enemy.damage += 4;
          enemy.r *= 1.08;
          enemy.score *= 1.8;
          enemy.drop += 3;
          enemy.color = '255,90,220';
        }

        enemies.push(enemy);
        if (enemy.type === 'boss') audio.bossSpawn(enemy.bossName);
        return enemy;
      }

      function buildWave(wave) {
        const queue = [];
        const bossWave = wave % 5 === 0;
        if (bossWave) {
          const bossType = bossTypeForWave(wave);
          const introBoss = wave === 5 && bossType === 'bossWarden';
          const secondBoss = wave === 10 && bossType === 'bossPrism';
          queue.push({ type: bossType, delay: 1.2 });
          const extras = introBoss ? 8 : secondBoss ? 11 : Math.min(82, 10 + wave + Math.floor(wave / 5) * 4);
          for (let i = 0; i < extras; i++) {
            const options = ['scout', 'shooter', 'charger', 'splitter'];
            if (wave >= 10) {
              if (secondBoss) options.push('orbiter');
              else options.push('orbiter', 'mine');
            }
            if (wave >= 12) options.push('bulwark');
            if (wave >= 14) options.push('beamcaster');
            if (wave >= 15) options.push('sniper');
            if (wave >= 17) options.push('phantom');
            if (wave >= 19) options.push('vortexer');
            if (wave >= 20) options.push('guardian');
            if (wave >= 13) options.push('leech');
            if (wave >= 18) options.push('artillery');
            if (wave >= 23) options.push('replicator');
            const type = options[irand(0, options.length - 1)];
            queue.push({
              type,
              delay: introBoss ? rand(0.75, 1.25) : secondBoss ? rand(0.75, 1.35) : rand(0.38, 0.95),
              elite: introBoss ? chance(0.08) : secondBoss ? chance(0.08) : chance(Math.min(0.62, 0.24 + wave * 0.012)),
            });
          }
          return queue;
        }

        let budget = 7 + wave * 4 + Math.floor(Math.max(0, wave - 8) * 1.5);
        while (budget > 0) {
          const pool = [{ type: 'scout', cost: 1, weight: 8 }];
          if (wave >= 2) pool.push({ type: 'splitter', cost: 2, weight: 5 });
          if (wave >= 3) pool.push({ type: 'shooter', cost: 2, weight: 5 });
          if (wave >= 4) pool.push({ type: 'charger', cost: 3, weight: 4 });
          if (wave >= 5) pool.push({ type: 'brute', cost: 4, weight: 3 });
          if (wave >= 6) pool.push({ type: 'orbiter', cost: 3, weight: 4 });
          if (wave >= 8) pool.push({ type: 'mine', cost: 2, weight: 3 });
          if (wave >= 9) pool.push({ type: 'sniper', cost: 4, weight: 3 });
          if (wave >= 11) pool.push({ type: 'guardian', cost: 5, weight: 2 });
          if (wave >= 12) pool.push({ type: 'bulwark', cost: 5, weight: 3 });
          if (wave >= 14) pool.push({ type: 'beamcaster', cost: 4, weight: 3 });
          if (wave >= 16) pool.push({ type: 'phantom', cost: 4, weight: 3 });
          if (wave >= 13) pool.push({ type: 'leech', cost: 4, weight: 3 });
          if (wave >= 18) pool.push({ type: 'vortexer', cost: 5, weight: 3 });
          if (wave >= 18) pool.push({ type: 'artillery', cost: 5, weight: 2 });
          if (wave >= 22) pool.push({ type: 'replicator', cost: 6, weight: 2 });
          const pick = weightedPick(pool);
          if (pick.cost > budget && budget > 2) continue;
          const elite = wave >= 4 && chance(Math.min(0.42, 0.08 + wave * 0.008));
          queue.push({ type: pick.type, delay: rand(0.24, Math.max(0.11, 0.58 - wave * 0.016)), elite });
          budget -= pick.cost;
        }
        return queue.slice(0, Math.min(150, 40 + wave * 4));
      }

      function nextWave() {
        game.wave += 1;
        game.waveResolved = false;
        game.bossWave = game.wave % 5 === 0;
        if (game.bossWave) {
          game.bossKind = bossTypeForWave(game.wave);
          game.bossName = bossDisplayName(game.bossKind, game.wave);
        } else {
          game.bossKind = '';
          game.bossName = '';
        }
        game.spawnQueue = buildWave(game.wave);
        game.spawnTimer = 0.8;
        game.message = game.bossWave ? `WAVE ${game.wave} // ${game.bossName.toUpperCase()}` : `WAVE ${game.wave}`;
        game.messageTimer = 2.2;
        if (game.bossWave) {
          audio.boss();
          screenShake(14);
          pulseVibrate(50);
        } else {
          audio.setMusicMode('normal');
          audio.wave();
        }
      }

      function angleToTarget(x, y) {
        const recentMouse = now() - input.mouse.movedAt < 2.2 && input.mouse.inside;
        if (recentMouse) {
          return Math.atan2(input.mouse.y - y, input.mouse.x - x);
        }
        let best = null;
        let bestD = Infinity;
        for (const enemy of enemies) {
          const d = (enemy.x - x) ** 2 + (enemy.y - y) ** 2;
          if (d < bestD) {
            bestD = d;
            best = enemy;
          }
        }
        if (best) return Math.atan2(best.y - y, best.x - x);
        return player.aimAngle;
      }

      function fireBullet(originX, originY, angle, opts = {}) {
        if (bullets.length >= ENTITY_LIMITS.bullets) bullets.shift();
        const speed = opts.speed ?? player.bulletSpeed;
        const baseDamage = opts.damage ?? player.damage;
        const luck = luckValue();
        const crit = opts.crit ?? (player && Math.random() < clamp(player.critChance + luck * 0.012, 0, 0.86));
        const fortune = opts.fortune ?? (player && luck > 0 && Math.random() < clamp(luck * 0.006, 0, 0.12));
        bullets.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: opts.r ?? player.bulletSize,
          damage: baseDamage * (crit ? player.critMult : 1) * (fortune ? 1.65 : 1),
          life: opts.life ?? 1.6,
          pierce: opts.pierce ?? player.pierce,
          homing: opts.homing ?? player.homing,
          bounces: opts.bounces ?? player.bounces,
          frost: opts.frost ?? player.frost,
          burn: opts.burn ?? player.burn,
          blackHole: opts.blackHole ?? false,
          splitShot: opts.splitShot ?? player.splitShot,
          crit,
          fortune,
          color: opts.color ?? (fortune ? '255,255,255' : crit ? '255,215,107' : '116,243,255'),
          source: opts.source ?? 'player',
        });
      }

      function fireEnemyBullet(originX, originY, angle, speed = 320, size = 5, damage = 12, color = '255,109,122') {
        if (enemyBullets.length >= ENTITY_LIMITS.enemyBullets) enemyBullets.shift();
        enemyBullets.push({
          x: originX,
          y: originY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          r: size,
          damage,
          life: 4,
          color,
        });
      }

      function useOverdrive() {
        if (game.overdriveMeter < 100 || player.overdriveTimer > 0) return;
        player.overdriveTimer = 6;
        game.overdriveMeter = 0;
        game.message = 'OVERDRIVE ONLINE';
        game.messageTimer = 1.5;
        game.flash = 0.22;
        ringBurst(player.x, player.y, '116,243,255', 28, 80, 280, 2, 6);
        if (player.overdriveNova > 0) {
          spawnShockwave(player.x, player.y, {
            r: 18,
            maxR: 170 + player.overdriveNova * 70,
            speed: 640,
            damage: 70 + player.overdriveNova * 55,
            color: '255,215,107',
            friendly: true,
            life: 0.42,
          });
        }
        audio.overdrive();
        screenShake(12);
      }

      function dash() {
        if (player.dashCd > 0 || player.dashTimer > 0) return;
        let dx = 0;
        let dy = 0;
        if (keyDown('w', 'arrowup')) dy -= 1;
        if (keyDown('s', 'arrowdown')) dy += 1;
        if (keyDown('a', 'arrowleft')) dx -= 1;
        if (keyDown('d', 'arrowright')) dx += 1;
        if (dx === 0 && dy === 0) {
          dx = Math.cos(player.aimAngle);
          dy = Math.sin(player.aimAngle);
        }
        const n = norm(dx, dy);
        player.dashCd = player.dashCooldown;
        player.dashTimer = 0.18;
        player.dashInvuln = 0.24;
        player.vx = n.x * 880;
        player.vy = n.y * 880;
        for (let i = 0; i < 10; i++) {
          addParticle(player.x, player.y, {
            vx: -n.x * rand(80, 260) + rand(-50, 50),
            vy: -n.y * rand(80, 260) + rand(-50, 50),
            r: rand(2, 5),
            life: rand(0.22, 0.45),
            color: '116,243,255',
            glow: 12,
          });
        }
        if (player.dashShock > 0) {
          spawnShockwave(player.x, player.y, {
            r: 14,
            maxR: 95 + player.dashShock * 28,
            speed: 520,
            damage: 20 + player.dashShock * 16,
            color: '116,243,255',
          });
        }
        if (player.mineLayer > 0) {
          const mines = Math.min(4, player.mineLayer);
          for (let m = 0; m < mines; m++) {
            spawnAlliedMine(player.x - n.x * rand(16, 44) + rand(-18, 18), player.y - n.y * rand(16, 44) + rand(-18, 18), player.mineLayer);
          }
        }
        audio.dash();
        screenShake(9);
      }

      function applyUpgrade(id) {
        const upgrade = upgradePool.find((u) => u.id === id);
        if (!upgrade) return;
        upgrade.apply();
        audio.upgrade();
        game.mode = 'playing';
        game.message = `${upgrade.title.toUpperCase()} ACQUIRED`;
        game.messageTimer = 1.8;
        game.flash = 0.16;
        hideOverlay();
        nextWave();
      }

      function damageEnemy(enemy, amount, options = {}) {
        if (!enemy || enemy.dead || !Number.isFinite(amount) || amount <= 0) return;
        let remaining = amount;
        if (!options.ignoreShield && enemy.shield > 0) {
          const absorbed = Math.min(enemy.shield, remaining);
          enemy.shield -= absorbed;
          remaining -= absorbed;
          enemy.hitFlash = 0.1;
          if (absorbed > 2 && chance(0.35)) addParticle(enemy.x, enemy.y, {
            vx: rand(-70, 70), vy: rand(-70, 70), r: rand(1.4, 3.2), life: rand(0.12, 0.28), color: '103,168,255', glow: 6,
          });
          if (remaining <= 0) return;
        }
        enemy.hp -= remaining;
        enemy.hitFlash = 0.1;
        if (!options.quiet && remaining >= 3) {
          spawnFloater(enemy.x + rand(-enemy.r * 0.35, enemy.r * 0.35), enemy.y - enemy.r - 8, Math.round(remaining), enemy.type === 'boss' ? enemy.color : (remaining > 40 ? '255,215,107' : '238,246,255'), remaining > 70 ? 16 : 12);
        }
        if (enemy.type === 'boss' && remaining > 0) {
          const gain = remaining * (1 + (player?.bossStaggerPower || 0));
          enemy.stagger = Math.min(enemy.staggerMax || 260, (enemy.stagger || 0) + gain);
          if (enemy.stagger >= (enemy.staggerMax || 260) && (enemy.staggered || 0) <= 0) {
            enemy.stagger = 0;
            enemy.staggered = 0.75 + Math.min(0.75, (player?.bossStaggerPower || 0) * 0.32);
            enemy.shoot = Math.max(enemy.shoot || 0, 0.55);
            enemy.ring = Math.max(enemy.ring || 0, 0.7);
            enemy.beam = Math.max(enemy.beam || 0, 0.55);
            enemy.special = Math.max(enemy.special || 0, 0.6);
            spawnFloater(enemy.x, enemy.y - enemy.r - 30, 'STAGGER', '255,215,107', 17, 0.9);
            spawnShockwave(enemy.x, enemy.y, { r: 16, maxR: 110, speed: 430, damage: 0, color: '255,215,107', friendly: true, life: 0.28 });
            screenShake(7);
          }
        }
        if (!options.quiet && (remaining > 1 || chance(0.18))) {
          addParticle(enemy.x, enemy.y, {
            vx: rand(-80, 80), vy: rand(-80, 80), r: rand(1.6, 3.8), life: rand(0.15, 0.35), color: enemy.color, glow: 6,
          });
        }
        if (enemy.type === 'boss') game.bossHp = Math.max(0, enemy.hp);
        if (enemy.hp <= 0) killEnemy(enemy);
      }

      function allyLimit() {
        return Math.min(ENTITY_LIMITS.allies, 5 + Math.max(0, player?.riftConversion || 0) + Math.floor(luckValue() / 6));
      }

      function conversionChanceFor(enemy) {
        if (!player || !enemy || (player.riftConversion || 0) <= 0) return 0;
        if (enemy.type === 'boss' || enemy.type === 'mine') return 0;
        const base = 0.018 + (player.riftConversion || 0) * 0.018 + luckValue() * 0.0025 + (enemy.elite ? 0.025 : 0);
        return clamp(base, 0, 0.14);
      }

      function killAlly(ally, quiet = false) {
        if (!ally || ally.dead) return;
        ally.dead = true;
        const idx = allies.indexOf(ally);
        if (idx >= 0) allies.splice(idx, 1);
        if (!quiet) {
          ringBurst(ally.x, ally.y, ally.color || '140,255,189', 14, 45, 150, 1.8, 4.2);
          spawnTrail(ally.x, ally.y, ally.r * 1.6, ally.color || '140,255,189', 0.18);
        }
      }

      function damageAlly(ally, amount) {
        if (!ally || ally.dead || !Number.isFinite(amount) || amount <= 0) return;
        ally.hp -= amount;
        ally.hitFlash = 0.12;
        if (amount > 2 && chance(0.28)) addParticle(ally.x, ally.y, {
          vx: rand(-70, 70), vy: rand(-70, 70), r: rand(1.4, 3.2), life: rand(0.12, 0.28), color: ally.color || '140,255,189', glow: 6,
        });
        if (ally.hp <= 0) killAlly(ally);
      }

      function spawnConvertedAlly(enemy) {
        if (!enemy || enemy.type === 'boss' || enemy.type === 'mine') return false;
        const limit = allyLimit();
        while (allies.length >= limit && allies.length) killAlly(allies[0], true);
        if (allies.length >= limit) return false;
        const rangedTypes = ['shooter', 'orbiter', 'sniper', 'beamcaster', 'guardian', 'vortexer', 'replicator'];
        const ranged = rangedTypes.includes(enemy.type);
        const conversionPower = player.riftConversion || 1;
        const maxHp = clamp((enemy.maxHp || 50) * (0.58 + conversionPower * 0.12) * (enemy.elite ? 1.18 : 1), 28, 260 + conversionPower * 60);
        const ally = {
          id: entityId++,
          x: enemy.x,
          y: enemy.y,
          vx: rand(-35, 35),
          vy: rand(-35, 35),
          type: 'ally',
          sourceType: enemy.type,
          elite: enemy.elite,
          r: clamp((enemy.r || 16) * 0.9, 9, 28),
          hp: maxHp,
          maxHp,
          speed: clamp((enemy.speed || 92) * (ranged ? 0.96 : 1.08), 58, 190),
          damage: clamp((enemy.damage || 12) * 0.72 + player.damage * 0.24 + conversionPower * 3, 8, 70),
          color: enemy.elite ? '255,215,107' : '140,255,189',
          shoot: rand(0.2, 0.7),
          touchCd: 0,
          hitFlash: 0,
          ranged,
          orbitDir: chance(0.5) ? 1 : -1,
        };
        allies.push(ally);
        ringBurst(ally.x, ally.y, ally.color, 18, 55, 180, 2, 5.2);
        spawnTrail(ally.x, ally.y, ally.r * 2.2, ally.color, 0.28);
        audio.collect();
        if (game.messageTimer < 0.8) {
          game.message = `${enemy.type.toUpperCase()} CONVERTED`;
          game.messageTimer = 1.35;
        }
        return true;
      }

      function maybeConvertEnemy(enemy) {
        const p = conversionChanceFor(enemy);
        if (p <= 0 || !chance(p)) return false;
        return spawnConvertedAlly(enemy);
      }

      function killEnemy(enemy) {
        if (!enemy || enemy.dead) return;
        enemy.dead = true;
        const idx = enemies.indexOf(enemy);
        if (idx >= 0) enemies.splice(idx, 1);
        game.kills += 1;
        game.combo = Math.min(50, game.combo + 1);
        game.bestCombo = Math.max(game.bestCombo || 0, Math.floor(game.combo));
        game.comboTimer = 2.6;
        game.score += enemy.score * (1 + game.combo * 0.035);
        if (Math.floor(game.combo) > 0 && Math.floor(game.combo) % 10 === 0) {
          game.overdriveMeter = clamp(game.overdriveMeter + 3 + luckValue() * 0.25, 0, 100);
          spawnFloater(enemy.x, enemy.y - enemy.r - 18, `COMBO ${Math.floor(game.combo)}`, '255,215,107', 14, 0.8);
        }
        if (player.healOnKill > 0) player.hp = Math.min(player.maxHp, player.hp + player.healOnKill);
        if (player.shieldOnKill > 0) player.shield = Math.min(player.maxShield, player.shield + player.shieldOnKill);
        const converted = maybeConvertEnemy(enemy);
        if (enemy.type === 'boss') {
          audio.bossDefeated();
          game.message = `${(enemy.bossName || 'ANOMALY').toUpperCase()} DESTROYED`;
          game.messageTimer = 2.2;
          screenShake(22);
          game.flash = 0.28;
          pulseVibrate(90);
          for (let i = 0; i < 3; i++) {
            setTimeout(() => audio.explode(), i * 70);
          }
        } else {
          audio.explode();
        }
        ringBurst(enemy.x, enemy.y, enemy.color, enemy.type === 'boss' ? 48 : 16 + (enemy.elite ? 8 : 0), enemy.type === 'boss' ? 120 : 60, enemy.type === 'boss' ? 320 : 180, 2, enemy.type === 'boss' ? 7 : 4.5);
        spawnTrail(enemy.x, enemy.y, enemy.r * 1.9, enemy.color, enemy.type === 'boss' ? 0.42 : 0.22);
        if (!converted && enemy.type === 'splitter') {
          for (let i = 0; i < 2; i++) spawnEnemy('mite', false, enemy.x + rand(-12, 12), enemy.y + rand(-12, 12));
        }
        if (!converted && enemy.type === 'replicator') {
          for (let i = 0; i < 3; i++) spawnEnemy(chance(0.55) ? 'mite' : 'scout', false, enemy.x + rand(-18, 18), enemy.y + rand(-18, 18));
        }
        const luck = luckValue();
        let dropCount = enemy.drop + Math.floor(luck / 5);
        if (luck > 0 && chance((luck % 5) * 0.12)) dropCount += 1;
        if (player.jackpot > 0 && chance(clamp(0.045 * player.jackpot + luck * 0.012 + (enemy.elite ? 0.08 : 0), 0, 0.55))) {
          dropCount += 2 + player.jackpot;
          if (chance(0.45 + luck * 0.025)) spawnPickup(enemy.x + rand(-10, 10), enemy.y + rand(-10, 10), 'heal', 10 + player.jackpot * 4);
          ringBurst(enemy.x, enemy.y, '255,215,107', 12, 55, 155, 2, 4.8);
        }
        for (let i = 0; i < dropCount; i++) {
          const value = player.jackpot > 0 && chance(clamp(0.08 * player.jackpot + luck * 0.01, 0, 0.45)) ? 2 : 1;
          spawnPickup(enemy.x + rand(-8, 8), enemy.y + rand(-8, 8), 'scrap', value);
        }
        if (enemy.type !== 'boss' && chance(0.05 + (enemy.elite ? 0.08 : 0) + player.healDropBonus + luck * 0.006)) spawnPickup(enemy.x, enemy.y, 'heal', 14);
        if (player.luckyBurst > 0 && chance(clamp(0.055 * player.luckyBurst + luck * 0.012, 0, 0.48))) {
          spawnShockwave(enemy.x, enemy.y, {
            r: 10,
            maxR: 82 + player.luckyBurst * 26,
            speed: 570,
            damage: 22 + player.luckyBurst * 20 + luck * 2,
            color: '255,255,255',
            friendly: true,
            life: 0.34,
          });
        }
        if (player.killNova > 0) {
          spawnShockwave(enemy.x, enemy.y, {
            r: 12,
            maxR: 72 + player.killNova * 14,
            speed: 520,
            damage: 18 + player.killNova * 15,
            color: '255,215,107',
          });
        }
      }

      function damagePlayer(amount) {
        if (player.dashInvuln > 0 || game.mode !== 'playing') return;
        let dmg = amount;
        if (player.armor > 0) dmg *= Math.max(0.45, 1 - player.armor);
        if (player.overdriveTimer > 0) dmg *= 0.74;
        player.shieldDelay = 4.2;
        if (player.shield > 0) {
          const absorbed = Math.min(player.shield, dmg);
          player.shield -= absorbed;
          dmg -= absorbed;
        }
        if (dmg > 0) {
          player.hp -= dmg;
          spawnFloater(player.x + rand(-10, 10), player.y - player.r - 12, `-${Math.round(dmg)}`, '255,109,122', 14, 0.7);
        }
        player.hurtFlash = 0.18;
        game.flash = 0.12;
        screenShake(10);
        audio.hurt();
        pulseVibrate(25);
        if (player.hp <= 0 && player.fateShield > 0 && player.fateShieldCd <= 0) {
          player.hp = Math.max(1, player.maxHp * Math.min(0.42, 0.18 + player.fateShield * 0.06));
          player.shield = Math.min(player.maxShield, 18 + player.fateShield * 12 + luckValue() * 2);
          player.fateShieldCd = Math.max(38, 78 - player.fateShield * 8 - luckValue() * 1.5);
          game.message = 'PHOENIX PROTOCOL SAVED YOU';
          game.messageTimer = 2.2;
          spawnShockwave(player.x, player.y, { r: 16, maxR: 170 + player.fateShield * 34, speed: 650, damage: 58 + player.fateShield * 34, color: '255,215,107', friendly: true, life: 0.42 });
          ringBurst(player.x, player.y, '255,215,107', 28, 90, 260, 2, 6);
          screenShake(20);
          return;
        }
        if (player.hp <= 0) {
          player.hp = 0;
          game.mode = 'gameover';
          if (game.score > game.highScore) {
            game.highScore = game.score;
            saveHighScore(Math.floor(game.score));
          }
          showGameOver();
        }
      }

      function updatePlayer(dt) {
        player.hurtFlash = Math.max(0, player.hurtFlash - dt);
        player.dashCd = Math.max(0, player.dashCd - dt);
        player.dashTimer = Math.max(0, player.dashTimer - dt);
        player.dashInvuln = Math.max(0, player.dashInvuln - dt);
        player.overdriveTimer = Math.max(0, player.overdriveTimer - dt);
        player.fateShieldCd = Math.max(0, player.fateShieldCd - dt);
        player.shieldDelay = Math.max(0, player.shieldDelay - dt);
        if (player.shieldDelay === 0) player.shield = Math.min(player.maxShield, player.shield + dt * 8.2 * (player.shieldRecharge || 1));
        if (player.regen > 0 && player.hp > 0) player.hp = Math.min(player.maxHp, player.hp + player.regen * dt);
        if (player.fieldDamage > 0) {
          player.fieldTick = Math.max(0, player.fieldTick - dt);
          if (player.fieldTick <= 0) {
            player.fieldTick = 0.32;
            const radius = 80 + player.fieldDamage * 22;
            for (const enemy of enemies.slice()) {
              if (dist(player.x, player.y, enemy.x, enemy.y) < radius + enemy.r) {
                damageEnemy(enemy, 4 + player.fieldDamage * 5);
                enemy.slowTimer = Math.max(enemy.slowTimer || 0, 0.28);
                enemy.slowAmount = Math.min(enemy.slowAmount || 1, 0.82);
              }
            }
          }
        }

        let mx = 0;
        let my = 0;
        if (keyDown('a', 'arrowleft')) mx -= 1;
        if (keyDown('d', 'arrowright')) mx += 1;
        if (keyDown('w', 'arrowup')) my -= 1;
        if (keyDown('s', 'arrowdown')) my += 1;

        const speed = player.speed * (player.overdriveTimer > 0 ? 1.22 : 1);

        if (player.dashTimer > 0) {
          spawnTrail(player.x, player.y, 26, '116,243,255', 0.12);
          player.vx *= 0.9;
          player.vy *= 0.9;
        } else {
          const move = norm(mx, my);
          const targetVx = move.x * speed;
          const targetVy = move.y * speed;
          const accel = 1 - Math.exp(-dt * 14);
          player.vx = lerp(player.vx, targetVx, accel);
          player.vy = lerp(player.vy, targetVy, accel);
        }

        player.x += player.vx * dt;
        player.y += player.vy * dt;

        player.x = clamp(player.x, 24, view.w - 24);
        player.y = clamp(player.y, 24, view.h - 24);

        const aim = angleToTarget(player.x, player.y);
        player.aimAngle = player.aimAngle + angleDiff(player.aimAngle, aim) * clamp(dt * 14, 0, 1);

        player.fireTimer -= dt;
        const hasTarget = enemies.length > 0;
        if (hasTarget && player.fireTimer <= 0) {
          const fireRate = player.fireRate * (player.overdriveTimer > 0 ? 1.42 : 1);
          player.fireTimer = 1 / fireRate;
          const count = player.multishot;
          player.shotsFired += 1;
          for (let i = 0; i < count; i++) {
            const offset = (i - (count - 1) / 2) * player.spreadAngle;
            const shotX = player.x + Math.cos(player.aimAngle + offset) * 18;
            const shotY = player.y + Math.sin(player.aimAngle + offset) * 18;
            const shotAngle = player.aimAngle + offset;
            fireBullet(
              shotX,
              shotY,
              shotAngle,
              {
                damage: player.damage * (player.overdriveTimer > 0 ? 1.18 : 1),
                speed: player.bulletSpeed * (player.overdriveTimer > 0 ? 1.12 : 1),
              }
            );
            if (player.echoShot > 0 && chance(clamp(player.echoShot * 0.075 + luckValue() * 0.008, 0, 0.46))) {
              fireBullet(shotX, shotY, shotAngle + rand(-0.09, 0.09), {
                damage: player.damage * 0.58,
                speed: player.bulletSpeed * 1.08,
                r: Math.max(3.2, player.bulletSize * 0.72),
                pierce: Math.max(0, player.pierce - 1),
                color: '103,168,255',
                fortune: false,
              });
            }
          }
          if (player.voidBomb > 0) {
            const cadence = Math.max(5, 14 - player.voidBomb * 2);
            if (player.shotsFired % cadence === 0) {
              fireBullet(
                player.x + Math.cos(player.aimAngle) * 24,
                player.y + Math.sin(player.aimAngle) * 24,
                player.aimAngle,
                {
                  damage: player.damage * 0.75,
                  speed: player.bulletSpeed * 0.78,
                  r: player.bulletSize + 4 + player.voidBomb,
                  pierce: 0,
                  life: 1.05,
                  color: '195,140,255',
                  blackHole: true,
                }
              );
            }
          }
          if (performance.now() - game.lastShootSound > 50) {
            audio.shoot();
            game.lastShootSound = performance.now();
          }
        }

        if (justPressed(' ')) dash();
        if (justPressed('e')) useOverdrive();
      }

      function updateDrones(dt) {
        for (let i = 0; i < game.drones.length; i++) {
          const drone = game.drones[i];
          drone.angle += dt * (1.6 + i * 0.12);
          drone.shoot -= dt;
          const dx = Math.cos(drone.angle) * drone.radius;
          const dy = Math.sin(drone.angle) * drone.radius;
          drone.x = player.x + dx;
          drone.y = player.y + dy;

          let target = null;
          let bestD = 220;
          for (const enemy of enemies) {
            const d = dist(drone.x, drone.y, enemy.x, enemy.y);
            if (d < bestD) {
              bestD = d;
              target = enemy;
            }
          }
          if (target && drone.shoot <= 0) {
            drone.shoot = Math.max(0.28, 0.8 - game.drones.length * 0.03);
            const a = Math.atan2(target.y - drone.y, target.x - drone.x);
            fireBullet(drone.x, drone.y, a, {
              damage: player.damage * 0.55,
              speed: player.bulletSpeed * 0.9,
              r: player.bulletSize * 0.8,
              pierce: 0,
              color: '195,140,255',
              source: 'drone',
            });
          }
        }
      }

      function updateBullets(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.life -= dt;
          if (b.life <= 0) {
            if (b.blackHole) {
              spawnHazard(b.x, b.y, {
                r: 18,
                maxR: 82 + player.voidBomb * 24,
                grow: 140,
                life: 1.55 + player.voidBomb * 0.18,
                damage: 24 + player.voidBomb * 16,
                pull: 260 + player.voidBomb * 50,
                slow: 0.72,
                color: '195,140,255',
                friendly: true,
              });
              ringBurst(b.x, b.y, '195,140,255', 18, 45, 160, 2, 5);
            }
            bullets.splice(i, 1);
            continue;
          }

          if (b.homing > 0 && enemies.length) {
            let target = null;
            let best = 180;
            for (const enemy of enemies) {
              const d = dist(b.x, b.y, enemy.x, enemy.y);
              if (d < best) { best = d; target = enemy; }
            }
            if (target) {
              const desired = Math.atan2(target.y - b.y, target.x - b.x);
              const current = Math.atan2(b.vy, b.vx);
              const newAngle = current + angleDiff(current, desired) * clamp(dt * (6 + b.homing * 40), 0, 1);
              const speed = Math.hypot(b.vx, b.vy);
              b.vx = Math.cos(newAngle) * speed;
              b.vy = Math.sin(newAngle) * speed;
            }
          }

          b.x += b.vx * dt;
          b.y += b.vy * dt;

          let bounced = false;
          if (b.bounces > 0) {
            if ((b.x < b.r && b.vx < 0) || (b.x > view.w - b.r && b.vx > 0)) {
              b.vx *= -1;
              b.x = clamp(b.x, b.r, view.w - b.r);
              b.bounces -= 1;
              bounced = true;
            }
            if ((b.y < b.r && b.vy < 0) || (b.y > view.h - b.r && b.vy > 0)) {
              b.vy *= -1;
              b.y = clamp(b.y, b.r, view.h - b.r);
              b.bounces -= 1;
              bounced = true;
            }
            if (bounced) {
              b.life = Math.min(b.life + 0.22, 2.2);
              ringBurst(b.x, b.y, b.color, 4, 20, 80, 1, 2.8);
            }
          }

          if (!bounced && (b.x < -80 || b.y < -80 || b.x > view.w + 80 || b.y > view.h + 80)) {
            bullets.splice(i, 1);
            continue;
          }

          for (let j = enemies.length - 1; j >= 0; j--) {
            const enemy = enemies[j];
            if (dist(b.x, b.y, enemy.x, enemy.y) < b.r + enemy.r) {
              if (b.frost > 0) {
                enemy.slowTimer = Math.max(enemy.slowTimer || 0, 0.9 + b.frost * 0.12);
                enemy.slowAmount = Math.min(enemy.slowAmount || 1, Math.max(0.42, 0.78 - b.frost * 0.07));
              }
              if (b.burn > 0) {
                enemy.burnTimer = Math.max(enemy.burnTimer || 0, 1.4 + b.burn * 0.25);
                enemy.burnDps = Math.max(enemy.burnDps || 0, b.damage * (0.12 + b.burn * 0.035));
              }
              const finalDamage = b.damage * (enemy.type === 'boss' ? 1 + player.bossSlayer : 1);
              damageEnemy(enemy, finalDamage);
              if (enemy.hp > 0) audio.hit();
              if (player.chainLightning > 0 && chance(0.65)) {
                triggerLightning(enemy, finalDamage * (0.32 + player.chainLightning * 0.04), Math.min(5, player.chainLightning));
              }
              if (player.executioner > 0 && enemy.hp > 0 && enemy.hp / enemy.maxHp < player.executioner && enemy.type !== 'boss') {
                damageEnemy(enemy, enemy.hp + 1);
              }
              if (b.blackHole) {
                spawnHazard(b.x, b.y, {
                  r: 20,
                  maxR: 90 + player.voidBomb * 25,
                  grow: 150,
                  life: 1.7 + player.voidBomb * 0.2,
                  damage: 28 + player.voidBomb * 18,
                  pull: 285 + player.voidBomb * 55,
                  slow: 0.7,
                  color: '195,140,255',
                  friendly: true,
                });
                ringBurst(b.x, b.y, '195,140,255', 22, 50, 175, 2, 5.5);
                bullets.splice(i, 1);
                break;
              }
              if (b.pierce > 0) {
                b.pierce -= 1;
                b.damage *= 0.88;
              } else {
                if (b.splitShot > 0 && !b.blackHole) {
                  const baseAngle = Math.atan2(b.vy, b.vx);
                  const splitCount = Math.min(4, 2 + Math.floor(b.splitShot / 2));
                  for (let ss = 0; ss < splitCount; ss++) {
                    const side = splitCount === 1 ? 0 : (ss - (splitCount - 1) / 2) / ((splitCount - 1) / 2 || 1);
                    fireBullet(b.x, b.y, baseAngle + side * (0.42 + b.splitShot * 0.05), {
                      damage: b.damage * (0.32 + b.splitShot * 0.04),
                      speed: Math.hypot(b.vx, b.vy) * 0.82,
                      r: Math.max(2.8, b.r * 0.62),
                      life: 0.72,
                      pierce: 0,
                      homing: b.homing * 0.6,
                      frost: b.frost,
                      burn: b.burn,
                      bounces: 0,
                      splitShot: 0,
                      crit: false,
                      fortune: false,
                      color: '103,168,255',
                    });
                  }
                }
                bullets.splice(i, 1);
                break;
              }
            }
          }
        }
      }

      function updateEnemyBullets(dt) {
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const b = enemyBullets[i];
          b.life -= dt;
          if (b.life <= 0) { enemyBullets.splice(i, 1); continue; }
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (b.x < -60 || b.y < -60 || b.x > view.w + 60 || b.y > view.h + 60) {
            enemyBullets.splice(i, 1);
            continue;
          }
          let hitAlly = false;
          for (const ally of allies.slice()) {
            if (dist(b.x, b.y, ally.x, ally.y) < b.r + ally.r) {
              damageAlly(ally, b.damage);
              enemyBullets.splice(i, 1);
              hitAlly = true;
              break;
            }
          }
          if (hitAlly) continue;
          if (dist(b.x, b.y, player.x, player.y) < b.r + player.r) {
            damagePlayer(b.damage);
            enemyBullets.splice(i, 1);
          }
        }
      }

      function updateShockwaves(dt) {
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const s = shockwaves[i];
          s.life -= dt;
          s.r += s.speed * dt;
          if (s.life <= 0 || s.r >= s.maxR) {
            shockwaves.splice(i, 1);
            continue;
          }
          if (s.friendly) {
            for (const enemy of enemies.slice()) {
              if (!s.hit.has(enemy.id) && dist(s.x, s.y, enemy.x, enemy.y) < s.r + enemy.r) {
                s.hit.add(enemy.id);
                damageEnemy(enemy, s.damage);
              }
            }
          } else {
            for (const ally of allies.slice()) {
              const key = `ally-${ally.id}`;
              if (!s.hit.has(key) && dist(s.x, s.y, ally.x, ally.y) < s.r + ally.r) {
                s.hit.add(key);
                damageAlly(ally, s.damage * 0.9);
              }
            }
            if (!s.hit.has('player') && dist(s.x, s.y, player.x, player.y) < s.r + player.r) {
              s.hit.add('player');
              damagePlayer(s.damage);
            }
          }
        }
      }

      function updateHazards(dt) {
        for (let i = hazards.length - 1; i >= 0; i--) {
          const h = hazards[i];
          h.life -= dt;
          if (h.grow) h.r = Math.min(h.maxR, h.r + h.grow * dt);
          if (h.life <= 0) { hazards.splice(i, 1); continue; }

          if (h.friendly) {
            for (const enemy of enemies.slice()) {
              if (!enemies.includes(enemy)) continue;
              const d = dist(h.x, h.y, enemy.x, enemy.y);
              if (d < h.r + enemy.r) {
                if (h.pull) {
                  const n = norm(h.x - enemy.x, h.y - enemy.y);
                  enemy.vx += n.x * h.pull * dt;
                  enemy.vy += n.y * h.pull * dt;
                }
                if (h.slow) {
                  enemy.slowTimer = Math.max(enemy.slowTimer || 0, 0.3);
                  enemy.slowAmount = Math.min(enemy.slowAmount || 1, h.slow);
                }
                damageEnemy(enemy, h.damage * dt);
              }
            }
          } else {
            const d = dist(h.x, h.y, player.x, player.y);
            if (h.pull && d < h.r + 180) {
              const n = norm(h.x - player.x, h.y - player.y);
              player.vx += n.x * h.pull * dt;
              player.vy += n.y * h.pull * dt;
            }
            for (const ally of allies.slice()) {
              const ad = dist(h.x, h.y, ally.x, ally.y);
              if (h.pull && ad < h.r + 150) {
                const an = norm(h.x - ally.x, h.y - ally.y);
                ally.vx += an.x * h.pull * 0.7 * dt;
                ally.vy += an.y * h.pull * 0.7 * dt;
              }
            }
            h.tick -= dt;
            let ticked = false;
            if (d < h.r + player.r && h.tick <= 0) {
              damagePlayer(h.damage * 0.35);
              ticked = true;
            }
            for (const ally of allies.slice()) {
              if (dist(h.x, h.y, ally.x, ally.y) < h.r + ally.r && h.tick <= 0) {
                damageAlly(ally, h.damage * 0.32);
                ticked = true;
              }
            }
            if (ticked) h.tick = 0.35;
          }
        }
      }

      function updateAlliedMines(dt) {
        for (let i = alliedMines.length - 1; i >= 0; i--) {
          const m = alliedMines[i];
          m.life -= dt;
          m.arm = Math.max(0, m.arm - dt);
          if (m.life <= 0) { alliedMines.splice(i, 1); continue; }
          if (m.arm > 0) continue;
          let target = null;
          for (const enemy of enemies) {
            if (dist(m.x, m.y, enemy.x, enemy.y) < m.r + enemy.r + 34) { target = enemy; break; }
          }
          if (target) {
            spawnShockwave(m.x, m.y, {
              r: 12,
              maxR: 78 + m.power * 26,
              speed: 620,
              damage: 36 + m.power * 28,
              color: '255,215,107',
              friendly: true,
              life: 0.34,
            });
            ringBurst(m.x, m.y, '255,215,107', 20, 70, 210, 2, 5.4);
            alliedMines.splice(i, 1);
          }
        }
      }

      function updateTurrets(dt) {
        if (!game.turrets) return;
        for (const turret of game.turrets) {
          turret.angle += dt * 1.8;
          turret.shoot -= dt;
          let target = null;
          let best = 460 + turret.tier * 30;
          for (const enemy of enemies) {
            const d = dist(turret.x, turret.y, enemy.x, enemy.y);
            if (d < best) { best = d; target = enemy; }
          }
          if (target && turret.shoot <= 0) {
            turret.shoot = Math.max(0.18, 0.62 - turret.tier * 0.06);
            const a = Math.atan2(target.y - turret.y, target.x - turret.x);
            fireBullet(turret.x, turret.y, a, {
              damage: player.damage * (0.42 + turret.tier * 0.08),
              speed: player.bulletSpeed * 0.86,
              r: Math.max(3.5, player.bulletSize * 0.72),
              pierce: turret.tier > 2 ? 1 : 0,
              color: '140,255,189',
              source: 'turret',
            });
          }
        }
      }

      function updateAllies(dt) {
        for (let i = allies.length - 1; i >= 0; i--) {
          const ally = allies[i];
          if (!ally || ally.dead) { allies.splice(i, 1); continue; }
          ally.hitFlash = Math.max(0, ally.hitFlash - dt);
          ally.touchCd = Math.max(0, ally.touchCd - dt);
          ally.shoot -= dt;

          let target = null;
          let best = Infinity;
          for (const enemy of enemies) {
            if (!enemy || enemy.dead) continue;
            const d = dist(ally.x, ally.y, enemy.x, enemy.y);
            const score = d * (enemy.type === 'boss' ? 0.72 : 1);
            if (score < best) { best = score; target = enemy; }
          }

          if (target) {
            const d = dist(ally.x, ally.y, target.x, target.y);
            const n = norm(target.x - ally.x, target.y - ally.y);
            const preferred = ally.ranged ? (target.type === 'boss' ? 230 : 165) : ally.r + target.r + 8;
            let mx = 0;
            let my = 0;
            if (ally.ranged) {
              const tangent = { x: -n.y * ally.orbitDir * ally.speed * 0.52, y: n.x * ally.orbitDir * ally.speed * 0.52 };
              const push = d > preferred ? 1 : d < preferred * 0.72 ? -0.85 : 0.1;
              mx = n.x * ally.speed * push + tangent.x;
              my = n.y * ally.speed * push + tangent.y;
            } else {
              mx = n.x * ally.speed;
              my = n.y * ally.speed;
            }
            ally.vx = lerp(ally.vx, mx, clamp(dt * 4.4, 0, 1));
            ally.vy = lerp(ally.vy, my, clamp(dt * 4.4, 0, 1));

            if (ally.ranged && ally.shoot <= 0 && d < 680) {
              ally.shoot = clamp(0.86 - (player.riftConversion || 0) * 0.05 + rand(-0.08, 0.14), 0.38, 1.1);
              const a = Math.atan2(target.y - ally.y, target.x - ally.x);
              fireBullet(ally.x, ally.y, a, {
                damage: ally.damage * (0.62 + (player.allyPower || 0) * 0.08),
                speed: player.bulletSpeed * 0.78,
                r: Math.max(3.2, player.bulletSize * 0.68),
                pierce: ally.elite ? 1 : 0,
                homing: Math.max(0.02, player.homing * 0.55),
                color: ally.color,
                source: 'ally',
              });
            }

            if (d < ally.r + target.r + (ally.ranged ? 10 : 18) && ally.touchCd <= 0) {
              damageEnemy(target, ally.damage * (ally.ranged ? 0.42 : 0.82) * (1 + (player.allyPower || 0) * 0.12), { quiet: true });
              ally.touchCd = ally.ranged ? 0.68 : 0.42;
            }
          } else {
            const angle = game.time * (0.9 + i * 0.05) + i * 1.2;
            const homeX = player.x + Math.cos(angle) * (72 + i * 10);
            const homeY = player.y + Math.sin(angle) * (72 + i * 10);
            const n = norm(homeX - ally.x, homeY - ally.y);
            ally.vx = lerp(ally.vx, n.x * ally.speed * 0.7, clamp(dt * 3.2, 0, 1));
            ally.vy = lerp(ally.vy, n.y * ally.speed * 0.7, clamp(dt * 3.2, 0, 1));
          }

          ally.x += ally.vx * dt;
          ally.y += ally.vy * dt;
          ally.x = clamp(ally.x, 18, view.w - 18);
          ally.y = clamp(ally.y, 18, view.h - 18);
        }
      }

      function updateLightning(dt) {
        for (let i = lightningBolts.length - 1; i >= 0; i--) {
          const l = lightningBolts[i];
          l.life -= dt;
          if (l.life <= 0) lightningBolts.splice(i, 1);
        }
      }

      function updateFloaters(dt) {
        for (let i = floaters.length - 1; i >= 0; i--) {
          const f = floaters[i];
          f.life -= dt;
          if (f.life <= 0) { floaters.splice(i, 1); continue; }
          f.x += f.vx * dt;
          f.y += f.vy * dt;
          f.vy -= 4 * dt;
        }
      }

      function updatePickups(dt) {
        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.life -= dt;
          if (p.life <= 0) { pickups.splice(i, 1); continue; }

          const d = dist(p.x, p.y, player.x, player.y);
          if (d < player.magnet + p.r) {
            const n = norm(player.x - p.x, player.y - p.y);
            const accel = clamp(240 + (player.magnet - d) * 2.5, 120, 620);
            p.vx += n.x * accel * dt;
            p.vy += n.y * accel * dt;
          } else {
            p.vx *= 0.985;
            p.vy *= 0.985;
          }

          p.x += p.vx * dt;
          p.y += p.vy * dt;

          if (d < p.r + player.r + 4) {
            if (p.type === 'scrap') {
              game.score += 8 * p.value * (1 + game.combo * 0.015) * (1 + player.scrapBonus);
              game.overdriveMeter = clamp(game.overdriveMeter + 3.8 * p.value * (1 + player.scrapBonus * 0.45) * (player.overdriveGain || 1), 0, 100);
              if (player.pickupBolts > 0 && enemies.length && chance(clamp(0.18 + player.pickupBolts * 0.06 + luckValue() * 0.01, 0, 0.62))) {
                let target = null;
                let best = 520;
                for (const enemy of enemies) {
                  const pd = dist(p.x, p.y, enemy.x, enemy.y);
                  if (pd < best) { best = pd; target = enemy; }
                }
                if (target) {
                  const a = Math.atan2(target.y - p.y, target.x - p.x);
                  fireBullet(p.x, p.y, a, {
                    damage: player.damage * (0.32 + player.pickupBolts * 0.08),
                    speed: player.bulletSpeed * 0.82,
                    r: Math.max(3, player.bulletSize * 0.58),
                    pierce: 0,
                    color: '255,215,107',
                    fortune: false,
                  });
                }
              }
              audio.collect();
            } else if (p.type === 'heal') {
              player.hp = Math.min(player.maxHp, player.hp + p.value);

      function updateEnemies(dt) {
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.hitFlash = Math.max(0, e.hitFlash - dt);
          e.touchCd = Math.max(0, e.touchCd - dt);
          e.allyTouchCd = Math.max(0, (e.allyTouchCd || 0) - dt);

          if (!e || e.dead) continue;

          if (e.burnTimer > 0) {
            e.burnTimer = Math.max(0, e.burnTimer - dt);
            e.dotFx = Math.max(0, (e.dotFx || 0) - dt);

              addParticle(e.x + rand(-e.r, e.r), e.y + rand(-e.r, e.r), { vx: rand(-25, 25), vy: rand(-40, 15), r: rand(1.4, 3.2), life: rand(0.12, 0.28), color: '255,109,122', glow: 6 });

            if (!enemies.includes(e)) continue;
          }

          const baseSpeed = e.speed;
          if (e.slowTimer > 0) {
            e.slowTimer = Math.max(0, e.slowTimer - dt);
            e.speed = baseSpeed * (e.slowAmount || 0.72);
          } else {
            e.slowAmount = 1;

          const toPlayer = norm(player.x - e.x, player.y - e.y);
          const dToPlayer = dist(e.x, e.y, player.x, player.y);

          if (e.type === 'scout' || e.type === 'mite') {
            const accel = e.speed * (e.type === 'mite' ? 3.4 : 2.6);
            e.vx = lerp(e.vx, toPlayer.x * e.speed, clamp(dt * accel * 0.03, 0, 1));
            e.vy = lerp(e.vy, toPlayer.y * e.speed, clamp(dt * accel * 0.03, 0, 1));
          } else if (e.type === 'splitter') {
            const orbit = Math.sin(game.time * 1.6 + e.id) * 0.7;
            const tangent = { x: -toPlayer.y * orbit * e.speed * 0.5, y: toPlayer.x * orbit * e.speed * 0.5 };
            e.vx = lerp(e.vx, toPlayer.x * e.speed + tangent.x, clamp(dt * 3.8, 0, 1));
            e.vy = lerp(e.vy, toPlayer.y * e.speed + tangent.y, clamp(dt * 3.8, 0, 1));

          } else if (e.type === 'orbiter') {
            const desired = dToPlayer > 270 ? 1 : dToPlayer < 185 ? -1 : 0;
            const tangent = { x: -toPlayer.y * e.speed * 0.95 * e.orbitDir, y: toPlayer.x * e.speed * 0.95 * e.orbitDir };
            e.vx = lerp(e.vx, toPlayer.x * e.speed * desired + tangent.x, clamp(dt * 4.3, 0, 1));
            e.vy = lerp(e.vy, toPlayer.y * e.speed * desired + tangent.y, clamp(dt * 4.3, 0, 1));
            e.shoot -= dt;
            if (e.shoot <= 0 && dToPlayer < 500) {
              e.shoot = rand(1.05, 1.65);
              const a = Math.atan2(player.y - e.y, player.x - e.x);
              fireEnemyBullet(e.x, e.y, a + 0.28 * e.orbitDir, 270 + game.wave * 5, 4.8, 10 + game.wave * 0.25, e.elite ? '255,90,220' : '140,255,189');
              fireEnemyBullet(e.x, e.y, a - 0.28 * e.orbitDir, 270 + game.wave * 5, 4.8, 10 + game.wave * 0.25, e.elite ? '255,90,220' : '140,255,189');
            }
          } else if (e.type === 'sniper') {
            if (e.aiming > 0) {
              e.aiming -= dt;
              e.vx *= 0.84;
              e.vy *= 0.84;

                const shots = e.elite ? [-0.08, 0, 0.08] : [0];
                for (const off of shots) fireEnemyBullet(e.x, e.y, e.sniperAngle + off, 620 + game.wave * 8, 7.5, 18 + game.wave * 0.55, e.elite ? '255,90,220' : '255,177,85');

          } else if (e.type === 'mine') {

            if (e.armed > 0) {
              e.armed -= dt;
              e.r += dt * 7;

                spawnHazard(e.x, e.y, { r: 36, life: 0.9, damage: 18, color: e.color, friendly: false });

          } else if (e.type === 'guardian') {

            e.vx = lerp(e.vx, toPlayer.x * e.speed * desired + tangent.x, clamp(dt * 3.2, 0, 1));
            e.vy = lerp(e.vy, toPlayer.y * e.speed * desired + tangent.y, clamp(dt * 3.2, 0, 1));
            e.heal -= dt;
            if (e.heal <= 0) {
              e.heal = rand(3.0, 4.4);

                if (ally !== e && ally.type !== 'boss' && dist(e.x, e.y, ally.x, ally.y) < 170) {
                  ally.hp = Math.min(ally.maxHp, ally.hp + 18 + game.wave * 1.25);

                  addParticle(ally.x, ally.y, { vx: rand(-35, 35), vy: rand(-35, 35), r: rand(2, 4), life: 0.32, color: '140,255,189', glow: 9 });

                for (let s = 0; s < count; s++) spawnEnemy(spawnType, false, e.x + rand(-22, 22), e.y + rand(-22, 22));
                ringBurst(e.x, e.y, e.color, 10, 40, 130, 1.4, 3.4);
              }
            }
            e.shoot -= dt;
            if (e.shoot <= 0 && dToPlayer < 440) {
              e.shoot = rand(1.35, 2.0);
              const a = Math.atan2(player.y - e.y, player.x - e.x);
              fireEnemyBullet(e.x, e.y, a, 300 + game.wave * 4, 5.4, 12 + game.wave * 0.26, e.elite ? '255,90,220' : e.color);
            }
          } else if (e.type === 'leech') {
            const wiggle = Math.sin(game.time * 4.0 + e.pulse) * 0.5;
            const tangent = { x: -toPlayer.y * e.speed * wiggle, y: toPlayer.x * e.speed * wiggle };
            e.vx = lerp(e.vx, toPlayer.x * e.speed + tangent.x, clamp(dt * 4.0, 0, 1));
            e.vy = lerp(e.vy, toPlayer.y * e.speed + tangent.y, clamp(dt * 4.0, 0, 1));
            e.drain -= dt;
            if (dToPlayer < 145 && e.drain <= 0) {
              e.drain = e.elite ? 0.52 : 0.68;
              const drain = 5 + game.wave * 0.22 + (e.elite ? 4 : 0);
              damagePlayer(drain);
              e.hp = Math.min(e.maxHp, e.hp + drain * 1.8);
              spawnFloater(e.x, e.y - e.r - 10, 'DRAIN', e.color, 12, 0.6);
              if (lightningBolts.length < ENTITY_LIMITS.lightningBolts) lightningBolts.push({ x1: e.x, y1: e.y, x2: player.x, y2: player.y, life: 0.12, maxLife: 0.12, color: e.color });
            }
          } else if (e.type === 'artillery') {
            const desired = dToPlayer > 560 ? 1 : dToPlayer < 390 ? -1 : 0;
            const tangent = { x: -toPlayer.y * e.speed * 0.28, y: toPlayer.x * e.speed * 0.28 };
            e.vx = lerp(e.vx, toPlayer.x * e.speed * desired + tangent.x, clamp(dt * 2.5, 0, 1));
            e.vy = lerp(e.vy, toPlayer.y * e.speed * desired + tangent.y, clamp(dt * 2.5, 0, 1));
            if (e.aiming > 0) {
              e.aiming -= dt;
              e.vx *= 0.88;
              e.vy *= 0.88;
              if (e.aiming <= 0) {
                const blasts = e.elite ? 2 : 1;
                for (let b = 0; b < blasts; b++) {
                  spawnHazard(clamp(e.aimX + rand(-38, 38), 42, view.w - 42), clamp(e.aimY + rand(-38, 38), 42, view.h - 42), {
                    r: 20,
                    maxR: 68 + (e.elite ? 16 : 0),
                    grow: 150,
                    life: 1.35,
                    damage: 17 + game.wave * 0.38,
                    color: e.elite ? '255,90,220' : e.color,
                    friendly: false,
                  });
                }
                ringBurst(e.x, e.y, e.elite ? '255,90,220' : e.color, 10, 45, 130, 1.4, 3.4);
              }
            } else {
              e.lob -= dt;
              if (e.lob <= 0 && dToPlayer < 760) {
                e.aiming = e.elite ? 0.5 : 0.68;
                e.aimX = clamp(player.x + player.vx * 0.28 + rand(-55, 55), 42, view.w - 42);
                e.aimY = clamp(player.y + player.vy * 0.28 + rand(-55, 55), 42, view.h - 42);
                e.lob = rand(2.2, 3.5);
              }
            }
          } else if (e.type === 'shooter') {
            const desired = dToPlayer > 300 ? 1 : dToPlayer < 190 ? -1 : 0;
            const tangent = { x: -toPlayer.y * e.speed * 0.7, y: toPlayer.x * e.speed * 0.7 };
            e.vx = lerp(e.vx, toPlayer.x * e.speed * desired + tangent.x * 0.3, clamp(dt * 4, 0, 1));
            e.vy = lerp(e.vy, toPlayer.y * e.speed * desired + tangent.y * 0.3, clamp(dt * 4, 0, 1));
            e.shoot -= dt;
            if (e.shoot <= 0 && dToPlayer < 440) {
              e.shoot = rand(1.1, 1.7);
              const a = Math.atan2(player.y - e.y, player.x - e.x);
              fireEnemyBullet(e.x, e.y, a, 310 + game.wave * 6, 5.5, 12 + game.wave * 0.35, e.elite ? '255,90,220' : '255,109,122');
              if (e.elite) {
                fireEnemyBullet(e.x, e.y, a - 0.16, 300 + game.wave * 6, 4.6, 10, '255,90,220');
                fireEnemyBullet(e.x, e.y, a + 0.16, 300 + game.wave * 6, 4.6, 10, '255,90,220');
              }

              e.vy *= 0.88;

                e.vx = Math.cos(e.chargeDir) * 480;
                e.vy = Math.sin(e.chargeDir) * 480;
                e.charge = 1.25;
