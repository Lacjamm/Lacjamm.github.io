                  const arcs = 7 + e.phase * 3 + Math.min(3, e.bossTier);
                  for (let aidx = 0; aidx < arcs; aidx++) {
                    const angle = (aidx / arcs) * TAU + game.time * 0.8;
                    fireEnemyBullet(e.x, e.y, angle, bossShotSpeed(e, 545 + e.phase * 35), 6.4, bossShotDamage(e, 17 + e.phase * 3), e.color);
                  }
                  spawnShockwave(e.x, e.y, { r: 12, maxR: 145 + e.phase * 52, speed: 620, damage: bossShotDamage(e, 18 + e.phase * 5), color: e.color, friendly: false, life: 0.33 });
                } else if (e.bossKind === 'bossColossus') {
                  spawnShockwave(e.x, e.y, { r: 18, maxR: 195 + e.phase * 54, speed: 560, damage: bossShotDamage(e, 24 + e.phase * 8), color: e.color, friendly: false, life: 0.4 });
                  e.shield = Math.min(e.maxShield || 0, (e.shield || 0) + 60 + e.phase * 35);
                } else if (e.bossKind === 'bossQueen') {
                  const swarms = Math.min(8, 4 + e.phase * 2 + Math.floor(e.bossTier / 2) + (e.enraged ? 1 : 0));
                  for (let q = 0; q < swarms && countBossAdds() < bossAddLimit(); q++) {
                    const spawnType = q === 0 && game.wave >= 25 ? 'replicator' : chance(0.5) ? 'mite' : 'orbiter';
                    spawnEnemy(spawnType, chance(0.24 + e.phase * 0.08 + (e.enraged ? 0.08 : 0)), e.x + rand(-90, 90), e.y + rand(-90, 90));
                  }
                } else if (e.bossKind === 'bossChrono') {
                  spawnHazard(clamp(player.x + rand(-70, 70), 50, view.w - 50), clamp(player.y + rand(-70, 70), 50, view.h - 50), {
                    r: 32, maxR: 108, grow: 105, life: 2.6 + e.phase * 0.45, damage: bossShotDamage(e, 15 + e.phase * 4), pull: 60, slow: 0.5, color: e.color, friendly: false,
                  });
                  const a = Math.atan2(player.y - e.y, player.x - e.x);
                  for (const off of [-0.46, -0.22, 0, 0.22, 0.46]) fireEnemyBullet(e.x, e.y, a + off, bossShotSpeed(e, 690 + e.phase * 42), 7.6, bossShotDamage(e, 18 + e.phase * 4), e.color);
                } else if (e.bossKind === 'bossEclipse') {
                  bossTargetHazards(e, 2 + e.phase, { r: 24, maxR: 82 + e.phase * 12, grow: 110, life: 2.2 + e.phase * 0.35, damage: 14 + e.phase * 3, pull: 70 + e.phase * 25, slow: 0.72, color: e.color, playerBias: 0.9 });
                  fireBossRing(e, 12 + e.phase * 5 + (e.enraged ? 3 : 0), 280 + e.phase * 26, 5.2, 12 + e.phase * 2, -game.time * 0.55, 0.05);
                } else if (e.bossKind === 'bossDealer') {
                  const a = Math.atan2(player.y - e.y, player.x - e.x);
                  fireBossFan(e, a, 6 + e.phase * 3 + (e.enraged ? 2 : 0), 0.92, 430 + e.phase * 34, 5.6, 13 + e.phase * 3, 0.05);
                  for (let m = 0; m < 2 + e.phase; m++) {
                    spawnHazard(clamp(player.x + rand(-140, 140), 45, view.w - 45), clamp(player.y + rand(-140, 140), 45, view.h - 45), { r: 18, maxR: 60, grow: 120, life: 1.45, damage: 13 + e.phase * 3, color: e.color, friendly: false });
                  }
                } else if (e.bossKind === 'bossNova') {
                  fireBossRing(e, 18 + e.phase * 6 + Math.min(6, e.bossTier), 305 + e.phase * 28, 5.4, 14 + e.phase * 3, game.time * 0.72, 0.06);
                  bossTargetHazards(e, 2 + e.phase, { r: 22, maxR: 76 + e.phase * 10, grow: 120, life: 1.9 + e.phase * 0.25, damage: 14 + e.phase * 3, playerBias: 0.88 });
                } else if (e.bossKind === 'bossMirror') {
                  const mx = view.w - e.x;
                  const my = clamp(e.y + Math.sin(game.time * 2.1) * 95, 45, view.h - 45);
                  spawnShockwave(mx, my, { r: 14, maxR: 130 + e.phase * 34, speed: 520, damage: bossShotDamage(e, 13 + e.phase * 4), color: e.color, friendly: false, life: 0.32 });
                  const ma = Math.atan2(player.y - my, player.x - mx);
                  for (let s = 0; s < 7 + e.phase * 2; s++) fireEnemyBullet(mx, my, ma + (s - 3 - e.phase) * 0.18, bossShotSpeed(e, 420 + e.phase * 30), 5.1, bossShotDamage(e, 13 + e.phase * 3), e.color);
                } else if (e.bossKind === 'bossObelisk') {
                  spawnShockwave(e.x, e.y, { r: 20, maxR: 210 + e.phase * 52, speed: 540, damage: bossShotDamage(e, 22 + e.phase * 7), color: e.color, friendly: false, life: 0.42 });
                  e.shield = Math.min(e.maxShield || 0, (e.shield || 0) + 90 + e.phase * 45);
                  bossEdgeCrossfire(e, 2 + e.phase + Math.min(2, e.bossTier));
                } else if (e.bossKind === 'bossReaver') {
                  const dashA = Math.atan2(player.y - e.y, player.x - e.x) + rand(-0.22, 0.22);
                  e.vx = Math.cos(dashA) * (620 + e.phase * 115);
                  e.vy = Math.sin(dashA) * (620 + e.phase * 115);
                  spawnShockwave(e.x, e.y, { r: 14, maxR: 145 + e.phase * 44, speed: 610, damage: bossShotDamage(e, 18 + e.phase * 5), color: e.color, friendly: false, life: 0.34 });
                  fireBossFan(e, dashA, 8 + e.phase * 3, 1.05, 500 + e.phase * 32, 5.2, 16 + e.phase * 3, 0.04);
                } else if (e.bossKind === 'bossMaelstrom') {
                  const spokes = 18 + e.phase * 7 + Math.min(8, e.bossTier);
                  fireBossRing(e, spokes, 285 + e.phase * 30, 5.2, 13 + e.phase * 3, game.time * 1.2, 0.08);
                  bossEdgeCrossfire(e, 2 + e.phase + Math.min(3, e.bossTier));
                } else if (e.bossKind === 'bossMothership') {
                  spawnBossAdds(e, 4 + e.phase * 2 + Math.floor((e.lateBossPower || 0) / 5), 0.36);
                  bossTargetHazards(e, 2 + e.phase, { r: 24, maxR: 78 + e.phase * 12, grow: 105, life: 2.1, damage: 13 + e.phase * 3, playerBias: 0.82 });
                  e.shield = Math.min(e.maxShield || 0, (e.shield || 0) + 55 + e.phase * 28);
                } else if (e.bossKind === 'bossApex') {
                  fireBossRing(e, 22 + e.phase * 8 + Math.min(10, e.bossTier), 315 + e.phase * 32, 5.7, 16 + e.phase * 4, -game.time * 0.88, 0.05);
                  bossTargetHazards(e, 3 + e.phase, { r: 26, maxR: 88 + e.phase * 16, grow: 118, life: 2.2 + e.phase * 0.3, damage: 15 + e.phase * 4, pull: 95, slow: 0.55, playerBias: 0.9 });
                  bossEdgeCrossfire(e, 3 + e.phase + Math.min(3, e.bossTier));
                } else if (e.bossKind === 'bossEntropy') {
                  const a = Math.atan2(player.y - e.y, player.x - e.x) + rand(-0.2, 0.2);
                  fireBossFan(e, a, 9 + e.phase * 4 + Math.min(4, e.bossTier), 1.05 + e.phase * 0.12, 450 + e.phase * 45, 5.4, 17 + e.phase * 4, 0.08);
                  fireBossRing(e, 16 + e.phase * 8 + Math.min(10, e.bossTier), 270 + e.phase * 34, 5.0, 14 + e.phase * 3, rand(0, TAU), 0.12);
                  bossTargetHazards(e, 3 + e.phase, { r: 22, maxR: 82 + e.phase * 16, grow: 125, life: 1.8 + e.phase * 0.28, damage: 14 + e.phase * 4, pull: 75, slow: 0.62, playerBias: 0.94 });
                }
              }

              if (e.crossfire <= 0) {
                if (isFirstBossEncounter(e)) {
                  e.crossfire = bossTimer(e, 4.6, 2.6, 0.18, 0.05);
                  if (e.phase >= 2 && e.enraged) bossEdgeCrossfire(e, 1);
                } else if (isSecondBossEncounter(e)) {
                  e.crossfire = bossTimer(e, 6.8, 3.2, 0.12, 0.02);
                  bossEdgeCrossfire(e, 1 + (e.phase >= 2 && e.enraged ? 1 : 0));
                } else {
                  e.crossfire = bossTimer(e, 2.85, 1.35, 0.32, 0.09);
                  bossEdgeCrossfire(e, 2 + e.phase + Math.min(2, e.bossTier) + (e.enraged ? 1 : 0));
                }
              }

              if (e.rageBurst <= 0) {
                e.rageBurst = isFirstBossEncounter(e) ? bossTimer(e, 5.4, 3.0, 0.32, 0.08) : isSecondBossEncounter(e) ? bossTimer(e, 7.2, 4.0, 0.18, 0.04) : bossTimer(e, 4.3, 2.1, 0.48, 0.14);
                bossRageBurst(e);
              }

              if (e.summon <= 0) {
                e.summon = isSecondBossEncounter(e) ? bossTimer(e, (bossDefinitions[e.bossKind] || bossDefinitions.bossWarden).summon, 2.8, 0.22, 0.04) : bossTimer(e, (bossDefinitions[e.bossKind] || bossDefinitions.bossWarden).summon, 1.65, 0.58, 0.12);
                const roomForAdds = Math.max(0, bossAddLimit() - countBossAdds());
                const intro = isFirstBossEncounter(e);
                const second = isSecondBossEncounter(e);
                const late = intro || second ? 0 : (e.lateBossPower || 0);
                const adds = Math.min(roomForAdds, intro ? 1 + e.phase + (e.enraged ? 1 : 0) : second ? 1 + Math.floor(e.phase / 2) + (e.enraged ? 1 : 0) : 3 + e.phase * 2 + Math.floor(e.bossTier / 2) + Math.floor(late / 4) + (e.enraged ? 2 : 0) + (e.bossKind === 'bossForge' || e.bossKind === 'bossQueen' || e.bossKind === 'bossMothership' ? 1 : 0));
                const pool = bossAddPool(e);
                for (let s = 0; s < adds; s++) {
                  spawnEnemy(pool[irand(0, pool.length - 1)], chance(intro ? 0.08 + e.phase * 0.04 + (e.enraged ? 0.04 : 0) : second ? 0.06 + e.phase * 0.025 + (e.enraged ? 0.025 : 0) : Math.min(0.74, 0.32 + e.phase * 0.1 + late * 0.018 + (e.enraged ? 0.08 : 0))), e.x + rand(-85, 85), e.y + rand(-85, 85));
                }
              }
            }
          }

          e.x += e.vx * dt;
          e.y += e.vy * dt;

          e.x = clamp(e.x, -100, view.w + 100);
          e.y = clamp(e.y, -100, view.h + 100);
          e.speed = baseSpeed;

          for (const ally of allies.slice()) {
            const allyDist = dist(e.x, e.y, ally.x, ally.y);
            if (allyDist < e.r + ally.r) {
              const overlap = (e.r + ally.r) - allyDist;
              const push = norm(e.x - ally.x, e.y - ally.y);
              e.x += push.x * overlap * 0.22;
              e.y += push.y * overlap * 0.22;
              ally.x -= push.x * overlap * 0.18;
              ally.y -= push.y * overlap * 0.18;
              if (e.allyTouchCd <= 0) {
                damageAlly(ally, e.damage * 0.72);
                damageEnemy(e, Math.max(3, ally.damage * 0.32), { quiet: true });
                e.allyTouchCd = 0.58;
              }
            }
          }

          if (dist(e.x, e.y, player.x, player.y) < e.r + player.r) {
            const overlap = (e.r + player.r) - dist(e.x, e.y, player.x, player.y);
            if (overlap > 0) {
              const push = norm(e.x - player.x, e.y - player.y);
              e.x += push.x * overlap * 0.45;
              e.y += push.y * overlap * 0.45;
              if (e.touchCd <= 0) {
                damagePlayer(e.damage);
                e.touchCd = 0.55;
              }
            }
          }
        }
      }

      function updateWaves(dt) {
        if (game.spawnQueue.length > 0) {
          game.spawnTimer -= dt;
          if (game.spawnTimer <= 0) {
            const next = game.spawnQueue.shift();
            spawnEnemy(next.type, next.elite);
            game.spawnTimer = next.delay ?? 0.5;
          }
        } else if (enemies.length === 0 && !game.waveResolved) {
          game.waveResolved = true;
          if (player.clearHeal > 0) player.hp = Math.min(player.maxHp, player.hp + player.clearHeal);
          if (player.clearShield > 0) player.shield = Math.min(player.maxShield, player.shield + player.clearShield);
          if (player.clearOverdrive > 0) game.overdriveMeter = clamp(game.overdriveMeter + player.clearOverdrive, 0, 100);
          if (player.rerollBonus > 0 && game.wave % 5 === 0) game.rerolls += 1;
          game.mode = 'levelup';
          game.offers = generateOffers();
          screenShake(8);
          showLevelUp();
        }
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vx *= 0.985;
          p.vy *= 0.985;
        }

        for (let i = trails.length - 1; i >= 0; i--) {
          const t = trails[i];
          t.life -= dt;
          if (t.life <= 0) trails.splice(i, 1);
        }
      }

      function updateBackground(dt) {
        for (const star of stars) {
          star.y += dt * (10 + star.z * 16);
          star.x += Math.sin(game.time * 0.35 + star.twinkle) * dt * star.z * 6;
          if (star.y > view.h + 10) {
            star.y = -10;
            star.x = rand(0, view.w);
          }
        }
      }

      function update(dt) {
        if (!game) return;
        audio.update(dt);
        if (game.mode === 'paused') return;
        game.time += dt;
        game.flash = Math.max(0, game.flash - dt);
        game.shake = Math.max(0, game.shake - dt * 20);
        game.messageTimer = Math.max(0, game.messageTimer - dt);
        game.comboTimer = Math.max(0, game.comboTimer - dt);
        if (game.comboTimer <= 0) game.combo = Math.max(0, game.combo - dt * 10);

        updateBackground(dt);
        updateParticles(dt);
        updateLightning(dt);
        updateFloaters(dt);

        if (game.mode === 'playing') {
          updatePlayer(dt);
          updateDrones(dt);
          updateTurrets(dt);
          updateAllies(dt);
          updateAlliedMines(dt);
          updateBullets(dt);
          const hostileDt = player && player.overdriveTimer > 0 && player.timeSlow > 0 ? dt * Math.max(0.42, 1 - player.timeSlow * 0.16) : dt;
          updateEnemyBullets(hostileDt);
          updateShockwaves(dt);
          updateHazards(dt);
          updatePickups(dt);
          updateEnemies(hostileDt);
          updateWaves(dt);
          enforceEntityCaps();
        } else if (game.mode === 'levelup') {
          updateHazards(dt * 0.4);
          updatePickups(dt * 0.6);
        }
      }

      function drawBackground() {
        const t = game ? game.time : 0;
        const bg = ctx.createLinearGradient(0, 0, 0, view.h);
        bg.addColorStop(0, '#07101c');
        bg.addColorStop(1, '#04070d');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, view.w, view.h);

        ctx.save();
        for (const star of stars) {
          const alpha = 0.2 + Math.sin(t * 1.5 + star.twinkle) * 0.12 + star.z * 0.18;
          ctx.fillStyle = `rgba(190,220,255,${alpha})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, TAU);
          ctx.fill();
        }
        ctx.restore();

        ctx.save();
        ctx.translate(view.w / 2, view.h / 2);
        ctx.rotate(Math.sin(t * 0.11) * 0.06);
        const size = Math.max(view.w, view.h) * 0.95;
        ctx.strokeStyle = 'rgba(90,140,220,0.08)';
        ctx.lineWidth = 1;
        for (let x = -size; x <= size; x += 42) {
          ctx.beginPath();
          ctx.moveTo(x, -size);
          ctx.lineTo(x, size);
          ctx.stroke();
        }
        for (let y = -size; y <= size; y += 42) {
          ctx.beginPath();
          ctx.moveTo(-size, y);
          ctx.lineTo(size, y);
          ctx.stroke();
        }
        ctx.restore();

        const glow = ctx.createRadialGradient(view.w / 2, view.h / 2, 0, view.w / 2, view.h / 2, Math.max(view.w, view.h) * 0.7);
        glow.addColorStop(0, 'rgba(26, 78, 130, 0.10)');
        glow.addColorStop(0.5, 'rgba(110, 50, 145, 0.05)');
        glow.addColorStop(1, 'rgba(0,0,0,0.25)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, view.w, view.h);
      }

      function drawTrails() {
        for (const t of trails) {
          const alpha = (t.life / t.maxLife) * 0.35;
          ctx.fillStyle = `rgba(${t.color},${alpha})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, t.r * (0.65 + (1 - t.life / t.maxLife) * 0.6), 0, TAU);
          ctx.fill();
        }
      }

      function drawHazards() {
        for (const h of hazards) {
          const age = 1 - h.life / h.maxLife;
          const alpha = clamp(h.life / h.maxLife, 0, 1) * (h.friendly ? 0.34 : 0.42);
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = `rgba(${h.color},${alpha * 0.36})`;
          ctx.shadowBlur = 22;
          ctx.shadowColor = `rgba(${h.color},${alpha})`;
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.r * (0.9 + Math.sin(game.time * 6 + h.pulse) * 0.04), 0, TAU);
          ctx.fill();
          ctx.strokeStyle = `rgba(${h.color},${alpha})`;
          ctx.lineWidth = h.friendly ? 2.2 : 3;
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.r * (0.88 + age * 0.14), 0, TAU);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawAlliedMines() {
        for (const m of alliedMines) {
          const pulse = 0.75 + Math.sin(game.time * 8 + m.pulse) * 0.2;
          ctx.save();
          ctx.translate(m.x, m.y);
          ctx.rotate(game.time * 1.7 + m.pulse);
          ctx.shadowBlur = 14;
          ctx.shadowColor = 'rgba(255,215,107,0.75)';
          ctx.fillStyle = `rgba(255,215,107,${pulse})`;
          ctx.strokeStyle = 'rgba(255,255,255,0.2)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * TAU;
            const rr = i % 2 === 0 ? m.r : m.r * 0.55;
            const px = Math.cos(a) * rr;
            const py = Math.sin(a) * rr;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawTurrets() {
        if (!game.turrets) return;
        for (const turret of game.turrets) {
          ctx.save();
          ctx.translate(turret.x, turret.y);
          ctx.rotate(turret.angle);
          ctx.shadowBlur = 14;
          ctx.shadowColor = 'rgba(140,255,189,0.8)';
          ctx.fillStyle = 'rgba(140,255,189,0.9)';
          ctx.strokeStyle = 'rgba(255,255,255,0.24)';
          ctx.lineWidth = 1.4;
          roundRect(-turret.r, -turret.r, turret.r * 2, turret.r * 2, 6, true, true);
          ctx.fillStyle = 'rgba(6,10,16,0.62)';
          ctx.beginPath();
          ctx.arc(0, 0, turret.r * 0.45, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawLightning() {
        for (const l of lightningBolts) {
          const alpha = clamp(l.life / l.maxLife, 0, 1);
          ctx.save();
          ctx.strokeStyle = `rgba(${l.color},${alpha})`;
          ctx.lineWidth = 2.4;
          ctx.shadowBlur = 16;
          ctx.shadowColor = `rgba(${l.color},${alpha})`;
          ctx.beginPath();
          ctx.moveTo(l.x1, l.y1);
          const mx = (l.x1 + l.x2) / 2 + rand(-12, 12);
          const my = (l.y1 + l.y2) / 2 + rand(-12, 12);
          ctx.lineTo(mx, my);
          ctx.lineTo(l.x2, l.y2);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawPickups() {
        for (const p of pickups) {
          const pulse = 0.65 + Math.sin(game.time * 8 + p.x * 0.02) * 0.15;
          ctx.save();
          ctx.shadowBlur = 16;
          ctx.shadowColor = p.type === 'heal' ? 'rgba(140,255,189,0.8)' : 'rgba(116,243,255,0.8)';
          ctx.fillStyle = p.type === 'heal' ? `rgba(140,255,189,${pulse})` : `rgba(116,243,255,${pulse})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, TAU);
          ctx.fill();
          ctx.restore();
          if (p.type === 'heal') {
            ctx.strokeStyle = 'rgba(8,20,15,0.85)';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(p.x - 5, p.y);
            ctx.lineTo(p.x + 5, p.y);
            ctx.moveTo(p.x, p.y - 5);
            ctx.lineTo(p.x, p.y + 5);
            ctx.stroke();
          }
        }
      }

      function drawBullets() {
        for (const b of bullets) {
          ctx.save();
          ctx.shadowBlur = 14;
          ctx.shadowColor = `rgba(${b.color},${b.blackHole ? 1 : 0.9})`;
          ctx.fillStyle = `rgba(${b.color},${b.blackHole ? 0.82 : 0.95})`;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.blackHole ? b.r * (0.9 + Math.sin(game.time * 12) * 0.1) : b.r, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
        for (const b of enemyBullets) {
          ctx.save();
          ctx.shadowBlur = 12;
          ctx.shadowColor = `rgba(${b.color},0.8)`;
          ctx.fillStyle = `rgba(${b.color},0.95)`;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawShockwaves() {
        for (const s of shockwaves) {
          const alpha = clamp(s.life / 0.35, 0, 1) * 0.8;
          ctx.save();
          ctx.strokeStyle = `rgba(${s.color},${alpha})`;
          ctx.lineWidth = 3;
          ctx.shadowBlur = 10;
          ctx.shadowColor = `rgba(${s.color},${alpha})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, TAU);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawAllies() {
        for (const ally of allies) {
          if (!ally || ally.dead) continue;
          const hpPct = clamp(ally.hp / ally.maxHp, 0, 1);
          ctx.save();
          ctx.translate(ally.x, ally.y);
          ctx.rotate(Math.atan2(ally.vy, ally.vx) + Math.PI / 2);
          ctx.shadowBlur = ally.elite ? 18 : 13;
          ctx.shadowColor = `rgba(${ally.color},0.82)`;
          ctx.fillStyle = ally.hitFlash > 0 ? 'rgba(255,255,255,0.96)' : `rgba(${ally.color},0.88)`;
          ctx.strokeStyle = 'rgba(255,255,255,0.28)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * TAU;
            const rr = i % 2 === 0 ? ally.r : ally.r * 0.62;
            const px = Math.cos(a) * rr;
            const py = Math.sin(a) * rr;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = 'rgba(7,15,12,0.58)';
          ctx.beginPath();
          ctx.arc(0, 0, ally.r * 0.38, 0, TAU);
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.strokeStyle = `rgba(${ally.color},0.55)`;
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 5]);
          ctx.beginPath();
          ctx.arc(ally.x, ally.y, ally.r + 6, -Math.PI / 2, -Math.PI / 2 + TAU * hpPct);
          ctx.stroke();
          ctx.restore();

          if (ally.hp < ally.maxHp) {
            const w = Math.max(28, ally.r * 2.1);
            const h = 4.5;
            const y = ally.y + ally.r + 13;
            ctx.fillStyle = 'rgba(0,0,0,0.42)';
            roundRect(ally.x - w / 2, y, w, h, h / 2, true, false);
            ctx.fillStyle = `rgba(${ally.color},0.9)`;
            roundRect(ally.x - w / 2, y, w * hpPct, h, h / 2, true, false);
          }
        }
      }


      function bossStarPath(points, outerR, innerR, rotation = 0) {
        ctx.beginPath();
        for (let i = 0; i < points * 2; i++) {
          const a = rotation + (i / (points * 2)) * TAU;
          const rr = i % 2 === 0 ? outerR : innerR;
          const px = Math.cos(a) * rr;
          const py = Math.sin(a) * rr;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
      }

      function bossPolygonPath(sides, radius, rotation = 0) {
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
          const a = rotation + (i / sides) * TAU;
          const px = Math.cos(a) * radius;
          const py = Math.sin(a) * radius;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
      }

      function drawBossEye(r) {
        ctx.fillStyle = 'rgba(8,10,16,0.7)';
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.34, r * 0.2, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.82)';
        ctx.beginPath();
        ctx.arc(r * 0.06, 0, r * 0.07, 0, TAU);
        ctx.fill();
      }

      function drawBossCrown(r) {
        ctx.beginPath();
        ctx.moveTo(-r * 0.7, r * 0.38);
        ctx.lineTo(-r * 0.48, -r * 0.12);
        ctx.lineTo(-r * 0.18, r * 0.08);
        ctx.lineTo(0, -r * 0.34);
        ctx.lineTo(r * 0.18, r * 0.08);
        ctx.lineTo(r * 0.48, -r * 0.12);
        ctx.lineTo(r * 0.7, r * 0.38);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      function drawBossWings(r) {
        ctx.beginPath();
        ctx.moveTo(-r * 0.9, 0);
        ctx.quadraticCurveTo(-r * 0.52, -r * 0.65, -r * 0.14, -r * 0.08);
        ctx.quadraticCurveTo(-r * 0.52, r * 0.42, -r * 0.9, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(r * 0.9, 0);
        ctx.quadraticCurveTo(r * 0.52, -r * 0.65, r * 0.14, -r * 0.08);
        ctx.quadraticCurveTo(r * 0.52, r * 0.42, r * 0.9, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      function drawBossMothershipSaucer(r) {
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.95, r * 0.46, 0, 0, TAU);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(8,10,16,0.52)';
        ctx.beginPath();
        ctx.ellipse(0, -r * 0.06, r * 0.34, r * 0.22, 0, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.beginPath();
        ctx.arc(0, r * 0.08, r * 0.62, Math.PI * 0.15, Math.PI * 0.85);
        ctx.stroke();
      }

      function drawBossMaelstrom(r, spin) {
        for (let i = 0; i < 3; i++) {
          ctx.save();
          ctx.rotate(spin + i * (TAU / 3));
          ctx.strokeStyle = `rgba(255,255,255,${0.25 + i * 0.08})`;
          ctx.lineWidth = 3 - i * 0.5;
          ctx.beginPath();
          ctx.arc(0, 0, r * (0.25 + i * 0.23), -0.35, Math.PI * 1.35);
          ctx.stroke();
          ctx.restore();
        }
        ctx.fillStyle = 'rgba(8,10,16,0.55)';
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.26, 0, TAU);
        ctx.fill();
      }

      function drawBossObelisk(r) {
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.42, -r * 0.2);
        ctx.lineTo(r * 0.42, r);
        ctx.lineTo(-r * 0.42, r);
        ctx.lineTo(-r * 0.42, -r * 0.2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(8,10,16,0.58)';
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.62);
        ctx.lineTo(r * 0.18, -r * 0.15);
        ctx.lineTo(r * 0.18, r * 0.56);
        ctx.lineTo(-r * 0.18, r * 0.56);
        ctx.lineTo(-r * 0.18, -r * 0.15);
        ctx.closePath();
        ctx.fill();
      }

      function drawBossVisual(e) {
        const t = game.time;
        const r = e.r;
        switch (e.bossKind) {
          case 'bossWarden':
            ctx.rotate(t * 0.16);
            bossPolygonPath(6, r, Math.PI / 6);
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = `rgba(${e.color},0.72)`;
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.08, 0, TAU);
            ctx.stroke();
            drawBossEye(r);
            break;
          case 'bossPrism':
            ctx.rotate(t * 0.4);
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(r * 0.78, r * 0.42);
            ctx.lineTo(-r * 0.78, r * 0.42);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.34)';
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(0, r * 0.42);
            ctx.moveTo(0, -r);
            ctx.lineTo(-r * 0.42, -r * 0.02);
            ctx.moveTo(0, -r);
            ctx.lineTo(r * 0.42, -r * 0.02);
            ctx.stroke();
            break;
          case 'bossForge':
            ctx.rotate(t * 0.08);
            roundRect(-r * 0.74, -r * 0.45, r * 1.48, r * 0.95, 12, true, true);
            ctx.beginPath();
            ctx.moveTo(-r * 0.28, r * 0.5);
            ctx.lineTo(r * 0.36, r * 0.5);
            ctx.lineTo(r * 0.58, r * 0.9);
            ctx.lineTo(-r * 0.48, r * 0.9);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,140,70,0.34)';
            roundRect(-r * 0.2, -r * 0.12, r * 0.4, r * 0.28, 6, true, false);
            break;
          case 'bossLeviathan':
            ctx.rotate(Math.atan2(e.vy || 0.01, e.vx || 1) + Math.PI / 2 + Math.sin(t * 2) * 0.08);
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.quadraticCurveTo(r * 0.72, -r * 0.2, r * 0.36, r * 0.95);
            ctx.quadraticCurveTo(0, r * 0.46, -r * 0.36, r * 0.95);
            ctx.quadraticCurveTo(-r * 0.72, -r * 0.2, 0, -r);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-r * 0.12, r * 0.25);
            ctx.lineTo(-r * 0.52, r * 0.85);
            ctx.moveTo(r * 0.12, r * 0.25);
            ctx.lineTo(r * 0.52, r * 0.85);
            ctx.stroke();
            break;
          case 'bossSingularity':
            ctx.rotate(t * 0.28);
            ctx.strokeStyle = `rgba(${e.color},0.82)`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.98, 0, TAU);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.62, 0, TAU);
            ctx.stroke();
            ctx.fillStyle = 'rgba(6,6,12,0.92)';
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.38, 0, TAU);
            ctx.fill();
            break;
          case 'bossTempest':
            ctx.rotate(t * 0.95);
            for (let i = 0; i < 4; i++) {
              ctx.beginPath();
              ctx.moveTo(0, -r * 0.15);
              ctx.quadraticCurveTo(r * 0.18, -r * 0.68, r * 0.8, -r * 0.22);
              ctx.quadraticCurveTo(r * 0.18, -r * 0.12, 0, -r * 0.15);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.rotate(Math.PI / 2);
            }
            ctx.fillStyle = 'rgba(8,10,16,0.5)';
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.22, 0, TAU);
            ctx.fill();
            break;
          case 'bossColossus':
            bossPolygonPath(6, r, Math.PI / 6);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(8,10,16,0.48)';
            roundRect(-r * 0.32, -r * 0.36, r * 0.64, r * 0.72, 8, true, false);
            ctx.fillStyle = `rgba(${e.color},0.6)`;
            roundRect(-r * 0.8, -r * 0.12, r * 0.22, r * 0.22, 4, true, false);
            roundRect(r * 0.58, -r * 0.12, r * 0.22, r * 0.22, 4, true, false);
            break;
          case 'bossQueen':
            bossStarPath(7, r, r * 0.52, -Math.PI / 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(8,18,12,0.52)';
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.34, 0, TAU);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.26)';
            for (let side of [-1, 1]) {
              for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(side * r * 0.16, i * r * 0.22);
                ctx.lineTo(side * r * 0.82, i * r * 0.32 + r * 0.1 * side);
                ctx.stroke();
              }
            }
            break;
          case 'bossChrono':
            ctx.rotate(t * 0.18);
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.92, 0, TAU);
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.34)';
            for (let i = 0; i < 12; i++) {
              const a = (i / 12) * TAU;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
              ctx.lineTo(Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86);
              ctx.stroke();
            }
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -r * 0.45);
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(t * 2.2) * r * 0.34, Math.sin(t * 2.2) * r * 0.34);
            ctx.stroke();
            break;
          case 'bossEclipse':
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.92, 0, TAU);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(6,6,12,0.82)';
            ctx.beginPath();
            ctx.arc(r * 0.24, -r * 0.05, r * 0.72, 0, TAU);
            ctx.fill();
            ctx.strokeStyle = `rgba(${e.color},0.62)`;
            ctx.beginPath();
            ctx.arc(-r * 0.1, 0, r * 1.06, 0.4, Math.PI * 1.65);
            ctx.stroke();
            break;
          case 'bossDealer':
            ctx.rotate(Math.PI / 4 + Math.sin(t * 2) * 0.05);
            roundRect(-r * 0.62, -r * 0.62, r * 1.24, r * 1.24, 8, true, true);
            ctx.fillStyle = 'rgba(8,10,16,0.55)';
            ctx.beginPath();
            ctx.moveTo(0, -r * 0.24);
            ctx.lineTo(r * 0.18, 0);
            ctx.lineTo(0, r * 0.24);
            ctx.lineTo(-r * 0.18, 0);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.32)';
            ctx.stroke();
            break;
          case 'bossNova':
            ctx.rotate(t * 0.32);
            bossStarPath(8, r, r * 0.44, -Math.PI / 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,230,120,0.25)';
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.28, 0, TAU);
            ctx.fill();
            break;
          case 'bossMirror':
            ctx.rotate(Math.PI / 4 + Math.sin(t * 1.7) * 0.04);
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(r * 0.68, 0);
            ctx.lineTo(0, r);
            ctx.lineTo(-r * 0.68, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.42)';
            ctx.beginPath();
            ctx.moveTo(0, -r * 0.78);
            ctx.lineTo(0, r * 0.78);
            ctx.moveTo(-r * 0.42, -r * 0.22);
            ctx.lineTo(r * 0.42, 0.22 * r);
            ctx.stroke();
            break;
          case 'bossObelisk':
            drawBossObelisk(r);
            break;
          case 'bossReaver':
            ctx.rotate(t * 0.24);
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.92, -Math.PI * 0.2, Math.PI * 1.2);
            ctx.arc(r * 0.18, 0, r * 0.62, Math.PI * 1.08, -Math.PI * 0.08, true);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.32)';
            ctx.beginPath();
            ctx.moveTo(-r * 0.1, -r * 0.66);
            ctx.lineTo(r * 0.48, r * 0.48);
            ctx.stroke();
            break;
          case 'bossMaelstrom':
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.86, 0, TAU);
            ctx.fill();
            ctx.stroke();
            drawBossMaelstrom(r, t * 0.9);
            break;
          case 'bossMothership':
            drawBossMothershipSaucer(r);
            break;
          case 'bossApex':
            ctx.rotate(Math.sin(t * 2) * 0.08);
            ctx.beginPath();
            ctx.moveTo(0, -r * 0.88);
            ctx.bezierCurveTo(r * 0.72, -r * 0.74, r * 0.86, 0, 0, r * 0.88);
            ctx.bezierCurveTo(-r * 0.86, 0, -r * 0.72, -r * 0.74, 0, -r * 0.88);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(8,10,16,0.5)';
            ctx.beginPath();
            ctx.moveTo(0, -r * 0.4);
            ctx.lineTo(r * 0.22, 0);
            ctx.lineTo(0, r * 0.38);
            ctx.lineTo(-r * 0.22, 0);
            ctx.closePath();
            ctx.fill();
            break;
          case 'bossEntropy':
            ctx.rotate(t * 0.18);
            drawBossCrown(r * 0.9);
            ctx.strokeStyle = 'rgba(255,255,255,0.26)';
            ctx.beginPath();
            ctx.moveTo(-r * 0.56, -r * 0.2);
            ctx.lineTo(r * 0.58, r * 0.44);
            ctx.moveTo(-r * 0.1, -r * 0.54);
            ctx.lineTo(r * 0.16, r * 0.62);
            ctx.stroke();
            break;
          default:
            bossStarPath(8, r, r * 0.72, 0);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(9,12,18,0.55)';
            ctx.beginPath();
            ctx.arc(0, 0, r * 0.42, 0, TAU);
            ctx.fill();
            break;
        }
      }

      function drawEnemies() {
        for (const e of enemies) {
          const hpPct = clamp(e.hp / e.maxHp, 0, 1);
          const glowAlpha = e.elite ? 0.9 : 0.55;

          if ((e.type === 'sniper' || e.type === 'beamcaster') && e.aiming > 0) {
            const alpha = clamp(e.aiming / (e.type === 'beamcaster' ? 0.66 : 0.72), 0, 1);
            const beamAngle = e.type === 'beamcaster' ? e.beamAngle : e.sniperAngle;
            ctx.save();
            ctx.strokeStyle = `rgba(${e.color},${0.22 + alpha * 0.55})`;
            ctx.lineWidth = e.type === 'beamcaster' ? (e.elite ? 4 : 3) : (e.elite ? 3 : 2);
            ctx.shadowBlur = 10;
            ctx.shadowColor = `rgba(${e.color},0.7)`;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x + Math.cos(beamAngle) * 980, e.y + Math.sin(beamAngle) * 980);
            ctx.stroke();
            ctx.restore();
          }

          ctx.save();
          ctx.translate(e.x, e.y);
          ctx.rotate(Math.atan2(e.vy, e.vx) + Math.PI / 2);
          ctx.shadowBlur = e.type === 'boss' ? 18 : 10;
          ctx.shadowColor = `rgba(${e.color},${glowAlpha})`;
          ctx.fillStyle = `rgba(${e.color},${e.hitFlash > 0 ? 1 : 0.85})`;
          ctx.strokeStyle = 'rgba(255,255,255,0.18)';
          ctx.lineWidth = 1.5;

          if (e.type === 'boss') {
            drawBossVisual(e);
          } else if (e.type === 'brute') {
            roundedDiamond(0, 0, e.r, e.r * 1.1);
          } else if (e.type === 'charger') {
            ctx.beginPath();
            ctx.moveTo(0, -e.r * 1.1);
            ctx.lineTo(e.r * 0.9, e.r * 0.85);
            ctx.lineTo(-e.r * 0.9, e.r * 0.85);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            if (e.chargePrep > 0) {
              ctx.strokeStyle = 'rgba(255,109,122,0.75)';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(Math.cos(e.chargeDir) * 80, Math.sin(e.chargeDir) * 80);
              ctx.stroke();
            }
          } else if (e.type === 'splitter') {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const a = (i / 6) * TAU;
              const rr = i % 2 === 0 ? e.r : e.r * 0.56;
              const px = Math.cos(a) * rr;
              const py = Math.sin(a) * rr;
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (e.type === 'orbiter') {
            ctx.rotate(game.time * 1.5 * e.orbitDir);
            roundedDiamond(0, 0, e.r * 0.85, e.r * 0.85);
            ctx.strokeStyle = `rgba(${e.color},0.5)`;
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 1.25, 0, TAU);
            ctx.stroke();
          } else if (e.type === 'sniper') {
            ctx.beginPath();
            ctx.moveTo(0, -e.r * 1.15);
            ctx.lineTo(e.r * 0.52, 0);
            ctx.lineTo(0, e.r * 1.15);
            ctx.lineTo(-e.r * 0.52, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(8,10,16,0.5)';
            ctx.fillRect(-e.r * 0.22, -e.r * 0.8, e.r * 0.44, e.r * 1.6);
          } else if (e.type === 'mine') {
            ctx.rotate(game.time * 2 + e.pulse);
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
              const a = (i / 8) * TAU;
              const rr = i % 2 === 0 ? e.r * 1.1 : e.r * 0.58;
              const px = Math.cos(a) * rr;
              const py = Math.sin(a) * rr;
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (e.type === 'guardian') {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const a = (i / 6) * TAU + Math.PI / 6;
              const px = Math.cos(a) * e.r;
              const py = Math.sin(a) * e.r;
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = `rgba(${e.color},0.45)`;
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 1.35, 0, TAU);
            ctx.stroke();
          } else if (e.type === 'bulwark') {
            roundRect(-e.r * 0.9, -e.r * 0.78, e.r * 1.8, e.r * 1.56, 9, true, true);
            ctx.strokeStyle = `rgba(103,168,255,${e.shield > 0 ? 0.75 : 0.22})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 1.08, 0, TAU);
            ctx.stroke();
          } else if (e.type === 'beamcaster') {
            ctx.beginPath();
            ctx.moveTo(0, -e.r * 1.2);
            ctx.lineTo(e.r * 0.72, e.r * 0.7);
            ctx.lineTo(0, e.r * 0.35);
            ctx.lineTo(-e.r * 0.72, e.r * 0.7);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(8,10,16,0.55)';
            ctx.fillRect(-e.r * 0.16, -e.r * 1.0, e.r * 0.32, e.r * 1.45);
          } else if (e.type === 'phantom') {
            ctx.globalAlpha *= 0.72 + Math.sin(game.time * 8 + e.phaseOffset) * 0.18;
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
              const a = (i / 5) * TAU - Math.PI / 2;
              const px = Math.cos(a) * e.r;
              const py = Math.sin(a) * e.r;
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (e.type === 'vortexer') {
            ctx.rotate(game.time * 1.4 + e.pulse);
            ctx.beginPath();
            ctx.arc(0, 0, e.r, 0, TAU);
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = `rgba(${e.color},0.65)`;
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 1.42, Math.sin(game.time) * 0.8, Math.PI * 1.55);
            ctx.stroke();
          } else if (e.type === 'replicator') {
            ctx.beginPath();
            for (let i = 0; i < 7; i++) {
              const a = (i / 7) * TAU;
              const rr = i % 2 === 0 ? e.r : e.r * 0.62;
              const px = Math.cos(a) * rr;
              const py = Math.sin(a) * rr;
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(8,10,16,0.48)';
            ctx.beginPath();
            ctx.arc(-e.r * 0.28, 0, e.r * 0.22, 0, TAU);
            ctx.arc(e.r * 0.28, 0, e.r * 0.22, 0, TAU);
            ctx.fill();
          } else if (e.type === 'leech') {
            ctx.globalAlpha *= 0.86 + Math.sin(game.time * 8 + e.pulse) * 0.12;
            ctx.beginPath();
            ctx.arc(0, 0, e.r, 0, TAU);
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = `rgba(${e.color},0.55)`;
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 1.42, 0, TAU);
            ctx.stroke();
            ctx.fillStyle = 'rgba(8,10,16,0.55)';
            ctx.beginPath();
            ctx.arc(0, 0, e.r * 0.38, 0, TAU);
            ctx.fill();
          } else if (e.type === 'artillery') {
            ctx.rotate(Math.sin(game.time * 1.7) * 0.12);
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
              const a = (i / 8) * TAU + Math.PI / 8;
              const rr = i % 2 === 0 ? e.r : e.r * 0.55;
              const px = Math.cos(a) * rr;
              const py = Math.sin(a) * rr;
              if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = 'rgba(8,10,16,0.5)';
            ctx.fillRect(-e.r * 0.16, -e.r * 1.05, e.r * 0.32, e.r * 1.6);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, e.r, 0, TAU);
            ctx.fill();
            ctx.stroke();
          }
          ctx.restore();

          if (e.hp < e.maxHp && e.type !== 'mite') {
            const w = e.type === 'boss' ? 110 : Math.max(28, e.r * 2.1);
            const h = e.type === 'boss' ? 8 : 5;
            const y = e.y + e.r + 16;
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            roundRect(e.x - w / 2, y, w, h, h / 2, true, false);
            ctx.fillStyle = e.type === 'boss' ? `rgba(${e.color},0.95)` : e.elite ? 'rgba(255,90,220,0.95)' : 'rgba(116,243,255,0.95)';
            roundRect(e.x - w / 2, y, w * hpPct, h, h / 2, true, false);
          }
          if (e.maxShield && e.shield > 0 && e.type !== 'mite') {
            const w = e.type === 'boss' ? 110 : Math.max(28, e.r * 2.1);
            const h = e.type === 'boss' ? 5 : 4;
            const y = e.y + e.r + (e.hp < e.maxHp ? 8 : 16);
            ctx.fillStyle = 'rgba(0,0,0,0.34)';
            roundRect(e.x - w / 2, y, w, h, h / 2, true, false);
            ctx.fillStyle = 'rgba(103,168,255,0.86)';
            roundRect(e.x - w / 2, y, w * clamp(e.shield / e.maxShield, 0, 1), h, h / 2, true, false);
          }
        }
      }

      function drawPlayer() {
        if (!player) return;
        const pulse = Math.sin(game.time * 12) * 0.08 + 0.92;
        const invuln = player.dashInvuln > 0;
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.aimAngle + Math.PI / 2);
        ctx.shadowBlur = player.overdriveTimer > 0 ? 20 : 12;
        ctx.shadowColor = player.overdriveTimer > 0 ? 'rgba(255,215,107,0.8)' : invuln ? 'rgba(116,243,255,0.95)' : 'rgba(116,243,255,0.75)';
        ctx.fillStyle = player.hurtFlash > 0 ? 'rgba(255,255,255,0.95)' : player.overdriveTimer > 0 ? `rgba(255,215,107,${pulse})` : `rgba(116,243,255,${pulse})`;
        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(0, -player.r * 1.4);
        ctx.lineTo(player.r * 0.9, player.r * 0.9);
        ctx.lineTo(0, player.r * 0.45);
        ctx.lineTo(-player.r * 0.9, player.r * 0.9);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = 'rgba(8,14,20,0.6)';
        ctx.beginPath();
        ctx.arc(0, 2, player.r * 0.34, 0, TAU);
        ctx.fill();
        ctx.restore();

        if (player.fieldDamage > 0) {
          ctx.save();
          const radius = 80 + player.fieldDamage * 22;
          ctx.strokeStyle = `rgba(195,140,255,${0.12 + Math.sin(game.time * 5) * 0.03})`;
          ctx.lineWidth = 2;
          ctx.shadowBlur = 12;
          ctx.shadowColor = 'rgba(195,140,255,0.45)';
          ctx.beginPath();
          ctx.arc(player.x, player.y, radius, 0, TAU);
          ctx.stroke();
          ctx.restore();
        }

        if (player.maxShield > 0 && player.shield > 0) {
          const shieldAlpha = 0.18 + (player.shield / player.maxShield) * 0.22;
          ctx.save();
          ctx.strokeStyle = `rgba(103,168,255,${shieldAlpha})`;
          ctx.lineWidth = 4;
          ctx.shadowBlur = 14;
          ctx.shadowColor = 'rgba(103,168,255,0.5)';
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.r + 8, game.time * 1.8, game.time * 1.8 + TAU * (player.shield / player.maxShield));
          ctx.stroke();
          ctx.restore();
        }

        for (const drone of game.drones) {
          ctx.save();
          ctx.translate(drone.x, drone.y);
          ctx.rotate(game.time * 4);
          ctx.shadowBlur = 12;
          ctx.shadowColor = 'rgba(195,140,255,0.8)';
          ctx.fillStyle = 'rgba(195,140,255,0.92)';
          ctx.beginPath();
          for (let i = 0; i < 4; i++) {
            const a = (i / 4) * TAU;
            const rr = i % 2 === 0 ? 10 : 5;
            const px = Math.cos(a) * rr;
            const py = Math.sin(a) * rr;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      function drawParticles() {
        for (const p of particles) {
          const alpha = clamp(p.life / p.maxLife, 0, 1) * p.fade;
          ctx.save();
          if (p.glow) {
            ctx.shadowBlur = p.glow;
            ctx.shadowColor = `rgba(${p.color},${alpha})`;
          }
          ctx.fillStyle = `rgba(${p.color},${alpha})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, TAU);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawFloaters() {
        if (!settings.damageNumbers) return;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const f of floaters) {
          const alpha = clamp(f.life / f.maxLife, 0, 1);
          ctx.font = `900 ${f.size || 13}px Inter, system-ui, sans-serif`;
          ctx.lineWidth = 3;
          ctx.strokeStyle = `rgba(0,0,0,${alpha * 0.45})`;
          ctx.fillStyle = `rgba(${f.color},${alpha})`;
          ctx.strokeText(f.text, f.x, f.y);
          ctx.fillText(f.text, f.x, f.y);
        }
        ctx.restore();
      }

      function drawTelegraphs() {
        if (!settings.showWarnings || !game || game.mode !== 'playing') return;
        ctx.save();
        ctx.lineCap = 'round';
        for (const e of enemies) {
          if (!e || e.dead) continue;
          if (e.type === 'sniper' && e.aiming > 0) {
            const pct = clamp(1 - e.aiming / (e.elite ? 0.55 : 0.72), 0, 1);
            ctx.strokeStyle = `rgba(255,177,85,${0.28 + pct * 0.42})`;
            ctx.lineWidth = 2 + pct * 3;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x + Math.cos(e.sniperAngle) * 1800, e.y + Math.sin(e.sniperAngle) * 1800);
            ctx.stroke();
          }
          if (e.type === 'beamcaster' && e.aiming > 0) {
            const pct = clamp(1 - e.aiming / (e.elite ? 0.52 : 0.66), 0, 1);
            ctx.strokeStyle = `rgba(255,215,107,${0.22 + pct * 0.38})`;
            ctx.lineWidth = 4 + pct * 4;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x + Math.cos(e.beamAngle) * 1800, e.y + Math.sin(e.beamAngle) * 1800);
            ctx.stroke();
          }
          if (e.type === 'charger' && e.chargePrep > 0) {
            const pct = clamp(1 - e.chargePrep / 0.55, 0, 1);
            ctx.strokeStyle = `rgba(255,109,122,${0.25 + pct * 0.45})`;
            ctx.lineWidth = 3 + pct * 3;
            ctx.beginPath();
            ctx.moveTo(e.x, e.y);
            ctx.lineTo(e.x + Math.cos(e.chargeDir) * 260, e.y + Math.sin(e.chargeDir) * 260);
            ctx.stroke();
          }
          if (e.type === 'mine' && e.armed > 0) {
            const pct = clamp(1 - e.armed / 0.62, 0, 1);
            ctx.strokeStyle = `rgba(255,90,120,${0.28 + pct * 0.42})`;
            ctx.lineWidth = 2 + pct * 2;
            ctx.beginPath();
            ctx.arc(e.x, e.y, 96, 0, TAU);
            ctx.stroke();
          }
          if (e.type === 'artillery' && e.aiming > 0) {
            const pct = clamp(1 - e.aiming / (e.elite ? 0.5 : 0.68), 0, 1);
            ctx.strokeStyle = `rgba(255,215,107,${0.26 + pct * 0.38})`;
            ctx.lineWidth = 2 + pct * 2;
            ctx.beginPath();
            ctx.arc(e.aimX, e.aimY, 58 + pct * 18, 0, TAU);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.aimX - 10, e.aimY);
            ctx.lineTo(e.aimX + 10, e.aimY);
            ctx.moveTo(e.aimX, e.aimY - 10);
            ctx.lineTo(e.aimX, e.aimY + 10);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawHUD() {
        if (!game || !player || game.mode === 'menu') return;
        const ui = clamp(settings.uiScale || 1, 0.75, 1.3);
        const hudW = view.w / ui;
        const hudH = view.h / ui;
        const pad = 22;
        const panelW = Math.min(340, hudW - pad * 2);
        const topY = 16;

        ctx.save();
        ctx.scale(ui, ui);
        ctx.fillStyle = 'rgba(6,10,16,0.56)';
        roundRect(pad, topY, panelW, 88, 18, true, false);
        roundRect(hudW - pad - 210, topY, 210, 88, 18, true, false);

        ctx.fillStyle = 'rgba(238,246,255,0.9)';
        ctx.font = '700 13px Inter, system-ui, sans-serif';
        ctx.fillText('HULL', pad + 16, topY + 18);
        ctx.fillText('SHIELD', pad + 16, topY + 46);
        ctx.fillText('OVERDRIVE', pad + 16, topY + 74);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        roundRect(pad + 72, topY + 8, panelW - 88, 12, 999, true, false);
        roundRect(pad + 72, topY + 36, panelW - 88, 12, 999, true, false);
        roundRect(pad + 72, topY + 64, panelW - 88, 12, 999, true, false);

        ctx.fillStyle = 'rgba(255,109,122,0.95)';
        roundRect(pad + 72, topY + 8, (panelW - 88) * (player.hp / player.maxHp), 12, 999, true, false);
        ctx.fillStyle = 'rgba(103,168,255,0.95)';
        roundRect(pad + 72, topY + 36, (panelW - 88) * (player.shield / player.maxShield), 12, 999, true, false);
        ctx.fillStyle = player.overdriveTimer > 0 ? 'rgba(255,215,107,0.98)' : 'rgba(116,243,255,0.95)';
        roundRect(pad + 72, topY + 64, (panelW - 88) * (game.overdriveMeter / 100), 12, 999, true, false);

        ctx.fillStyle = 'rgba(238,246,255,0.92)';
        ctx.font = '800 14px Inter, system-ui, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`WAVE ${game.wave}`, hudW - pad - 16, topY + 24);
        ctx.font = '700 18px Inter, system-ui, sans-serif';
        ctx.fillText(Math.floor(game.score).toLocaleString(), hudW - pad - 16, topY + 50);
        ctx.font = '600 12px Inter, system-ui, sans-serif';
        ctx.fillStyle = 'rgba(156,179,209,0.95)';
        ctx.fillText(`KILLS ${game.kills}   //   BEST ${Math.floor(game.highScore).toLocaleString()}`, hudW - pad - 16, topY + 72);

        ctx.textAlign = 'left';
        ctx.font = '600 12px Inter, system-ui, sans-serif';
        ctx.fillStyle = 'rgba(156,179,209,0.92)';
        const dashState = player.dashCd <= 0 ? 'READY' : `${player.dashCd.toFixed(1)}s`;
        ctx.fillText(`Dash ${dashState}`, pad + 8, hudH - 22);
        ctx.fillText('Move: WASD / Arrow Keys  •  Dash: Space  •  Overdrive: E  •  Audio: M  •  Pause/Settings: P', pad + 98, hudH - 22);
        if (hudW > 760) {
          ctx.fillText(`DMG ${player.damage.toFixed(0)}  CRIT ${Math.round((player.critChance + luckValue() * 0.012) * 100)}%  LUCK ${luckValue()}  ARM ${Math.round(player.armor * 100)}%  ALLIES ${allies.length}  REROLLS ${game.rerolls}  BEST COMBO ${game.bestCombo || 0}`, pad + 8, hudH - 48);
        }

        if (game.combo >= 2) {
          ctx.fillStyle = 'rgba(255,215,107,0.94)';
          ctx.font = '900 20px Inter, system-ui, sans-serif';
          ctx.fillText(`COMBO x${Math.floor(game.combo)}`, pad + 8, hudH - 52);
        }

        if (game.bossWave) {
          const boss = enemies.find((e) => e.type === 'boss');
          if (boss || game.bossHp > 0) {
            const bossPct = clamp((boss ? boss.hp : game.bossHp) / Math.max(1, game.bossMaxHp), 0, 1);
            const w = Math.min(hudW * 0.52, 540);
            const h = 14;
            const x = hudW / 2 - w / 2;
            const y = 24;
            ctx.fillStyle = 'rgba(10,12,18,0.72)';
            roundRect(x, y, w, h, 999, true, false);
            ctx.fillStyle = boss ? `rgba(${boss.color},0.96)` : 'rgba(255,215,107,0.96)';
            roundRect(x, y, w * bossPct, h, 999, true, false);
            if (boss) {
              const spct = boss.staggered > 0 ? 1 : clamp((boss.stagger || 0) / Math.max(1, boss.staggerMax || 1), 0, 1);
              ctx.fillStyle = 'rgba(10,12,18,0.64)';
              roundRect(x, y + h + 5, w, 5, 999, true, false);
              ctx.fillStyle = boss.staggered > 0 ? 'rgba(255,255,255,0.95)' : 'rgba(255,215,107,0.86)';
              roundRect(x, y + h + 5, w * spct, 5, 999, true, false);
              if (boss.staggered > 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.font = '900 10px Inter, system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('STAGGERED', hudW / 2, y + h + 20);
              }
            }
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(255,240,200,0.96)';
            ctx.font = '800 11px Inter, system-ui, sans-serif';
            ctx.fillText((game.bossName || 'ANOMALY WARDEN').toUpperCase(), hudW / 2, y - 6);
            ctx.textAlign = 'left';
          }
        }

        if (game.messageTimer > 0) {
          ctx.textAlign = 'center';
          ctx.font = '900 28px Inter, system-ui, sans-serif';
          ctx.shadowBlur = 18;
          ctx.shadowColor = 'rgba(116,243,255,0.28)';
          ctx.fillStyle = 'rgba(238,246,255,0.96)';
          ctx.fillText(game.message, hudW / 2, hudH * 0.16);
          ctx.shadowBlur = 0;
          ctx.textAlign = 'left';
        }
        ctx.restore();
      }

      function drawMenuBackgroundHint() {
        if (!game || game.mode === 'playing' || game.mode === 'levelup') return;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.font = '600 14px Inter, system-ui, sans-serif';
        ctx.fillStyle = 'rgba(156,179,209,0.55)';
        ctx.fillText('A self-contained browser game — no installs, no assets, just pure arcade chaos.', view.w / 2, view.h - 28);
        ctx.restore();
      }

      function render() {
        if (!game) return;
        drawBackground();
        const shakeX = game.shake ? rand(-game.shake, game.shake) : 0;
        const shakeY = game.shake ? rand(-game.shake, game.shake) : 0;
        ctx.save();
        ctx.translate(shakeX, shakeY);
        drawTrails();
        drawTelegraphs();
        drawHazards();
        drawPickups();
        drawShockwaves();
        drawAlliedMines();
        drawTurrets();
        drawAllies();
        drawBullets();
        drawEnemies();
        drawLightning();
        drawPlayer();
        drawParticles();
        drawFloaters();
        ctx.restore();
        drawHUD();
        drawMenuBackgroundHint();

        if (game.flash > 0) {
          ctx.fillStyle = `rgba(255,255,255,${game.flash * 0.25})`;
          ctx.fillRect(0, 0, view.w, view.h);
        }
      }

      function roundedDiamond(x, y, rx, ry) {
        ctx.beginPath();
        ctx.moveTo(x, y - ry);
        ctx.quadraticCurveTo(x + rx * 0.25, y - ry * 0.25, x + rx, y);
        ctx.quadraticCurveTo(x + rx * 0.25, y + ry * 0.25, x, y + ry);
        ctx.quadraticCurveTo(x - rx * 0.25, y + ry * 0.25, x - rx, y);
        ctx.quadraticCurveTo(x - rx * 0.25, y - ry * 0.25, x, y - ry);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      function roundRect(x, y, w, h, r, fill, stroke) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
      }

      function loop(t) {
        const dt = Math.min(0.033, ((t - lastTime) || 16.666) / 1000);
        lastTime = t;
        update(dt);
        render();
        clearPressed();
        requestAnimationFrame(loop);
      }


      audioToggle.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        audio.toggleMute();
      });

      overlay.addEventListener('input', (e) => {
        const control = e.target.closest('[data-setting]');
        if (!control) return;
        updateSetting(control.dataset.setting, control.type === 'checkbox' ? control.checked : control.value);
      });
      overlay.addEventListener('change', (e) => {
        const control = e.target.closest('[data-setting]');
        if (!control) return;
        updateSetting(control.dataset.setting, control.type === 'checkbox' ? control.checked : control.value);
      });

      overlay.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        audio.unlock();
        audio.button();
        const action = btn.dataset.action;
        if (action === 'start' || action === 'restart') startGame();
        else if (action === 'menu') backToMenu();
        else if (action === 'how') showHowTo();
        else if (action === 'resume') { game.mode = 'playing'; refreshMusicForGameState(); hideOverlay(); }
        else if (action === 'reroll') rerollOffers();
        else if (action === 'upgrade') applyUpgrade(btn.dataset.upgrade);
      });

      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (KEY_BLOCK.has(key)) e.preventDefault();
        if (!input.keys[key]) input.pressed.add(key);
        input.keys[key] = true;

        if (key === 'm') {
          audio.toggleMute();
        }

        if (key === 'p' && game && game.mode === 'playing') {
          game.mode = 'paused';
          showPause();
        } else if (key === 'p' && game && game.mode === 'paused') {
          game.mode = 'playing';
          refreshMusicForGameState();
          hideOverlay();
        }

        if (game && game.mode === 'menu' && (key === 'enter' || key === ' ')) {
          startGame();
        }
        if (game && game.mode === 'gameover' && key === 'enter') {
          startGame();
        }
        if (game && game.mode === 'levelup' && key === 'r') {
          rerollOffers();
        }
        if (game && game.mode === 'levelup' && /^[1-6]$/.test(key)) {
          const pick = game.offers[Number(key) - 1];
          if (pick) applyUpgrade(pick.id);
        }
      });

      window.addEventListener('keyup', (e) => {
        input.keys[e.key.toLowerCase()] = false;
      });

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        input.mouse.x = e.clientX - rect.left;
        input.mouse.y = e.clientY - rect.top;
        input.mouse.inside = true;
        input.mouse.movedAt = now();
      });
      canvas.addEventListener('mouseenter', () => { input.mouse.inside = true; input.mouse.movedAt = now(); });
      canvas.addEventListener('mouseleave', () => { input.mouse.inside = false; });
      canvas.addEventListener('mousedown', () => { audio.unlock(); refreshMusicForGameState(); });
      window.addEventListener('blur', () => {
        input.keys = Object.create(null);
        clearPressed();
        if (game && game.mode === 'playing') {
          game.mode = 'paused';
          showPause();
        }
      });

      window.addEventListener('error', (event) => {

      window.NeonRiftDebug = {

        bossInfo() {

        },
        counts() {

      // --- Director's Cut systems: persistent armory, contracts, achievements, and rift events ---
      const DIRECTOR_META_KEY = 'neon-rift-director-meta-v1';
      const armoryPerks = [
        { id: 'plating', name: 'Starter Plating', desc: '+10 starting hull per level.', max: 5, base: 18, scale: 12 },
        { id: 'capacitor', name: 'Shield Capacitor', desc: '+8 starting shield per level.', max: 5, base: 18, scale: 12 },
        { id: 'reroll', name: 'Reroll License', desc: '+1 starting upgrade reroll per level.', max: 3, base: 28, scale: 24 },
        { id: 'battery', name: 'Overdrive Battery', desc: '+15 starting overdrive per level.', max: 4, base: 22, scale: 16 },
        { id: 'magnet', name: 'Magnet Tuning', desc: '+28 pickup range per level.', max: 4, base: 16, scale: 14 },
        { id: 'calibrator', name: 'Weapon Calibrator', desc: '+4% starting damage and +3% fire rate per level.', max: 5, base: 24, scale: 18 },
        { id: 'bossScanner', name: 'Boss Scanner', desc: '+4% boss damage per level.', max: 4, base: 26, scale: 22 },
      ];

      const achievementDefs = [
        { id: 'first-blood', title: 'First Blood', desc: 'Destroy your first enemy.', reward: 4 },
        { id: 'warden-down', title: 'Warden Down', desc: 'Defeat a boss.', reward: 10 },
        { id: 'hydra-check', title: 'Hydra Checked', desc: 'Reach wave 11.', reward: 14 },
        { id: 'combo-30', title: 'Combo Engine', desc: 'Reach a 30x combo.', reward: 12 },
        { id: 'transcendent', title: 'Touched by Luck', desc: 'Choose a Transcendent upgrade.', reward: 12 },
        { id: 'ally-squad', title: 'Rift Commander', desc: 'Have 4 converted allies at once.', reward: 12 },
        { id: 'stagger-boss', title: 'Armor Cracker', desc: 'Stagger a boss.', reward: 10 },
        { id: 'overdrive-chain', title: 'Overdrive Habit', desc: 'Use Overdrive 3 times in one run.', reward: 9 },
        { id: 'contractor', title: 'Contractor', desc: 'Complete 3 contracts across runs.', reward: 10 },
        { id: 'event-winner', title: 'Rift Weatherproof', desc: 'Clear 5 rift events across runs.', reward: 12 },
      ];

      function freshDirectorMeta() {
        return { shards: 0, totalShards: 0, contractsCompleted: 0, eventsCleared: 0, runs: 0, armory: {}, achievements: {} };
      }

      function normalizeDirectorMeta(meta) {
        const base = freshDirectorMeta();
        const merged = { ...base, ...(meta || {}) };
        merged.shards = Math.max(0, Math.floor(Number(merged.shards) || 0));
        merged.totalShards = Math.max(0, Math.floor(Number(merged.totalShards) || merged.shards || 0));
        merged.contractsCompleted = Math.max(0, Math.floor(Number(merged.contractsCompleted) || 0));
        merged.eventsCleared = Math.max(0, Math.floor(Number(merged.eventsCleared) || 0));
        merged.runs = Math.max(0, Math.floor(Number(merged.runs) || 0));
        merged.armory = typeof merged.armory === 'object' && merged.armory ? merged.armory : {};
        merged.achievements = typeof merged.achievements === 'object' && merged.achievements ? merged.achievements : {};
        for (const perk of armoryPerks) {
          merged.armory[perk.id] = clamp(Math.floor(Number(merged.armory[perk.id]) || 0), 0, perk.max);
        }
        return merged;
      }

      function loadDirectorMeta() {
        try {
          return normalizeDirectorMeta(JSON.parse(localStorage.getItem(DIRECTOR_META_KEY) || '{}'));
        } catch (e) {
          return freshDirectorMeta();
        }
      }

      let directorMeta = loadDirectorMeta();

      function saveDirectorMeta() {
        directorMeta = normalizeDirectorMeta(directorMeta);
        try { localStorage.setItem(DIRECTOR_META_KEY, JSON.stringify(directorMeta)); } catch (e) { /* ignore */ }
      }

      function armoryLevel(id) {
        return clamp(Math.floor(Number(directorMeta.armory[id]) || 0), 0, (armoryPerks.find((p) => p.id === id)?.max) || 0);
      }

      function armoryCost(perk) {
        const level = armoryLevel(perk.id);
        if (level >= perk.max) return Infinity;
        return perk.base + level * perk.scale;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[ch]));
      }

      function addShards(amount, reason = 'Rift shards', opts = {}) {
        amount = Math.max(0, Math.floor(amount));
        if (!amount) return 0;
        directorMeta.shards += amount;
        directorMeta.totalShards += amount;
        if (game && opts.run !== false) game.runShards = (game.runShards || 0) + amount;
        saveDirectorMeta();
        if (game && player && game.mode !== 'menu') {
          spawnFloater(player.x, player.y - player.r - 30, `+${amount} shards`, '255,215,107', 14, 0.9);
          if (reason) {
            game.message = `${String(reason).toUpperCase()} +${amount} SHARDS`;
            game.messageTimer = 1.45;
          }
        }
        return amount;
      }

      function awardAchievement(id) {

        directorMeta.achievements[id] = Date.now();
        saveDirectorMeta();
        addShards(def.reward, `Achievement: ${def.title}`);
        if (game && game.mode !== 'menu') {
          audio.upgrade();
          game.message = `ACHIEVEMENT // ${def.title.toUpperCase()}`;
          game.messageTimer = 2.0;
        }
        return true;

      const contractTemplates = [
        { type: 'kills', title: 'Scrap Harvest', desc: 'Destroy enemies.', base: 42, scale: 4, reward: 8, rerolls: 1 },
        { type: 'combo', title: 'Combo Engine', desc: 'Reach a combo streak.', base: 18, scale: 2, reward: 7, overdrive: 24, max: true },
        { type: 'dash', title: 'Blink Pilot', desc: 'Use dash during combat.', base: 8, scale: 1, reward: 6, shield: 18 },
        { type: 'overdrive', title: 'Core Meltdown', desc: 'Trigger Overdrive.', base: 2, scale: 0, reward: 7, overdrive: 18 },
        { type: 'elite', title: 'Elite Cleanup', desc: 'Destroy elite enemies.', base: 5, scale: 1, reward: 8, heal: 18 },
        { type: 'boss', title: 'Anomaly Audit', desc: 'Defeat a boss.', base: 1, scale: 0, reward: 12, rerolls: 1 },
        { type: 'perfectWave', title: 'Clean Sweep', desc: 'Clear a wave without hull damage.', base: 1, scale: 0, reward: 9, shield: 30 },
        { type: 'wave', title: 'Deep Dive', desc: 'Clear waves this run.', base: 6, scale: 1, reward: 9, heal: 12 },

      function chooseContracts() {
        const picks = [];
        const used = new Set();
        const run = directorMeta.runs || 0;
        let guard = 0;
        while (picks.length < 3 && guard++ < 40) {
          const template = contractTemplates[irand(0, contractTemplates.length - 1)];
          if (used.has(template.type)) continue;
          used.add(template.type);
          const target = Math.max(1, Math.floor(template.base + Math.floor(run / 3) * template.scale));
          picks.push({
            id: `${template.type}-${Date.now()}-${picks.length}`,
            type: template.type,
            title: template.title,
            desc: template.desc,
            target,
            progress: 0,
            max: !!template.max,
            completed: false,
            reward: template.reward,
            rerolls: template.rerolls || 0,
            heal: template.heal || 0,
            shield: template.shield || 0,
            overdrive: template.overdrive || 0,
          });
        }
        return picks;
      }

      function contractLabel(contract) {
        const progress = Math.min(contract.target, Math.floor(contract.progress || 0));
        return `${progress}/${contract.target}`;
      }

      function startDirectorRun() {
        if (!game || game.directorStarted) return;

        game.finalShardAward = 0;
        game.overdrivesUsed = 0;
        game.waveDamageTaken = 0;
        game.waveKills = 0;
        game.waveElites = 0;
        game.bossKills = 0;
        game.eventsClearedThisRun = 0;

      function rewardContract(contract) {
        if (!contract || contract.completed) return;
        contract.completed = true;
        const boost = player ? (player.contractBoost || 0) : 0;
        const shardReward = contract.reward + Math.floor(boost * 2.5);
        game.completedContracts = (game.completedContracts || 0) + 1;
        directorMeta.contractsCompleted += 1;
        addShards(shardReward, contract.title);
        if (contract.rerolls) game.rerolls += contract.rerolls + Math.floor(boost / 2);
        if (contract.heal && player) player.hp = Math.min(player.maxHp, player.hp + contract.heal + boost * 4);
        if (contract.shield && player) player.shield = Math.min(player.maxShield, player.shield + contract.shield + boost * 5);
        if (contract.overdrive) game.overdriveMeter = clamp(game.overdriveMeter + contract.overdrive + boost * 4, 0, 100);
        audio.upgrade();
        if (directorMeta.contractsCompleted >= 3) awardAchievement('contractor');
      }

      function progressContract(type, value = 1, mode = 'add') {
        if (!game || !game.contracts) return;
        for (const contract of game.contracts) {
          if (contract.completed || contract.type !== type) continue;
          if (mode === 'max' || contract.max) contract.progress = Math.max(contract.progress || 0, value);
          else contract.progress = (contract.progress || 0) + value;
          if (contract.progress >= contract.target) rewardContract(contract);
        }
      }

      const riftEvents = [
        { id: 'supply', name: 'Supply Comet', desc: 'A comet drops scrap and repairs across the arena.' },

      function setupRiftEventForWave() {
        if (!game || game.bossWave || game.wave < 3) {
          if (game) game.riftEvent = null;
          return;

        const eventLuck = player ? (player.eventLuck || 0) : 0;
        const shouldEvent = game.wave % 4 === 0 || chance(0.16 + eventLuck * 0.08);
        if (!shouldEvent) {
          game.riftEvent = null;
          return;
        }
        const def = riftEvents[irand(0, riftEvents.length - 1)];
        game.riftEvent = { ...def, timer: 0.8, spawns: 0, cleared: false };
        game.message = `RIFT EVENT // ${def.name.toUpperCase()}`;
        game.messageTimer = 2.2;

      function clearRiftEventIfNeeded() {
        if (!game || !game.riftEvent || game.riftEvent.cleared) return;

      function directorUpdate(dt) {
        if (!game || game.mode !== 'playing' || !game.riftEvent) return;
        const event = game.riftEvent;
        event.timer -= dt;
        if (event.timer > 0) return;
        const eventLuck = player ? (player.eventLuck || 0) : 0;
        if (event.id === 'storm') {
          event.timer = Math.max(0.55, 1.28 - eventLuck * 0.12);
          const target = enemies.filter((e) => e && !e.dead)[irand(0, Math.max(0, enemies.filter((e) => e && !e.dead).length - 1))];
          if (target) {
            lightningBolts.push({ x1: target.x + rand(-80, 80), y1: -20, x2: target.x, y2: target.y, life: 0.18, maxLife: 0.18, color: '116,243,255' });

        } else if (event.id === 'meteor') {

          const target = live.length ? live[irand(0, live.length - 1)] : null;

            spawnHazard(target.x + rand(-35, 35), target.y + rand(-35, 35), { r: 22, maxR: 68, grow: 135, damage: 54 + game.wave * 4 + eventLuck * 12, life: 0.55, color: '255,215,107', friendly: true });

        } else if (event.id === 'bounty') {

      const originalCreateGameState = createGameState;

      const originalCreatePlayer = createPlayer;
      createPlayer = function createPlayerDirector() {

        p.magnet += magnet * 28;
        p.damage *= 1 + calibrator * 0.04;

      upgradePool.push(
