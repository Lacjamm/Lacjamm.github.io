<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Rift - Director's Cut</title>
  <style>
    :root {
      --bg: #070b12;
      --panel: rgba(10, 16, 28, 0.86);
      --line: rgba(120, 190, 255, 0.25);
      --cyan: #74f3ff;
      --blue: #67a8ff;
      --violet: #c38cff;
      --pink: #ff6bcf;
      --gold: #ffd76b;
      --text: #eef6ff;
      --muted: #9cb3d1;
      --danger: #ff6d7a;
      --good: #8cffbd;
      --shadow: 0 0 24px rgba(116, 243, 255, 0.14), 0 0 48px rgba(195, 140, 255, 0.08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ui-scale: 1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(60, 90, 170, 0.22), transparent 32%),
        radial-gradient(circle at 80% 30%, rgba(180, 70, 170, 0.14), transparent 28%),
        radial-gradient(circle at 50% 80%, rgba(20, 160, 200, 0.12), transparent 30%),
        linear-gradient(180deg, #080d15 0%, #04070c 100%);
      color: var(--text);
    }

    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    #gameWrap {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      background: transparent;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 220ms ease;
      background: linear-gradient(180deg, rgba(5, 8, 14, 0.2), rgba(5, 8, 14, 0.58));
    }

    #overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      width: min(980px, 100%);
      max-height: calc(100vh - 40px);
      overflow: auto;
      padding: 28px 28px 24px;
      border: 1px solid rgba(116, 243, 255, 0.16);
      background: linear-gradient(180deg, rgba(10, 16, 28, 0.92), rgba(8, 12, 22, 0.9));
      box-shadow: var(--shadow);
      border-radius: 24px;
      backdrop-filter: blur(12px);
    }

    .center {
      text-align: center;
    }

    .kicker {
      display: inline-block;
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--cyan);
      border: 1px solid rgba(116, 243, 255, 0.18);
      background: rgba(116, 243, 255, 0.06);
    }

    h1 {
      margin: 4px 0 10px;
      font-size: clamp(42px, 10vw, 88px);
      line-height: 0.95;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(116, 243, 255, 0.2), 0 0 28px rgba(195, 140, 255, 0.2);
    }

    h2 {
      margin: 0 0 10px;
      font-size: clamp(30px, 6vw, 54px);
      line-height: 1;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .lead {
      max-width: 720px;
      margin: 0 auto 18px;
      font-size: 16px;
    }

    .ctaRow,
    .statsRow {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
    }

    button {
      appearance: none;
      border: 0;
      outline: none;
      border-radius: 16px;
      padding: 14px 18px;
      min-width: 164px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      background: linear-gradient(180deg, rgba(90, 160, 255, 0.22), rgba(50, 90, 180, 0.22));
      box-shadow: inset 0 0 0 1px rgba(140, 195, 255, 0.18), 0 6px 18px rgba(0, 0, 0, 0.28);
      transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-2px);
      box-shadow: inset 0 0 0 1px rgba(170, 220, 255, 0.28), 0 10px 24px rgba(0, 0, 0, 0.34);
      background: linear-gradient(180deg, rgba(120, 190, 255, 0.28), rgba(65, 110, 190, 0.26));
    }

    .ghost {
      background: linear-gradient(180deg, rgba(195, 140, 255, 0.12), rgba(120, 80, 170, 0.12));
      box-shadow: inset 0 0 0 1px rgba(195, 140, 255, 0.18), 0 6px 18px rgba(0, 0, 0, 0.24);
    }

    .helpGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-top: 22px;
    }

    .helpCard,
    .statCard {
      padding: 14px 14px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .helpCard strong,
    .statCard strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 14px;
      letter-spacing: 0.03em;
    }

    .helpCard span,
    .statCard span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .choice {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 10px;
      min-height: 220px;
      text-align: left;
      padding: 18px 18px 16px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      overflow: hidden;
    }

    .choice::before {
      content: "";
      position: absolute;
      inset: -20% auto auto -20%;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      opacity: 0.22;
      filter: blur(8px);
      pointer-events: none;
    }

    .choice small {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .choice h3 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .choice p {
      font-size: 14px;
      min-height: 68px;
    }

    .choice ul {
      margin: 0;
      padding-left: 18px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    .choice.common::before { background: radial-gradient(circle, rgba(103, 168, 255, 1), transparent 65%); }
    .choice.rare::before { background: radial-gradient(circle, rgba(116, 243, 255, 1), transparent 65%); }
    .choice.epic::before { background: radial-gradient(circle, rgba(195, 140, 255, 1), transparent 65%); }
    .choice.legendary::before { background: radial-gradient(circle, rgba(255, 215, 107, 1), transparent 65%); }
    .choice.mythic::before { background: radial-gradient(circle, rgba(255, 255, 255, 1), rgba(116, 243, 255, 0.55), transparent 70%); }
    .choice.corrupted::before { background: radial-gradient(circle, rgba(255, 109, 122, 1), rgba(195, 140, 255, 0.52), transparent 68%); }
    .choice.transcendent::before { background: radial-gradient(circle, rgba(255, 255, 255, 1), rgba(255, 215, 107, 0.78), rgba(116, 243, 255, 0.4), transparent 74%); }
    .choice.transcendent { border-color: rgba(255, 255, 255, 0.28); box-shadow: inset 0 0 0 1px rgba(255,215,107,0.18), 0 0 30px rgba(255,215,107,0.08); }

    .choice.common small { color: var(--blue); }
    .choice.rare small { color: var(--cyan); }
    .choice.epic small { color: var(--violet); }
    .choice.legendary small { color: var(--gold); }
    .choice.mythic small { color: #fff; text-shadow: 0 0 10px rgba(116,243,255,0.45); }
    .choice.corrupted small { color: var(--danger); }
    .choice.transcendent small { color: #fff; text-shadow: 0 0 10px rgba(255,215,107,0.7), 0 0 18px rgba(116,243,255,0.45); }

    .foot {
      margin-top: 18px;
      color: rgba(180, 198, 220, 0.72);
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    .bigStat {
      min-width: 150px;
      padding: 16px 18px 14px;
      border-radius: 18px;
      text-align: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .bigStat b {
      display: block;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .bigStat span {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 900;
      color: var(--text);
    }

    #overlay .panel {
      transform: scale(var(--ui-scale, 1));
      transform-origin: center center;
    }

    .pausePanel {
      max-width: min(880px, 100%);
    }

    .settingsBox {
      width: min(720px, 100%);
      margin: 22px auto 0;
      padding: 18px 18px 16px;
      text-align: left;
      border-radius: 22px;
      border: 1px solid rgba(116, 243, 255, 0.14);
      background: rgba(255, 255, 255, 0.035);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.035);
    }

    .settingsTitle {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .settingsTitle h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .settingsTitle span {
      color: var(--muted);
      font-size: 12px;
    }

    .settingRow {
      display: grid;
      grid-template-columns: minmax(170px, 1fr) minmax(190px, 2fr) 78px;
      gap: 14px;
      align-items: center;
      padding: 13px 0;
      border-top: 1px solid rgba(255,255,255,0.075);
    }

    .settingRow label {
      display: block;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .settingHint {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
    }

    .settingValue {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 900;
      text-align: right;
      letter-spacing: 0.04em;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #74f3ff;
      cursor: pointer;
    }

    .settingToggle {
      justify-self: start;
      width: 22px;
      height: 22px;
      accent-color: #74f3ff;
      cursor: pointer;
    }

    .rerollBar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid rgba(116, 243, 255, 0.12);
      background: rgba(255, 255, 255, 0.035);
    }

    .rerollBar span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .rerollBar button {
      min-width: 138px;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13px;
    }

    #audioToggle {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 6;
      min-width: 0;
      width: auto;
      padding: calc(10px * var(--ui-scale, 1)) calc(13px * var(--ui-scale, 1));
      border-radius: 999px;
      font-size: calc(12px * var(--ui-scale, 1));
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      background: linear-gradient(180deg, rgba(116, 243, 255, 0.16), rgba(103, 168, 255, 0.12));
      box-shadow: inset 0 0 0 1px rgba(116, 243, 255, 0.22), 0 8px 24px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
      pointer-events: auto;
    }

    #audioToggle.muted {
      color: rgba(238, 246, 255, 0.68);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 8px 24px rgba(0, 0, 0, 0.24);
    }

    #audioToggle.boss {
      color: #fff6d2;
      background: linear-gradient(180deg, rgba(255, 215, 107, 0.24), rgba(255, 109, 122, 0.14));
      box-shadow: inset 0 0 0 1px rgba(255, 215, 107, 0.3), 0 0 22px rgba(255, 215, 107, 0.12), 0 8px 24px rgba(0, 0, 0, 0.28);
    }



    .armoryGrid,
    .contractGrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .contractGrid.compact {
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      margin-top: 14px;
    }

    .armoryCard,
    .contractCard {
      padding: 14px 14px 13px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.035);
      text-align: left;
    }

    .armoryTop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .armoryTop strong,
    .contractCard strong {
      color: var(--text);
      font-size: 14px;
      letter-spacing: 0.03em;
    }

    .armoryTop span,
    .contractCard em {
      color: var(--cyan);
      font-size: 12px;
      font-style: normal;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .armoryCard p,
    .contractCard span {
      display: block;
      min-height: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .contractCard.complete {
      border-color: rgba(140,255,189,0.24);
      background: rgba(140,255,189,0.055);
    }

    .armoryProgress {
      width: 100%;
      height: 8px;
      margin: 10px 0 12px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.08);
    }

    .armoryProgress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(116,243,255,0.92), rgba(255,215,107,0.92));
    }

    .armoryCard button {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 13px;
      font-size: 13px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none !important;
    }

    .sectionTitle {
      margin: 24px 0 0;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    @media (max-width: 680px) {
      .panel { padding: 22px 18px 18px; border-radius: 20px; }
      .choice { min-height: 0; }
      button { width: 100%; }
      .ctaRow { flex-direction: column; }
      .settingRow { grid-template-columns: 1fr; gap: 8px; }
      .settingValue { text-align: left; }
      #audioToggle { right: 12px; bottom: 12px; font-size: calc(11px * var(--ui-scale, 1)); padding: calc(9px * var(--ui-scale, 1)) calc(11px * var(--ui-scale, 1)); }
    }
  </style>
</head>
<body>
  <div id="gameWrap">
    <canvas id="game"></canvas>
    <button id="audioToggle" type="button" aria-label="Toggle music and sound">Audio: Click to enable</button>
    <div id="overlay" class="show"></div>
  </div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d', { alpha: false });
      const overlay = document.getElementById('overlay');
      const audioToggle = document.getElementById('audioToggle');

      const TAU = Math.PI * 2;
      const DPR = () => Math.min(window.devicePixelRatio || 1, 2);
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
      const irand = (a, b) => Math.floor(rand(a, b + 1));
      const chance = (p) => Math.random() < p;
      const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
      const norm = (x, y) => {
        const m = Math.hypot(x, y) || 1;
        return { x: x / m, y: y / m, m };
      };
      const angleDiff = (a, b) => {
        let d = (b - a + Math.PI) % TAU - Math.PI;
        if (d < -Math.PI) d += TAU;
        return d;
      };

      const ENTITY_LIMITS = {
        enemies: 96,
        bullets: 280,
        enemyBullets: 440,
        particles: 460,
        pickups: 260,
        shockwaves: 46,
        trails: 150,
        hazards: 72,
        alliedMines: 52,
        lightningBolts: 84,
        allies: 12,
        floaters: 120,
      };

      function trimArray(arr, max) {
        if (!arr || arr.length <= max) return;
        arr.splice(0, arr.length - max);
      }

      function currentEnemyLimit() {
        const wave = game ? game.wave : 1;
        return Math.min(132, ENTITY_LIMITS.enemies + Math.floor(Math.max(0, wave - 12) * 1.15));
      }

      function bossAddLimit() {
        const wave = game ? game.wave : 1;
        if (wave === 5 && (game?.bossKind === 'bossWarden' || game?.bossName === 'Anomaly Warden')) {
          return Math.min(currentEnemyLimit() - 1, 12);
        }
        if (wave === 10 && (game?.bossKind === 'bossPrism' || game?.bossName === 'Prism Hydra')) {
          return Math.min(currentEnemyLimit() - 1, 13);
        }
        return Math.min(currentEnemyLimit() - 1, 28 + Math.floor(wave / 5) * 5);
      }

      function countBossAdds() {
        return enemies.reduce((count, enemy) => count + (enemy && !enemy.dead && enemy.type !== 'boss' ? 1 : 0), 0);
      }

      function enforceEntityCaps() {
        trimArray(bullets, ENTITY_LIMITS.bullets);
        trimArray(enemyBullets, ENTITY_LIMITS.enemyBullets);
        trimArray(particles, ENTITY_LIMITS.particles);
        trimArray(pickups, ENTITY_LIMITS.pickups);
        trimArray(shockwaves, ENTITY_LIMITS.shockwaves);
        trimArray(trails, ENTITY_LIMITS.trails);
        trimArray(hazards, ENTITY_LIMITS.hazards);
        trimArray(alliedMines, ENTITY_LIMITS.alliedMines);
        trimArray(lightningBolts, ENTITY_LIMITS.lightningBolts);
        trimArray(allies, ENTITY_LIMITS.allies);
        trimArray(floaters, ENTITY_LIMITS.floaters);
        const maxEnemies = currentEnemyLimit();
        while (enemies.length > maxEnemies) {
          const idx = enemies.findIndex((enemy) => enemy && enemy.type !== 'boss');
          if (idx < 0) break;
          enemies.splice(idx, 1);
        }
      }

      let view = { w: window.innerWidth, h: window.innerHeight, dpr: DPR() };
      let stars = [];
      let particles = [];
      let enemies = [];
      let allies = [];
      let bullets = [];
      let enemyBullets = [];
      let pickups = [];
      let shockwaves = [];
      let trails = [];
      let hazards = [];
      let alliedMines = [];
      let lightningBolts = [];
      let floaters = [];
      let game = null;
      let player = null;
      let lastTime = 0;
      let entityId = 1;
      let vibrationAvailable = typeof navigator !== 'undefined' && 'vibrate' in navigator;

      const input = {
        keys: Object.create(null),
        pressed: new Set(),
        mouse: { x: 0, y: 0, inside: false, movedAt: 0 },
      };

      const SETTINGS_KEY = 'neon-rift-settings-v2';
      const DEFAULT_SETTINGS = {
        musicVolume: 1.35,
        sfxVolume: 1.0,
        uiScale: 1.0,
        screenShake: 1.0,
        visualFx: 1.0,
        damageNumbers: true,
        showWarnings: true,
      };

      function loadSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
          return {
            musicVolume: clamp(Number(saved.musicVolume ?? DEFAULT_SETTINGS.musicVolume), 0, 2),
            sfxVolume: clamp(Number(saved.sfxVolume ?? DEFAULT_SETTINGS.sfxVolume), 0, 1.5),
            uiScale: clamp(Number(saved.uiScale ?? DEFAULT_SETTINGS.uiScale), 0.75, 1.3),
            screenShake: clamp(Number(saved.screenShake ?? DEFAULT_SETTINGS.screenShake), 0, 1.25),
            visualFx: clamp(Number(saved.visualFx ?? DEFAULT_SETTINGS.visualFx), 0.45, 1.25),
            damageNumbers: saved.damageNumbers ?? DEFAULT_SETTINGS.damageNumbers,
            showWarnings: saved.showWarnings ?? DEFAULT_SETTINGS.showWarnings,
          };
        } catch (e) {
          return { ...DEFAULT_SETTINGS };
        }
      }

      function saveSettings() {
        try {
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        } catch (e) {
          // ignore storage issues
        }
      }

      function applySettingsToDocument() {
        document.documentElement.style.setProperty('--ui-scale', settings.uiScale.toFixed(2));
      }

      function formatSettingValue(key) {
        const value = settings[key];
        if (key === 'musicVolume' || key === 'sfxVolume' || key === 'uiScale' || key === 'screenShake' || key === 'visualFx') {
          return `${Math.round(value * 100)}%`;
        }
        if (key === 'damageNumbers' || key === 'showWarnings') return value ? 'ON' : 'OFF';
        return String(value);
      }

      function refreshSettingsControls() {
        if (!overlay) return;
        overlay.querySelectorAll('[data-setting-value]').forEach((el) => {
          el.textContent = formatSettingValue(el.dataset.settingValue);
        });
      }

      function updateSetting(key, rawValue) {
        if (!(key in settings)) return;
        if (key === 'damageNumbers' || key === 'showWarnings') {
          settings[key] = rawValue === true || rawValue === 'true' || rawValue === 'on' || rawValue === 1 || rawValue === '1';
        } else {
          const num = Number(rawValue);
          if (!Number.isFinite(num)) return;
          if (key === 'musicVolume') settings.musicVolume = clamp(num, 0, 2);
          else if (key === 'sfxVolume') settings.sfxVolume = clamp(num, 0, 1.5);
          else if (key === 'uiScale') settings.uiScale = clamp(num, 0.75, 1.3);
          else if (key === 'screenShake') settings.screenShake = clamp(num, 0, 1.25);
          else if (key === 'visualFx') settings.visualFx = clamp(num, 0.45, 1.25);
        }
        saveSettings();
        applySettingsToDocument();
        if (typeof audio !== 'undefined' && audio && audio.applySettings) audio.applySettings();
        refreshSettingsControls();
      }

      let settings = loadSettings();
      applySettingsToDocument();

      const KEY_BLOCK = new Set([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'tab']);

      function resize() {
        view.w = window.innerWidth;
        view.h = window.innerHeight;
        view.dpr = DPR();
        canvas.width = Math.floor(view.w * view.dpr);
        canvas.height = Math.floor(view.h * view.dpr);
        canvas.style.width = view.w + 'px';
        canvas.style.height = view.h + 'px';
        ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
        if (!stars.length) createStarfield();
      }

      function createStarfield() {
        stars = [];
        const count = Math.max(80, Math.floor((view.w * view.h) / 9000 * clamp(settings.visualFx || 1, 0.45, 1.25)));
        for (let i = 0; i < count; i++) {
          stars.push({
            x: rand(0, view.w),
            y: rand(0, view.h),
            z: rand(0.4, 1.4),
            r: rand(0.5, 2.2),
            twinkle: rand(0, TAU),
          });
        }
      }

      function saveHighScore(score) {
        try {
          localStorage.setItem('neon-rift-high-score', String(score));
        } catch (e) {
          // ignore
        }
      }

      function loadHighScore() {
        try {
          return Number(localStorage.getItem('neon-rift-high-score')) || 0;
        } catch (e) {
          return 0;
        }
      }

      const audio = {
        ctx: null,
        master: null,
        sfxBus: null,
        musicBus: null,
        drumBus: null,
        musicFilter: null,
        noiseBuffer: null,
        unlocked: false,
        muted: false,
        mode: 'silent',
        step: 0,
        nextStepTime: 0,
        lastBossStinger: -999,
        lastBossSpawn: -999,
        ensure() {

              this.updateButton();

            this.ctx = new AC();
            this.master = this.ctx.createGain();
            this.sfxBus = this.ctx.createGain();
            this.musicBus = this.ctx.createGain();
            this.drumBus = this.ctx.createGain();
            this.musicFilter = this.ctx.createBiquadFilter();

            this.master.gain.value = this.muted ? 0 : 0.92;
            this.sfxBus.gain.value = 0.085 * clamp(settings.sfxVolume, 0, 1.5);
            this.musicBus.gain.value = 0;
            this.drumBus.gain.value = 0;
            this.musicFilter.type = 'lowpass';
            this.musicFilter.frequency.value = 2400;
            this.musicFilter.Q.value = 0.7;

            this.sfxBus.connect(this.master);
            this.musicBus.connect(this.musicFilter);
            this.musicFilter.connect(this.master);
            this.drumBus.connect(this.master);
            this.master.connect(this.ctx.destination);

            const frames = Math.floor(this.ctx.sampleRate * 1.25);
            this.noiseBuffer = this.ctx.createBuffer(1, frames, this.ctx.sampleRate);
            const channel = this.noiseBuffer.getChannelData(0);
            for (let i = 0; i < frames; i++) channel[i] = Math.random() * 2 - 1;
          }
          this.updateButton();
          return this.ctx;
        },
        unlock() {
          const ac = this.ensure();
          if (!ac) return;
          if (ac.state === 'suspended') ac.resume();

        },
        updateButton() {
          if (!audioToggle) return;
          const noAudio = !(window.AudioContext || window.webkitAudioContext);
          audioToggle.disabled = noAudio;
          audioToggle.classList.toggle('muted', this.muted || noAudio);
          audioToggle.classList.toggle('boss', this.mode === 'boss' && !this.muted && !noAudio);
          if (noAudio) {
            audioToggle.textContent = 'Audio unavailable';
          } else if (this.muted) {
            audioToggle.textContent = 'Audio: Muted (M)';
          } else if (!this.unlocked) {
            audioToggle.textContent = 'Audio: Click to enable';
          } else if (this.mode === 'boss') {
            audioToggle.textContent = 'Boss Music: On (M)';
          } else {
            audioToggle.textContent = 'Audio: On (M)';
          }
        },
        setGain(gainNode, value, ramp = 0.22) {
          if (!this.ctx || !gainNode) return;
          const t = this.ctx.currentTime;
          gainNode.gain.cancelScheduledValues(t);
          gainNode.gain.setValueAtTime(Math.max(0.0001, gainNode.gain.value), t);
          gainNode.gain.linearRampToValueAtTime(value, t + ramp);
        },
        musicGain(value) {

        },
        applySettings() {
          applySettingsToDocument();
          if (this.sfxBus) this.sfxBus.gain.value = 0.085 * clamp(settings.sfxVolume, 0, 1.5);
          if (this.master && this.ctx) this.setGain(this.master, this.muted ? 0 : 0.92, 0.08);
          if (this.ctx && this.unlocked) this.setMusicMode(this.mode || 'normal', true);

        },
        setMusicMode(mode = 'normal', force = false) {
          const ac = this.ensure();
          if (!ac || !this.unlocked) {
            this.mode = mode;
            this.updateButton();

          }
          if (this.mode === mode && !force) return;
          this.mode = mode;
          this.step = 0;
          this.nextStepTime = ac.currentTime + 0.04;

          if (mode === 'boss') {
            this.setGain(this.musicBus, this.musicGain(0.071), 0.5);
            this.setGain(this.drumBus, this.musicGain(0.052), 0.35);
            this.musicFilter.frequency.cancelScheduledValues(ac.currentTime);
            this.musicFilter.frequency.setValueAtTime(this.musicFilter.frequency.value, ac.currentTime);
            this.musicFilter.frequency.linearRampToValueAtTime(3100, ac.currentTime + 0.7);
          } else if (mode === 'normal') {
            this.setGain(this.musicBus, this.musicGain(0.046), 0.65);
            this.setGain(this.drumBus, this.musicGain(0.033), 0.45);
            this.musicFilter.frequency.cancelScheduledValues(ac.currentTime);
            this.musicFilter.frequency.setValueAtTime(this.musicFilter.frequency.value, ac.currentTime);
            this.musicFilter.frequency.linearRampToValueAtTime(2350, ac.currentTime + 0.7);
          } else if (mode === 'levelup') {
            this.setGain(this.musicBus, this.musicGain(0.030), 0.55);

            this.musicFilter.frequency.cancelScheduledValues(ac.currentTime);

          } else if (mode === 'paused') {

            this.setGain(this.drumBus, 0, 0.25);
          } else {
            this.setGain(this.musicBus, 0, 0.38);
            this.setGain(this.drumBus, 0, 0.25);

          this.updateButton();
        },
        startMusic(mode = 'normal') {
          this.unlock();
          this.setMusicMode(mode, true);
        },
        stopMusic() {
          this.setMusicMode('silent', true);
        },
        pauseMusic() {
          this.setMusicMode('paused');
        },
        resumeMusic() {
          this.setMusicMode(game && game.mode === 'playing' && game.bossWave && !game.waveResolved ? 'boss' : 'normal');
        },
        toggleMute() {
          this.unlock();
          this.muted = !this.muted;
          if (this.master && this.ctx) this.setGain(this.master, this.muted ? 0 : 0.92, 0.12);
          this.updateButton();
        },
        bus(kind) {
          if (kind === 'music') return this.musicBus;
          if (kind === 'drum') return this.drumBus;
          return this.sfxBus;
        },
        tone({ freq = 240, freq2 = null, duration = 0.08, gain = 0.18, type = 'sawtooth', attack = 0.002, release = 0.08, bus = 'sfx', when = null, detune = 0, filterFreq = null }) {
          const ac = this.ensure();

          const osc = ac.createOscillator();
          const g = ac.createGain();
          let dest = this.bus(bus);
          osc.type = type;
          osc.frequency.setValueAtTime(Math.max(20, freq), t);
          osc.detune.setValueAtTime(detune, t);
          if (freq2 != null && freq2 > 0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t + Math.max(0.01, duration));
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain), t + attack);
          g.gain.exponentialRampToValueAtTime(0.0001, t + duration + release);

            f.type = 'lowpass';

          osc.start(t);
          osc.stop(t + duration + release + 0.04);
        },
        noise({ duration = 0.08, gain = 0.04, when = null, bus = 'drum', filterType = 'highpass', filterFreq = 5200, attack = 0.001, release = 0.06 }) {

          filter.Q.value = filterType === 'bandpass' ? 1.2 : 0.7;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain), t + attack);
          g.gain.exponentialRampToValueAtTime(0.0001, t + duration + release);
          src.connect(filter);
          filter.connect(g);
          g.connect(this.bus(bus) || this.master);
          src.start(t);
          src.stop(t + duration + release + 0.03);
        },
        kick(when, boss = false) {
          this.tone({ freq: boss ? 88 : 72, freq2: boss ? 34 : 42, duration: boss ? 0.22 : 0.18, gain: boss ? 0.2 : 0.14, type: 'sine', release: 0.08, bus: 'drum', when });
          if (boss) this.noise({ duration: 0.025, gain: 0.032, when, bus: 'drum', filterType: 'lowpass', filterFreq: 900, release: 0.03 });

        snare(when, boss = false) {

          this.tone({ freq: boss ? 152 : 185, freq2: boss ? 96 : 115, duration: 0.06, gain: boss ? 0.035 : 0.022, type: 'triangle', release: 0.04, bus: 'drum', when });

        hat(when, boss = false) {

        },
        bass(freq, when, boss = false) {

          if (boss) this.tone({ freq: freq / 2, duration: 0.24, gain: 0.028, type: 'sine', release: 0.08, bus: 'music', when });

        pluck(freq, when, boss = false) {

          this.tone({ freq: freq * 2.005, duration: boss ? 0.055 : 0.08, gain: boss ? 0.013 : 0.008, type: 'triangle', release: 0.06, bus: 'music', when: when + 0.01, filterFreq: 2600 });

        padChord(freqs, when, boss = false) {

          const dur = boss ? 0.85 : 1.25;

        },
        stepDuration(mode) {

          if (mode === 'levelup') return 60 / 82 / 2;
          return 60 / 108 / 2;

        scheduleStep(when) {
          if (this.mode === 'silent' || this.mode === 'paused') return;
          const s = this.step % 16;
          if (this.mode === 'boss') {
            const roots = [49, 55, 46.25, 51.91];
            const root = roots[Math.floor(s / 4)] || 49;
            if ([0, 3, 6, 8, 11, 14].includes(s)) this.bass(root * (s % 8 === 6 ? 1.5 : 1), when, true);
            if ([0, 4, 7, 10, 12].includes(s)) this.kick(when, true);
            if ([4, 12].includes(s)) this.snare(when + 0.005, true);
            if (s % 2 === 1 || [6, 14].includes(s)) this.hat(when + 0.01, true);
            const bossScale = [98, 110, 116.54, 130.81, 146.83, 164.81, 174.61, 196];
            if ([1, 2, 5, 6, 9, 10, 13, 14].includes(s)) {
              const note = bossScale[(s + Math.floor((game?.time || 0) * 2)) % bossScale.length] * (s === 14 ? 2 : 1);

            const root = roots[Math.floor(s / 4)] || 55;
            if (s % 4 === 0 || s === 10) this.bass(root, when, false);
            if ([0, 8].includes(s)) this.kick(when, false);
            if ([4, 12].includes(s)) this.snare(when + 0.006, false);
            if (s % 2 === 1) this.hat(when + 0.012, false);
            const scale = [220, 246.94, 261.63, 293.66, 329.63, 392, 440];
            if ([2, 5, 10, 14].includes(s) && chance(0.82)) {
              const note = scale[(s + Math.floor((game?.time || 0) * 1.5)) % scale.length];
              this.pluck(note, when + 0.015, false);
            }
            if (s === 0 || s === 8) this.padChord([110, 146.83, 220, 293.66], when + 0.03, false);

        },
        update(dt) {
          const ac = this.ctx;
          if (!ac || !this.unlocked || this.muted) {
            this.updateButton();
            return;
          }
          if (ac.state !== 'running') return;
          let desired = 'silent';
          if (game) {
            if (game.mode === 'playing') desired = game.bossWave && !game.waveResolved ? 'boss' : 'normal';
            else if (game.mode === 'levelup') desired = 'levelup';
            else if (game.mode === 'paused') desired = 'paused';
          }
          if (desired !== this.mode) this.setMusicMode(desired);

          }
          this.updateButton();
        },
        button() { this.tone({ freq: 520, freq2: 680, duration: 0.05, gain: 0.035, type: 'triangle', release: 0.04 }); },
        wave() { this.tone({ freq: 196, freq2: 330, duration: 0.14, gain: 0.045, type: 'triangle', release: 0.12 }); },
        shoot() { this.tone({ freq: 410, freq2: 170, duration: 0.045, gain: 0.055, type: 'square', release: 0.03 }); },
        hit() { this.tone({ freq: 180, freq2: 90, duration: 0.04, gain: 0.05, type: 'triangle', release: 0.04 }); },
        dash() { this.tone({ freq: 200, freq2: 70, duration: 0.12, gain: 0.08, type: 'sawtooth', release: 0.08 }); },
        collect() { this.tone({ freq: 620, freq2: 880, duration: 0.055, gain: 0.035, type: 'triangle', release: 0.03 }); },
        hurt() { this.tone({ freq: 120, freq2: 60, duration: 0.16, gain: 0.08, type: 'square', release: 0.12 }); },
        explode() { this.tone({ freq: 95, freq2: 35, duration: 0.22, gain: 0.095, type: 'sawtooth', release: 0.16 }); },
        upgrade() {

        boss() {

      function refreshMusicForGameState() {
        if (!game) return;
        if (game.mode === 'playing') audio.setMusicMode(game.bossWave && !game.waveResolved ? 'boss' : 'normal');
        else if (game.mode === 'levelup') audio.setMusicMode('levelup');
        else if (game.mode === 'paused') audio.pauseMusic();
        else audio.stopMusic();
      }

      function now() {
        return performance.now() / 1000;
      }

      function justPressed(key) {
        return input.pressed.has(key);
      }

      function keyDown(...keys) {
        return keys.some((k) => input.keys[k]);
      }

      function clearPressed() {
        input.pressed.clear();
      }

      function addParticle(x, y, options = {}) {
        if (particles.length >= ENTITY_LIMITS.particles) particles.splice(0, particles.length - ENTITY_LIMITS.particles + 1);
        particles.push({
          x,
          y,
          vx: options.vx ?? rand(-90, 90),
          vy: options.vy ?? rand(-90, 90),
          r: options.r ?? rand(1.5, 4.5),
          life: options.life ?? rand(0.25, 0.7),
          maxLife: options.life ?? rand(0.25, 0.7),
          color: options.color ?? '120,243,255',
          glow: options.glow ?? 0,
          fade: options.fade ?? 1,
        });
      }

      function ringBurst(x, y, color, count, speedMin, speedMax, sizeMin = 1.5, sizeMax = 4.5) {
        count = Math.ceil(count * clamp(settings.visualFx || 1, 0.45, 1.25));
        count = Math.min(count, particles.length > ENTITY_LIMITS.particles * 0.82 ? 8 : 36);
        for (let i = 0; i < count; i++) {
          const a = rand(0, TAU);
          const s = rand(speedMin, speedMax);
          addParticle(x, y, {
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            r: rand(sizeMin, sizeMax),
            life: rand(0.35, 0.85),
            color,
            glow: 8,
          });
        }
      }

        if (!origin || jumps <= 0) return;

        for (const enemy of enemies) {
          if (seen.has(enemy.id)) continue;
          const d = dist(origin.x, origin.y, enemy.x, enemy.y);
          if (d < best) {
            best = d;
            target = enemy;

        if (!target) return;
        if (lightningBolts.length >= ENTITY_LIMITS.lightningBolts) lightningBolts.shift();
        lightningBolts.push({

          y1: origin.y,
          x2: target.x,
          y2: target.y,
          life: 0.16,
          maxLife: 0.16,
          color: '116,243,255',
        });
        target.slowTimer = Math.max(target.slowTimer || 0, 0.45);
        target.slowAmount = Math.min(target.slowAmount || 1, 0.78);
        damageEnemy(target, damage);

      function weightedPick(items) {
        const total = items.reduce((sum, item) => sum + Math.max(0, item.weight), 0);
        if (total <= 0) return items[items.length - 1];
        let r = Math.random() * total;
        for (const item of items) {
          r -= Math.max(0, item.weight);
          if (r <= 0) return item;
        }
        return items[items.length - 1];

      function bossIndexForWave(wave) {
        return Math.max(0, Math.floor(wave / 5) - 1);
      }

      function bossCycleForWave(wave) {
        return Math.floor(bossIndexForWave(wave) / BOSS_ROTATION.length);
      }

      function lateBossIntensity(wave = (game ? game.wave : 1)) {
        const postFifty = Math.max(0, Math.floor((wave - 50) / 5));
        return Math.min(18, postFifty + bossCycleForWave(wave) * 3);
      }

      function bossTypeForWave(wave) {
        return BOSS_ROTATION[bossIndexForWave(wave) % BOSS_ROTATION.length];
      }

      function bossDisplayName(type, wave = null) {
        const base = (bossDefinitions[type] || bossDefinitions.bossWarden).name;
        return wave && bossCycleForWave(wave) > 0 ? `Ascended ${base}` : base;
      }

      function isFirstBossEncounter(e = null) {
        const wave = game ? game.wave : 0;
        const kind = e && e.bossKind ? e.bossKind : bossTypeForWave(wave || 5);
        return wave === 5 && kind === 'bossWarden';
      }

      function isSecondBossEncounter(e = null) {
        const wave = game ? game.wave : 0;
        const kind = e && e.bossKind ? e.bossKind : bossTypeForWave(wave || 10);
        return wave === 10 && kind === 'bossPrism';
      }


      function bossShotDamage(e, base) {
        const phase = e.phase || 0;
        const tier = e.bossTier || 0;
        const intro = isFirstBossEncounter(e);
        const second = isSecondBossEncounter(e);
        const late = intro || second ? 0 : (e.lateBossPower || lateBossIntensity(game?.wave || 1));
        const waveBonus = Math.max(0, (game?.wave || 1) - 12) * 0.18;
        const damage = base + phase * 4.4 + tier * 3.2 + late * 1.8 + waveBonus + (e.enraged ? 4.5 + late * 0.7 : 0);
        return intro ? damage * 0.74 : second ? damage * 0.72 : damage;
      }

      function bossShotSpeed(e, base) {
        const phase = e.phase || 0;
        const tier = e.bossTier || 0;
        const intro = isFirstBossEncounter(e);
        const second = isSecondBossEncounter(e);
        const late = intro || second ? 0 : (e.lateBossPower || lateBossIntensity(game?.wave || 1));
        const speed = base + phase * 42 + tier * 18 + late * 14 + (e.enraged ? 55 + late * 5 : 0);
        return intro ? speed * 0.86 : second ? speed * 0.78 : speed;
      }

      function bossTimer(e, base, min, phaseStep = 0.22, tierStep = 0.07) {
        const value = base - (e.phase || 0) * phaseStep - (e.bossTier || 0) * tierStep;
        const intro = isFirstBossEncounter(e);
        const second = isSecondBossEncounter(e);
        const late = intro || second ? 0 : (e.lateBossPower || lateBossIntensity(game?.wave || 1));
        const rageMult = e.enraged ? (intro ? 0.86 : second ? 0.90 : 0.72) : 1;
        const minBoost = intro ? 1.18 : second ? 1.28 : 1;
        const valueBoost = intro ? 1.24 : second ? 1.36 : 1;
        const lateMinMult = Math.max(0.76, 1 - late * 0.022);
        const lateValueMult = Math.max(0.70, 1 - late * 0.035);
        return Math.max(min * minBoost * lateMinMult, value * rageMult * valueBoost * lateValueMult);
      }

        const safeShots = clamp(Math.floor(shots), 1, 18);
        for (let s = 0; s < safeShots; s++) {
          const denom = Math.max(1, safeShots - 1);
          const offset = (s - (safeShots - 1) / 2) * (spread / denom) + (jitter ? rand(-jitter, jitter) : 0);
          fireBossBullet(e, baseAngle + offset, speed, size, damage);
        }

        for (let lane = 0; lane < safeLanes; lane++) {

      function generateOffers() {
        const offers = [];
        const used = new Set();
        const luck = luckValue();
        const targetOffers = offerCount();
        let safety = 0;
        while (offers.length < targetOffers && safety++ < 120) {
          const weighted = [];
          for (const up of upgradePool) {
            if (used.has(up.id)) continue;
            if (up.minWave && game.wave < up.minWave) continue;
            let weight = up.weight;
            if (up.id === 'repair' && player.hp < player.maxHp * 0.45) weight += 6;
            if (up.id === 'aegis' && player.shield < player.maxShield * 0.3) weight += 4;
            if (up.id === 'reroll-chip' && game.rerolls <= 0) weight += 3;
            if (up.rarity === 'rare') weight += luck * 0.08;
            if (up.rarity === 'epic') weight += Math.max(0, game.wave - 3) * 0.15 + luck * 0.1;
            if (up.rarity === 'legendary') weight += Math.max(0, game.wave - 5) * 0.2 + luck * 0.075;
            if (up.rarity === 'mythic' || up.rarity === 'corrupted') weight += Math.max(0, game.wave - 9) * 0.08 + luck * 0.055;
            if (up.rarity === 'transcendent') weight += Math.max(0, game.wave - 7) * 0.045 + luck * 0.08;
            weighted.push({ ...up, weight });
          }
          if (!weighted.length) break;
          const pick = weightedPick(weighted);
          used.add(pick.id);
          offers.push(pick);
        }
        return offers;
      }

      function spawnPickup(x, y, type, value = 1) {
        if (pickups.length >= ENTITY_LIMITS.pickups) pickups.shift();
        pickups.push({
          x,
          y,
          vx: rand(-35, 35),
          vy: rand(-35, 35),
          r: type === 'heal' ? 10 : 8,
          type,
          value,
          life: 18,

      }

      function spawnEnemy(type, elite = false, explicitX = null, explicitY = null) {
        const edge = irand(0, 3);
        let x = explicitX;
        let y = explicitY;
        if (x == null || y == null) {
          if (edge === 0) { x = rand(20, view.w - 20); y = -40; }
          if (edge === 1) { x = view.w + 40; y = rand(20, view.h - 20); }
          if (edge === 2) { x = rand(20, view.w - 20); y = view.h + 40; }
          if (edge === 3) { x = -40; y = rand(20, view.h - 20); }
        }

        const isBossRequest = type === 'boss' || Boolean(bossDefinitions[type]);
        if (!isBossRequest && enemies.length >= currentEnemyLimit()) return null;

        const base = {
          id: entityId++,
          x,
          y,
          vx: 0,
          vy: 0,
          type,
          elite,
          hitFlash: 0,
          touchCd: 0,
          slowTimer: 0,
          slowAmount: 1,
          burnTimer: 0,
          burnDps: 0,
          dotFx: 0,

        if (type === 'scout') {

          enemy = { ...base, r: 16, hp: 72, maxHp: 72, speed: 132, damage: 17, score: 118, color: '255,90,120', drop: 5, drain: 0, pulse: rand(0, TAU) };
        } else if (type === 'artillery') {
          enemy = { ...base, r: 22, hp: 104, maxHp: 104, speed: 52, damage: 20, score: 170, color: '255,215,107', drop: 8, lob: rand(1.0, 1.8), aimX: 0, aimY: 0, aiming: 0 };
        } else if (type === 'boss' || bossDefinitions[type]) {
          const bossKind = type === 'boss' ? bossTypeForWave(game.wave || 5) : type;
          const boss = bossDefinitions[bossKind] || bossDefinitions.bossWarden;
          const bossTier = Math.max(0, Math.floor((game.wave - 5) / 10));
          const bossCycle = bossCycleForWave(game.wave || 5);
          const introBoss = bossKind === 'bossWarden' && game.wave === 5;
          const secondBoss = bossKind === 'bossPrism' && game.wave === 10;
          const latePower = introBoss || secondBoss ? 0 : lateBossIntensity(game.wave || 1);
          const lateHpMult = 1 + Math.min(0.75, latePower * 0.075);
          const lateSpeedMult = 1 + Math.min(0.24, latePower * 0.025);
          const lateTimerMult = 1 / (1 + Math.min(0.42, latePower * 0.04));
          const difficultyScale = 1.32 + Math.max(0, game.wave - 5) * 0.024 + bossTier * 0.12 + latePower * 0.035;
          const hp = Math.round((boss.hpBase + game.wave * boss.hpScale) * difficultyScale * lateHpMult * (introBoss ? 0.68 : secondBoss ? 0.72 : 1));
          enemy = {

            type: 'boss',
            bossKind,
            bossName: bossDisplayName(bossKind, game.wave || 5),
