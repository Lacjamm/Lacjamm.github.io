<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Growzilla: Universe Eater</title>
  <style>
    :root{
      --bg:#070816;
      --panel:rgba(12,16,35,.82);
      --panel2:rgba(23,29,61,.88);
      --text:#f5fbff;
      --muted:#9fb4d8;
      --cyan:#36f7ff;
      --pink:#ff3ef2;
      --lime:#8dff64;
      --gold:#ffd76a;
      --red:#ff516d;
      --purple:#a875ff;
    }
    *{box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;}
    html,body{width:100%; height:100%; margin:0; overflow:hidden; background:radial-gradient(circle at top,#151b3d 0%,#070816 54%,#02030a 100%); color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;}
    #wrap{position:fixed; inset:0; overflow:hidden;}
    canvas{position:absolute; inset:0; width:100%; height:100%; display:block; background:#070816; cursor:crosshair; touch-action:none;}
    #hud{position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .25s ease;}
    #hud.visible{opacity:1;}
    .topbar{position:absolute; left:max(14px, env(safe-area-inset-left)); top:max(12px, env(safe-area-inset-top)); right:max(14px, env(safe-area-inset-right)); display:grid; grid-template-columns:minmax(190px, 390px) 1fr auto; gap:12px; align-items:start;}
    .hudcard{background:linear-gradient(180deg,rgba(24,31,70,.76),rgba(8,11,27,.72)); border:1px solid rgba(104,246,255,.18); box-shadow:0 10px 28px rgba(0,0,0,.24), inset 0 0 18px rgba(255,255,255,.03); border-radius:18px; padding:12px; backdrop-filter:blur(4px);}
    .stats{display:grid; gap:8px;}
    .line{display:flex; align-items:center; gap:9px; font-weight:800; letter-spacing:.02em; font-size:13px; color:#dfefff; text-shadow:0 0 12px rgba(54,247,255,.35);}
    .line span:first-child{min-width:58px; color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase;}
    .bar{height:10px; width:100%; background:rgba(255,255,255,.08); border-radius:999px; overflow:hidden; border:1px solid rgba(255,255,255,.08);}
    .fill{height:100%; width:0%; border-radius:999px; box-shadow:0 0 14px currentColor; transition:width .08s linear;}
    .hp{color:var(--red); background:linear-gradient(90deg,#ff345d,#ff9b6d);}
    .grow{color:var(--lime); background:linear-gradient(90deg,#65ff78,#dbff61);}
    .rage{color:var(--pink); background:linear-gradient(90deg,#ff3ef2,#ffb43e);}
    .dash{color:var(--cyan); background:linear-gradient(90deg,#36f7ff,#6e8cff);}
    .scoreBox{justify-self:center; text-align:center; min-width:270px;}
    .scoreMain{font-size:34px; line-height:1; font-weight:1000; letter-spacing:.03em; text-shadow:0 0 22px rgba(54,247,255,.45),0 0 36px rgba(255,62,242,.28);}
    .scoreSub{font-size:12px; color:var(--muted); margin-top:6px; display:flex; justify-content:center; gap:14px; flex-wrap:wrap;}
    .pill{display:inline-flex; align-items:center; gap:6px; padding:6px 9px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.09); font-size:12px; color:#eaf6ff; font-weight:800;}
    .rightHud{display:flex; gap:8px; align-items:flex-start;}
    .miniBtn{pointer-events:auto; border:1px solid rgba(255,255,255,.14); color:var(--text); background:rgba(13,18,42,.72); border-radius:14px; padding:10px 12px; font-weight:900; box-shadow:0 0 20px rgba(0,0,0,.18); cursor:pointer;}
    .miniBtn:hover{background:rgba(42,53,112,.8);}
    #toast{position:absolute; left:50%; top:18%; transform:translateX(-50%); pointer-events:none; font-weight:1000; font-size:clamp(20px,4vw,48px); letter-spacing:.04em; text-align:center; text-transform:uppercase; text-shadow:0 0 18px rgba(54,247,255,.9),0 0 36px rgba(255,62,242,.5); opacity:0; transition:opacity .18s ease, transform .18s ease; white-space:nowrap;}
    #toast.show{opacity:1; transform:translateX(-50%) scale(1.02);}
    #screen{position:absolute; inset:0; display:grid; place-items:center; padding:22px; background:radial-gradient(circle at center,rgba(54,247,255,.08),rgba(0,0,0,.45) 45%,rgba(0,0,0,.68)); transition:opacity .25s ease;}
    #screen.hidden{opacity:0; pointer-events:none;}
    .panel{width:min(980px,94vw); max-height:min(92vh,900px); overflow:auto; border-radius:30px; border:1px solid rgba(104,246,255,.26); background:linear-gradient(180deg,rgba(19,26,62,.92),rgba(8,10,24,.92)); box-shadow:0 24px 80px rgba(0,0,0,.45),0 0 80px rgba(54,247,255,.10), inset 0 0 50px rgba(255,255,255,.035); padding:26px; backdrop-filter:blur(10px);}
    .title{font-size:clamp(42px,7.4vw,92px); line-height:.86; margin:0; font-weight:1000; letter-spacing:-.06em; text-transform:uppercase; text-shadow:0 0 20px rgba(54,247,255,.65),0 0 44px rgba(255,62,242,.36);}
    .title small{display:block; font-size:.32em; letter-spacing:.22em; color:var(--lime); margin-bottom:8px; text-shadow:0 0 14px rgba(141,255,100,.55);}
    .subtitle{color:var(--muted); font-size:16px; line-height:1.6; max-width:720px; margin:16px 0 20px;}
    .grid{display:grid; gap:14px;}
    .cols{grid-template-columns:1.08fr .92fr; align-items:stretch;}
    .box{border:1px solid rgba(255,255,255,.11); background:rgba(255,255,255,.055); border-radius:22px; padding:16px; box-shadow:inset 0 0 25px rgba(255,255,255,.025);}
    .box h3{margin:0 0 10px; font-size:15px; letter-spacing:.1em; text-transform:uppercase; color:#effbff;}
    .controlsList{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; color:#d9e9ff; font-size:13px;}
    .key{display:inline-flex; min-width:34px; justify-content:center; padding:5px 8px; border-radius:9px; margin-right:4px; border:1px solid rgba(54,247,255,.25); background:rgba(54,247,255,.08); color:var(--cyan); font-weight:1000;}
    .actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:18px;}
    button.big{border:0; border-radius:18px; padding:14px 20px; color:#061018; background:linear-gradient(135deg,var(--cyan),var(--lime)); font-weight:1000; letter-spacing:.02em; font-size:15px; box-shadow:0 8px 28px rgba(54,247,255,.22),0 0 24px rgba(141,255,100,.18); cursor:pointer; text-transform:uppercase;}
    button.big.secondary{color:#f6fbff; background:linear-gradient(135deg,rgba(255,62,242,.9),rgba(108,115,255,.95));}
    button.big.ghost{color:#eaf7ff; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.13); box-shadow:none;}
    button.big:active,.miniBtn:active{transform:translateY(1px) scale(.99);}
    .shopGrid,.mutGrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; margin-top:14px;}
    .cardBtn{border:1px solid rgba(255,255,255,.12); background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.035)); border-radius:22px; padding:15px; color:#f4fbff; text-align:left; cursor:pointer; min-height:180px; display:flex; flex-direction:column; gap:8px; box-shadow:0 0 28px rgba(0,0,0,.15);}
    .cardBtn:hover{border-color:rgba(54,247,255,.48); box-shadow:0 0 28px rgba(54,247,255,.10);}
    .cardBtn h3{font-size:17px; margin:0; color:#fff; letter-spacing:0; text-transform:none;}
    .cardBtn p{font-size:13px; line-height:1.45; color:var(--muted); margin:0; flex:1;}
    .cardMeta{display:flex; justify-content:space-between; gap:8px; align-items:center; font-weight:900; color:var(--gold); font-size:13px;}
    .badge{display:inline-flex; align-items:center; border-radius:999px; padding:5px 8px; background:rgba(255,255,255,.08); color:#eaffff; border:1px solid rgba(255,255,255,.1); font-size:12px; font-weight:900;}
    .charGrid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:13px; margin-top:14px;}
    .charCard{min-height:165px;}
    .charCard.active{border-color:rgba(141,255,100,.55); box-shadow:0 0 0 2px rgba(141,255,100,.18), 0 0 28px rgba(141,255,100,.12);}
    .charVisual{height:72px; border-radius:18px; display:grid; place-items:center; font-size:38px; margin-bottom:8px; background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.18), rgba(255,255,255,.05) 40%, rgba(0,0,0,.10) 100%); border:1px solid rgba(255,255,255,.08);}
    .charCard small{color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase;}
    #mobileControls{position:absolute; right:max(12px, env(safe-area-inset-right)); bottom:max(16px, env(safe-area-inset-bottom)); display:flex; gap:10px; pointer-events:auto; opacity:0; transition:opacity .25s;}
    #mobileControls.visible{opacity:1;}
    .roundAction{width:68px; height:68px; border-radius:50%; border:1px solid rgba(255,255,255,.18); color:#faffff; background:rgba(15,20,48,.72); backdrop-filter:blur(4px); font-weight:1000; font-size:12px; box-shadow:0 0 22px rgba(54,247,255,.1), inset 0 0 20px rgba(255,255,255,.035);}
    .roundAction.rageReady{background:radial-gradient(circle,var(--pink),rgba(15,20,48,.72)); animation:pulse 1s infinite alternate;}
    @keyframes pulse{from{box-shadow:0 0 18px rgba(255,62,242,.28);}to{box-shadow:0 0 42px rgba(255,62,242,.70);}}
    .floatingTip{position:absolute; left:50%; bottom:max(18px, env(safe-area-inset-bottom)); transform:translateX(-50%); color:rgba(235,247,255,.74); text-align:center; font-size:12px; letter-spacing:.04em; text-transform:uppercase; pointer-events:none; text-shadow:0 0 18px #000;}
    @media (max-width:780px){
      .topbar{grid-template-columns:1fr auto; gap:8px;}
      .scoreBox{grid-column:1 / -1; justify-self:stretch; order:3; min-width:0;}
      .scoreMain{font-size:24px;}
      .rightHud{justify-content:end;}
      .cols{grid-template-columns:1fr;}
      .shopGrid,.mutGrid,.charGrid{grid-template-columns:1fr;}
      .controlsList{grid-template-columns:1fr;}
      .panel{padding:20px; border-radius:24px;}
      #mobileControls{opacity:1;}
      .roundAction{width:62px;height:62px;}
    }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="topbar">
        <div class="hudcard stats">
          <div class="line"><span>Health</span><div class="bar"><div id="hpFill" class="fill hp"></div></div><b id="hpText">100</b></div>
          <div class="line"><span>Growth</span><div class="bar"><div id="growFill" class="fill grow"></div></div><b id="levelText">Lv 1</b></div>
          <div class="line"><span>Rage</span><div class="bar"><div id="rageFill" class="fill rage"></div></div><b id="rageText">0%</b></div>
          <div class="line"><span>Dash</span><div class="bar"><div id="dashFill" class="fill dash"></div></div><b id="dashText">100%</b></div>
        </div>
        <div class="hudcard scoreBox">
          <div id="scoreText" class="scoreMain">0</div>
          <div class="scoreSub">
            <span id="coinText" class="pill">💎 0</span>
            <span id="stageText" class="pill">Tiny Terror</span>
            <span id="wantedText" class="pill">🚨 0</span>
            <span id="comboText" class="pill">Combo x1</span>
          </div>
        </div>
        <div class="rightHud">
          <button id="muteBtn" class="miniBtn" title="Mute">🔊</button>
          <button id="pauseBtn" class="miniBtn" title="Pause">Ⅱ</button>
        </div>
      </div>
      <div id="mobileControls">
        <button class="roundAction" data-touch="dash">DASH</button>
        <button class="roundAction" data-touch="attack">SMASH</button>
        <button id="rageButton" class="roundAction" data-touch="rage">RAGE</button>
      </div>
      <div class="floatingTip">WASD/Arrows move · Space dash · E smash · R rage · Click/touch to steer</div>
    </div>
    <div id="toast"></div>
    <div id="screen"></div>
  </div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const screen = document.getElementById('screen');
  const toastEl = document.getElementById('toast');
  const mobileControls = document.getElementById('mobileControls');
  const rageButton = document.getElementById('rageButton');
  const muteBtn = document.getElementById('muteBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  const ui = {
    hpFill: document.getElementById('hpFill'), hpText: document.getElementById('hpText'),
    growFill: document.getElementById('growFill'), levelText: document.getElementById('levelText'),
    rageFill: document.getElementById('rageFill'), rageText: document.getElementById('rageText'),
    dashFill: document.getElementById('dashFill'), dashText: document.getElementById('dashText'),
    scoreText: document.getElementById('scoreText'), coinText: document.getElementById('coinText'),
    stageText: document.getElementById('stageText'), wantedText: document.getElementById('wantedText'), comboText: document.getElementById('comboText')
  };

  const TAU = Math.PI * 2;
  const WORLD = { w: 5200, h: 5200 };
  const keys = Object.create(null);
  const pointer = { x: 0, y: 0, worldX: 0, worldY: 0, active: false, lastWorldX: 0, lastWorldY: 0 };
  const camera = { x: 0, y: 0, shake: 0 };
  const CELL = 260;
  const LIMITS = { particles: 170, pickups: 230, bullets: 90, floatTexts: 55 };
  const LOW_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  let bgCache = null;
  let vignetteCache = null;
  const rng = mulberry32(Date.now() & 0xffffffff);

  let W = 1, H = 1, DPR = 1;
  let lastTime = 0;
  let phase = 'menu';
  let pausedByUser = false;
  let audioCtx = null;
  let muted = loadBool('growzillaMuted', false);
  let best = loadNum('growzillaBest', 0);
  let bank = loadNum('growzillaBank', 0);
  let upgrades = loadJSON('growzillaUpgrades', { magnet: 0, armor: 0, engine: 0, stomach: 0 });
  let selectedCharacter = (() => { try { return localStorage.getItem('growzillaCharacter') || 'kaiju'; } catch { return 'kaiju'; } })();
  let game = null;
  let toastTimer = 0;
  let hudTimer = 0;

  const objectTypes = [
    { id:'atom', label:'Atoms', req:1, r:5, hp:1, mass:5, score:8, coin:1, color:'#65f7ff', shape:'atom', weight:35 },
    { id:'molecule', label:'Molecules', req:1, r:8, hp:1, mass:8, score:13, coin:1, color:'#8dff64', shape:'molecule', weight:32 },
    { id:'dust', label:'Cosmic Dust', req:2, r:11, hp:1, mass:14, score:24, coin:1, color:'#ffd76a', shape:'dust', weight:28 },
    { id:'cell', label:'Cells', req:3, r:15, hp:1, mass:24, score:42, coin:1, color:'#ff7ce8', shape:'cell', weight:25 },
    { id:'bug', label:'Bugs', req:4, r:19, hp:1, mass:38, score:70, coin:2, color:'#b8ff66', shape:'bug', weight:22 },
    { id:'pebble', label:'Pebbles', req:5, r:24, hp:1, mass:58, score:112, coin:2, color:'#c8d2ff', shape:'rock', weight:20 },
    { id:'boulder', label:'Boulders', req:6, r:31, hp:2, mass:86, score:175, coin:3, color:'#9aa3bf', shape:'rock', weight:18 },
    { id:'tree', label:'Trees', req:7, r:37, hp:2, mass:125, score:260, coin:4, color:'#50f075', shape:'tree', weight:16 },
    { id:'person', label:'People', req:8, r:24, hp:1, mass:150, score:340, coin:5, color:'#ffd0a8', shape:'person', weight:18 },
    { id:'house', label:'Houses', req:9, r:46, hp:3, mass:210, score:470, coin:7, color:'#ff8d56', shape:'house', weight:14 },
    { id:'city', label:'Cities', req:10, r:58, hp:4, mass:300, score:700, coin:10, color:'#46dcff', shape:'city', weight:12 },
    { id:'mountain', label:'Mountains', req:11, r:72, hp:5, mass:430, score:1020, coin:14, color:'#a875ff', shape:'mountain', weight:10 },
    { id:'moon', label:'Moons', req:12, r:86, hp:5, mass:600, score:1450, coin:20, color:'#dce8ff', shape:'planet', weight:9 },
    { id:'planet', label:'Planets', req:13, r:106, hp:7, mass:820, score:2200, coin:28, color:'#49a6ff', shape:'planet', weight:8 },
    { id:'gasgiant', label:'Gas Giants', req:14, r:128, hp:8, mass:1050, score:3250, coin:38, color:'#ffb45f', shape:'planet', weight:6 },
    { id:'star', label:'Stars', req:15, r:142, hp:9, mass:1350, score:4700, coin:55, color:'#ffd65c', shape:'star', weight:5 },
    { id:'blackhole', label:'Black Holes', req:16, r:132, hp:10, mass:1650, score:6500, coin:72, color:'#9b5cff', shape:'blackhole', weight:4 },
    { id:'solarsystem', label:'Solar Systems', req:17, r:162, hp:11, mass:2100, score:9000, coin:95, color:'#61f7ff', shape:'system', weight:3 },
    { id:'galaxy', label:'Galaxies', req:19, r:192, hp:13, mass:3000, score:14500, coin:140, color:'#ff64f5', shape:'galaxy', weight:2 }
  ];

  const HUMAN_LEVEL = 8;
  const CIVILIZATION_OBJECTS = new Set(['person', 'house', 'city']);

const enemyTypes = {
    police: { id:'police', label:'Police Car', r:16, hp:1, speed:178, range:330, fire:1.75, damage:6, score:95, coin:1, color:'#45a8ff' },
    swat: { id:'swat', label:'SWAT Van', r:22, hp:2, speed:132, range:420, fire:1.58, damage:10, score:190, coin:2, color:'#5868ff' },
    tank: { id:'tank', label:'Tank', r:30, hp:4, speed:86, range:560, fire:2.15, damage:16, score:430, coin:5, color:'#7cff64' },
    heli: { id:'heli', label:'Attack Helicopter', r:24, hp:3, speed:148, range:600, fire:1.35, damage:11, score:360, coin:4, color:'#ff4be7', flying:true }
  };

  const mutationPool = [
    { id:'laser', name:'Gamma Breath', icon:'🔥', desc:'SMASH fires a beam that slices through matter, planets, and weakened cosmic snacks.', tag:'Beam attack' },
    { id:'tail', name:'Reality Tail', icon:'🦎', desc:'Your SMASH shockwave grows wider and hits harder. Great for clearing huge scale jumps.', tag:'Bigger smash' },
    { id:'magnet', name:'Gravity Belly', icon:'🧲', desc:'Gems, dust, and fragments zip toward you from farther away.', tag:'More loot' },
    { id:'armor', name:'Nebula Plates', icon:'🛡️', desc:'Gain max health and a recharging shield bubble against cosmic hazards.', tag:'Survive longer' },
    { id:'titan', name:'Mass Surge', icon:'🦶', desc:'Dash and SMASH can crack objects one size above your current scale.', tag:'Crack big stuff' },
    { id:'wings', name:'Photon Burst', icon:'🪽', desc:'Dash costs less, recharges faster, and shreds hazards you pass through.', tag:'Speed build' },
    { id:'burp', name:'Antimatter Burp', icon:'☢️', desc:'SMASH releases a cone that melts enemies and softens bigger objects.', tag:'Cone blast' }
  ];

  const shopItems = [
    { id:'magnet', name:'Gravity Magnet', icon:'🧲', desc:'Permanent larger cosmic pickup pull radius.', base:55, max:5 },
    { id:'armor', name:'Nebula Hide', icon:'🛡️', desc:'Start every run with more health and shield.', base:70, max:5 },
    { id:'engine', name:'Photon Engine', icon:'⚡', desc:'Dash recharges faster and costs less.', base:85, max:5 },
    { id:'stomach', name:'Universe Belly', icon:'🍔', desc:'Need less mass to level up.', base:95, max:5 }
  ];


  const characterPresets = [
    { id:'kaiju', icon:'🦖', name:'Kaiju Core', blurb:'Balanced starter monster with horns, claws, and a chunky kaiju build.', body:'#8dff64', accent:'#dffcff', detail:'#ff516d' },
    { id:'wyrm', icon:'🐉', name:'Nebula Wyrm', blurb:'A sleek cosmic dragon with fins, whiskers, and a longer tail.', body:'#61f7ff', accent:'#c7b3ff', detail:'#ffd76a' },
    { id:'amoeba', icon:'🫧', name:'Void Amoeba', blurb:'A squishy plasma blob with orbiting cores and stretchy goo limbs.', body:'#ff64f5', accent:'#8df6ff', detail:'#ffffff' },
    { id:'moth', icon:'🦋', name:'Star Moth', blurb:'An elegant winged eater with glowing wing panels and antennae.', body:'#ffd76a', accent:'#8df6ff', detail:'#ff8d56' }
  ];
  if (!characterPresets.some(c => c.id === selectedCharacter)) selectedCharacter = 'kaiju';

  function mulberry32(seed) {
    return function() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(a, b, c, d) { return Math.hypot(a - c, b - d); }
  function angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }
  function rand(a=1, b=0) { return b + rng() * (a - b); }
  function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
  function format(n) { return Math.floor(n).toLocaleString(); }

  function loadNum(k, fallback) {
    try { const v = Number(localStorage.getItem(k)); return Number.isFinite(v) ? v : fallback; }
    catch { return fallback; }
  }
  function loadBool(k, fallback) {
    try { const v = localStorage.getItem(k); return v === null ? fallback : v === '1'; }
    catch { return fallback; }
  }
  function loadJSON(k, fallback) {
    try { return Object.assign({}, fallback, JSON.parse(localStorage.getItem(k) || '{}')); }
    catch { return {...fallback}; }
  }
  function saveMeta() {
    try {
      localStorage.setItem('growzillaBest', String(best));
      localStorage.setItem('growzillaBank', String(bank));
      localStorage.setItem('growzillaUpgrades', JSON.stringify(upgrades));
      localStorage.setItem('growzillaMuted', muted ? '1' : '0');
      localStorage.setItem('growzillaCharacter', selectedCharacter);
    } catch {}
  }

  function resize() {
    // High-DPI canvases look great but can be the biggest source of in-game lag.
    // This cap keeps the neon look crisp while cutting the amount of pixels drawn per frame.
    const dprCap = window.innerWidth < 780 ? 1.1 : 1.35;
    DPR = Math.min(dprCap, window.devicePixelRatio || 1);
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
    buildCanvasCaches();
  }

  function makeLayer() {
    const layer = document.createElement('canvas');
    layer.width = Math.max(1, Math.floor(W * DPR));
    layer.height = Math.max(1, Math.floor(H * DPR));
    const g = layer.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    return [layer, g];
  }

  function buildCanvasCaches() {
    if (!W || !H) return;
    let g;
    [bgCache, g] = makeLayer();
    const grad = g.createRadialGradient(W*.5,H*.42,0,W*.5,H*.42,Math.max(W,H)*.78);
    grad.addColorStop(0,'#17224f');
    grad.addColorStop(.55,'#090b1f');
    grad.addColorStop(1,'#02030a');
    g.fillStyle = grad;
    g.fillRect(0,0,W,H);
    g.globalAlpha = .18;
    for (let i=0;i<90;i++) {
      const x = rng() * W, y = rng() * H, r = .6 + rng() * 1.7;
      g.fillStyle = i % 3 ? '#36f7ff' : '#ff3ef2';
      g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
    }
    g.globalAlpha = .08;
    g.fillStyle = '#ffffff';
    for (let y=0;y<H;y+=4) g.fillRect(0,y,W,1);
    g.globalAlpha = 1;

    [vignetteCache, g] = makeLayer();
    const vg = g.createRadialGradient(W/2,H/2,Math.min(W,H)*.22,W/2,H/2,Math.max(W,H)*.72);
    vg.addColorStop(0,'rgba(0,0,0,0)');
    vg.addColorStop(1,'rgba(0,0,0,.54)');
    g.fillStyle = vg;
    g.fillRect(0,0,W,H);
  }

  window.addEventListener('resize', resize, { passive:true });
  resize();

  function ensureAudio() {
    if (muted || audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch { audioCtx = null; }
  }
  function sound(kind='pop', gain=0.035) {
    if (muted || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = kind === 'boom' ? 280 : 1200;
    osc.type = kind === 'laser' ? 'sawtooth' : kind === 'boom' ? 'triangle' : 'square';
    const f1 = kind === 'coin' ? 880 : kind === 'level' ? 440 : kind === 'laser' ? 260 : kind === 'hurt' ? 95 : 170;
    const f2 = kind === 'coin' ? 1320 : kind === 'level' ? 740 : kind === 'laser' ? 720 : kind === 'hurt' ? 65 : 62;
    osc.frequency.setValueAtTime(f1, now);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, f2), now + (kind === 'laser' ? .22 : .12));
    vol.gain.setValueAtTime(gain, now);
    vol.gain.exponentialRampToValueAtTime(0.0001, now + (kind === 'laser' ? .25 : .16));
    osc.connect(filter); filter.connect(vol); vol.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + (kind === 'laser' ? .27 : .18));
  }

  function showToast(text, ms=850) {
    toastEl.textContent = text;

  function showShop() {
